# WordPress CRS tuning. Tested with BunkerWeb 1.6.17, CRS 4.29. Keep this file as a "modsec-crs"
# config: it has no effect as a "modsec" config. Delete a rule to turn it off.
#
# The CRS 3 exclusion switch below does nothing on the default CRS 4. On CRS 4 the equivalent
# exclusions come from the wordpress-rule-exclusions plugin, activated through
# MODSECURITY_CRS_PLUGINS.

# Extend the accepted request content types for the WordPress REST API, uploads and AJAX requests.
# WordPress uses JSON for the REST API, multipart for media uploads and XML for legacy XML-RPC, and
# the CRS default list refuses some of the types it sends. Cost: the list applies to every path of
# the service, and the types without a body parser (octet-stream, plain text and a few more) are
# accepted without their body being inspected. The list is a pinned copy and does not follow CRS
# upgrades: check it again when BunkerWeb ships a newer CRS.
SecAction \
    "id:9878010,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/x-amf| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json| |application/octet-stream| |application/csp-report| |application/xss-auditor-report| |text/plain| |application/x-git-upload-pack-request| |application/x-git-receive-pack-request|'"

# CRS 3 only: switch on the built-in WordPress exclusion set. It does nothing on CRS 4 (use the
# wordpress-rule-exclusions plugin through MODSECURITY_CRS_PLUGINS instead). Delete it if you only
# run CRS 4.
SecAction \
    "id:9878011,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.crs_exclusions_wordpress=1'"

# Classic media uploader: CRS rule 932180 (restricted file upload) blocks any uploaded file
# whose name contains "class" (for example a class-schedule.pdf). The exclusion turns the rule off
# for the async-upload file field only, on POST /wp-admin/async-upload.php. Any other field or
# path, and every other rule on this one, stays active. Cost: a restricted file name is not
# flagged on that upload field.
SecRule REQUEST_METHOD "@streq POST" \
    "id:9878110,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@streq /wp-admin/async-upload.php" \
        "t:none,\
        ctl:ruleRemoveTargetById=932180;FILES:async-upload"

# REST media upload with the file's own content type: apps send the raw image with
# Content-Type image/png or image/jpeg to /wp-json/wp/v2/media, and CRS rule 920420 answers
# 403. The exclusion is limited to POST on that single path, so every other path keeps the
# content type check. Cost: any content type is accepted on that path.
SecRule REQUEST_METHOD "@streq POST" \
    "id:9878111,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@streq /wp-json/wp/v2/media" \
        "t:none,\
        ctl:ruleRemoveById=920420"
