# WordPress CRS tuning that MUST run before the OWASP CRS rules.
#
# "modsec-crs"-type configs are included ahead of the CRS ruleset, so the setvars
# below are already in place when the phase:1 CRS rules read them. The same
# directives in a plain "modsec"-type file load after the CRS and never take effect.
#
# Note: tx.crs_exclusions_wordpress is read only by CRS v3 core rules and is inert
# on the default CRS v4. On v4 the equivalent exclusions come from the
# wordpress-rule-exclusions plugin, activated via MODSECURITY_CRS_PLUGINS.

# Extend allowed content types for WordPress REST API, uploads, and AJAX requests
# WordPress uses various content types including JSON for REST API, multipart for media uploads,
# and XML for legacy XML-RPC. This rule ensures legitimate WordPress functionality isn't blocked.
SecAction \
         "id:10000,\
          phase:1,\
          nolog,\
          pass,\
          t:none,\
          setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/x-amf| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json| |application/octet-stream| |application/csp-report| |application/xss-auditor-report| |text/plain| |application/x-git-upload-pack-request| |application/x-git-receive-pack-request|'"

# CRS v3 only: activate the built-in WordPress exclusion set. Inert on CRS v4
# (use the wordpress-rule-exclusions plugin via MODSECURITY_CRS_PLUGINS instead).
SecAction "id:10003,phase:1,nolog,pass,t:none,setvar:'tx.crs_exclusions_wordpress=1'"

# Classic media uploader: CRS rule 932180 (restricted file upload) blocks any uploaded file
# whose name contains "class" (for example a class-schedule.pdf). The exclusion removes the
# rule for the async-upload file field only, on POST /wp-admin/async-upload.php. Any other
# field or path, and every other rule on this one, stays active.
SecRule REQUEST_METHOD "@streq POST" \
    "id:10010,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@streq /wp-admin/async-upload.php" \
        "t:none,\
        ctl:ruleRemoveTargetById=932180;FILES:async-upload"

# REST media upload with the file's own content type: apps send the raw image with
# Content-Type image/png or image/jpeg to /wp-json/wp/v2/media, and CRS rule 920420 answers
# 403. The exclusion is limited to POST on that single path, so every other path keeps the
# content-type allow-list.
SecRule REQUEST_METHOD "@streq POST" \
    "id:10011,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@streq /wp-json/wp/v2/media" \
        "t:none,\
        ctl:ruleRemoveById=920420"
