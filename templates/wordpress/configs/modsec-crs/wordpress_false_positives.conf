# WordPress admin-ajax exclusions. Tested with BunkerWeb 1.6.17, CRS 4.29. Keep this file as a
# modsec-crs config: it has no effect as a modsec config. Delete a rule to turn it off. The rules
# match the exact path /wp-admin/admin-ajax.php only, whatever the query string or path tricks
# ("//", "/./", "%2f") in the request.

# WordPress heartbeat and the other admin-ajax calls of the dashboard.
# 941130 and 942200 fire on admin-ajax action payloads (XSS attribute patterns and SQL comment
# or backtick patterns). Cost: both rules are off for every request to admin-ajax.php.
SecRule REQUEST_FILENAME "@streq /wp-admin/admin-ajax.php" \
    "id:9878101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=941130,\
    ctl:ruleRemoveById=942200"
# 942440 and 942450 fire on SQL comment sequences and hex-encoded text in admin-ajax POST bodies.
# Cost: both rules are off for every request to admin-ajax.php.
SecRule REQUEST_FILENAME "@streq /wp-admin/admin-ajax.php" \
    "id:9878102,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=942440,\
    ctl:ruleRemoveById=942450"

# XML-RPC intentionally keeps full CRS coverage. The only exclusion that would let pingbacks
# through is rule 949110 (the rule that blocks a request once its CRS score is too high), and
# removing it would switch off blocking for the whole endpoint. If you need XML-RPC, add an
# exclusion for the specific rules that fire on it.
