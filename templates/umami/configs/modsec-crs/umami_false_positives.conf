# Umami exclusions. Tested with Umami 3.4.1, BunkerWeb 1.6.17, CRS 4.29. Keep this file as a
# modsec-crs config: it has no effect as a modsec config. Delete a rule to turn its exception off.
#
# Every rule id below matched legitimate Umami traffic: page URLs, titles, referrers, event names
# and event data sent by the tracker, filters and searches sent by the dashboard, and symbol-heavy
# passwords. Each exclusion needs the method AND an exact path. Cost: the listed rules do not check
# the named argument (or the whole body for the tracker and reports). Rules 949110 and 959100 (the
# ones that block a request once its CRS score is too high) are never touched.

# Tracker endpoint (POST /api/send). Visitors' browsers post pageviews and events here from other
# sites. The text is whatever the visited page holds: its URL with query string, its title, the
# referrer URL, an event name and free-form event data. Event data keys are chosen by the site
# owner and are unbounded, so no argument can be named. These rules are skipped for the whole
# body of this one endpoint: path traversal and file
# inclusion (930xxx, 931100), shell and RCE (932xxx), SSRF (934110, 934190), XSS (941xxx) and SQL
# injection (942xxx). Every other rule (protocol, scanner, PHP, Java, log4j, other injection rules)
# still runs.
SecRule REQUEST_FILENAME "@streq /api/send" \
    "id:9875100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=930100,\
    ctl:ruleRemoveById=930110,\
    ctl:ruleRemoveById=930120,\
    ctl:ruleRemoveById=931100,\
    ctl:ruleRemoveById=932130,\
    ctl:ruleRemoveById=932160,\
    ctl:ruleRemoveById=932230,\
    ctl:ruleRemoveById=932250,\
    ctl:ruleRemoveById=932370,\
    ctl:ruleRemoveById=934110,\
    ctl:ruleRemoveById=934190,\
    ctl:ruleRemoveById=941100,\
    ctl:ruleRemoveById=941110,\
    ctl:ruleRemoveById=941120,\
    ctl:ruleRemoveById=941160,\
    ctl:ruleRemoveById=941180,\
    ctl:ruleRemoveById=941390,\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=942190,\
    ctl:ruleRemoveById=942270,\
    ctl:ruleRemoveById=942350,\
    ctl:ruleRemoveById=942360,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# Sign-in form (POST /api/auth/login). Passwords are free text, and password managers use quotes,
# semicolons, dollar signs and slashes ("a;b|c&d$HOME1" matches CRS rule 932160). Only the password
# argument is skipped. The username and every other argument stay inspected.
SecRule REQUEST_FILENAME "@streq /api/auth/login" \
    "id:9875101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930100;ARGS:json.password,\
    ctl:ruleRemoveTargetById=930110;ARGS:json.password,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.password,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.password,\
    ctl:ruleRemoveTargetById=932160;ARGS:json.password,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.password,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.password,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

