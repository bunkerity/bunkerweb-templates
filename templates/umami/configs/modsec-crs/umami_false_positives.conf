# A filter value with ../ (scanners request sites with a file name argument that climbs out of the
# folder, and the dashboard then lists it) also matches CRS rules 930100 and 930110 on the whole raw
# URI. The path is pinned by the anchored regex, so only the query string is skipped, and only for
# these two rules. Cost: those two rules do not read the query string of these dashboard requests.
SecRule REQUEST_FILENAME "@rx \A(?:/teams/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?(?:/api)?/websites/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:/[A-Za-z0-9/_-]+)?\z" \
    "id:9875125,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930100;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetById=930110;REQUEST_URI_RAW,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"

# After the owner opens a dashboard page whose URL holds a filter with a SQL OR condition, the
# browser sends that URL as the Referer of every asset and API call that the page makes, and the CRS
# rules that read the Referer header (941110, 941120, 941160, 942100) block them all. This rule
# needs a dashboard page Referer (same host, /websites/<id>), a GET or POST, and an asset, API or
# page path. It skips only the Referer header for those four rules. Cross-site visitors send an
# origin-only Referer, so this never touches them.
SecRule REQUEST_FILENAME "@rx \A/(?:[^/]+\.(?:js|json|ico|png|svg|css|webmanifest)|_next/.+|api/.+|images/.+|websites(?:/.*)?|teams/.+)\z" \
    "id:9875127,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=941110;REQUEST_HEADERS:Referer,\
    ctl:ruleRemoveTargetById=941120;REQUEST_HEADERS:Referer,\
    ctl:ruleRemoveTargetById=941160;REQUEST_HEADERS:Referer,\
    ctl:ruleRemoveTargetById=942100;REQUEST_HEADERS:Referer,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|POST)\z" \
        "t:none,\
        nolog,\
        chain"
        SecRule REQUEST_HEADERS:Referer "@rx \Ahttps?://[^/]+(?:/teams/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?/websites/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:[/?#].*)?\z" \
            "t:none,\
            nolog"

# Reports and saved definitions (funnels, goals, journeys, attribution, breakdown) carry paths,
# event names, query strings and free-text names or descriptions taken from the same data. Steps
# and filters are arrays of unbounded length (json.parameters.steps.array_N.value), so no target can
# be named. The injection rules listed below are skipped for the body of the report endpoints only.
SecRule REQUEST_FILENAME "@rx \A/api/reports(?:/[a-z]+)?\z" \
    "id:9875150,\
    phase:1,\
