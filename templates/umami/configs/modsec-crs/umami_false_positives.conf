# Admin sets the password of a user with POST /api/users/<id>. Passwords are free text, and password
# managers use quotes, semicolons, dollar signs and slashes ("a;b|c&d$HOME1" matches CRS rule
# 932160). Only the password argument is skipped. The username and every other argument stay
# inspected.
SecRule REQUEST_FILENAME "@rx \A/api/users/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\z" \
    "id:9875103,\
