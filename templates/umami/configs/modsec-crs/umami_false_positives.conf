    ctl:ruleRemoveTargetById=930120;ARGS:json.password,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.password,\
    ctl:ruleRemoveTargetById=932160;ARGS:json.password,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.password,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.password,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# A user changes their own password (POST /api/me/password). Passwords are free text, and password
# managers use quotes, semicolons, dollar signs and slashes ("a;b|c&d$HOME1" matches CRS rule
# 932160). Only the current and new password arguments are skipped. Every other argument stays
# inspected.
SecRule REQUEST_FILENAME "@streq /api/me/password" \
    "id:9875104,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930100;ARGS:json.currentPassword,\
    ctl:ruleRemoveTargetById=930110;ARGS:json.currentPassword,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.currentPassword,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.currentPassword,\
    ctl:ruleRemoveTargetById=932160;ARGS:json.currentPassword,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.currentPassword,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.currentPassword,\
    ctl:ruleRemoveTargetById=930100;ARGS:json.newPassword,\
    ctl:ruleRemoveTargetById=930110;ARGS:json.newPassword,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.newPassword,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.newPassword,\
    ctl:ruleRemoveTargetById=932160;ARGS:json.newPassword,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.newPassword,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.newPassword,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# Dashboard filters and searches, on the website data endpoints (/api/websites/<id>/stats, metrics,
# events, sessions...) and on the dashboard pages that keep the filters in the URL
# (/websites/<id>?...). Every filter value is data that visitors sent (paths, queries, titles,
# referrers, event names, campaigns, tags, hostnames, language, distinct ids), so it can hold SQL,
# markup, shell or ../ text, and clicking it in the dashboard sends it back as an argument. There is
# one rule per argument, and each skips only that argument. This first rule covers "path".
SecRule REQUEST_FILENAME "@rx \A(?:/teams/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?(?:/api)?/websites/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:/[A-Za-z0-9/_-]+)?\z" \
    "id:9875110,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930100;ARGS:path,\
    ctl:ruleRemoveTargetById=930110;ARGS:path,\
    ctl:ruleRemoveTargetById=930120;ARGS:path,\
    ctl:ruleRemoveTargetById=932130;ARGS:path,\
    ctl:ruleRemoveTargetById=932160;ARGS:path,\
    ctl:ruleRemoveTargetById=932230;ARGS:path,\
    ctl:ruleRemoveTargetById=932250;ARGS:path,\
    ctl:ruleRemoveTargetById=941100;ARGS:path,\
    ctl:ruleRemoveTargetById=941110;ARGS:path,\
    ctl:ruleRemoveTargetById=941120;ARGS:path,\
    ctl:ruleRemoveTargetById=941160;ARGS:path,\
    ctl:ruleRemoveTargetById=941390;ARGS:path,\
    ctl:ruleRemoveTargetById=942100;ARGS:path,\
    ctl:ruleRemoveTargetById=942190;ARGS:path,\
    ctl:ruleRemoveTargetById=942270;ARGS:path,\
    ctl:ruleRemoveTargetById=942360;ARGS:path,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"

