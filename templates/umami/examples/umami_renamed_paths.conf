# Umami with a renamed collect endpoint. Umami can serve the tracker POST under another path
# (COLLECT_API_ENDPOINT), for example /stats/api/collect, so that blockers and filters do not
# recognise it. CRS rules see the renamed request exactly like /api/send, and it needs the same
# exclusion as rule 9875100 in umami_false_positives.conf.
#
# This file is NOT part of the template: a plain import does not load it, so it removes nothing until you
# add it. Add it only when you set COLLECT_API_ENDPOINT: change the path below to your value, then add
# the file to the service as a custom config of type modsec-crs (BunkerWeb UI: Configs, New custom
# configuration, type "modsec-crs", the service of this template, the content of this file).
# The path below, /stats/api/collect, is only the example value.

# The same event, pageview and identify payloads as /api/send, under the renamed collect path. The same
# unbounded event data keys apply, so the same ids are skipped for this one path.
SecRule REQUEST_FILENAME "@streq /stats/api/collect" \
    "id:9875160,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=930100,\
    ctl:ruleRemoveById=930110,\
    ctl:ruleRemoveById=930120,\
    ctl:ruleRemoveById=931100,\
    ctl:ruleRemoveById=932130,\
    ctl:ruleRemoveById=932160,\
    ctl:ruleRemoveById=932230,\
    ctl:ruleRemoveById=932250,\
    ctl:ruleRemoveById=932370,\
    ctl:ruleRemoveById=934110,\
    ctl:ruleRemoveById=934190,\
    ctl:ruleRemoveById=941100,\
    ctl:ruleRemoveById=941110,\
    ctl:ruleRemoveById=941120,\
    ctl:ruleRemoveById=941160,\
    ctl:ruleRemoveById=941180,\
    ctl:ruleRemoveById=941390,\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=942190,\
    ctl:ruleRemoveById=942270,\
    ctl:ruleRemoveById=942350,\
    ctl:ruleRemoveById=942360,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"
