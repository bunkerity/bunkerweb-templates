# Vaultwarden 1.37.4 / BunkerWeb 1.6.15 recipe, scripted tests on 2026-10-06.
# EncStrings use random base64 that resembles attack payloads.
# Cost: these five rules skip ALL query, form and JSON arguments on matching writes.
# Literal indexed JSON targets are impractical; regex targets did not work in 1.6.15.
SecRule REQUEST_FILENAME "@rx \A/api/(?:ciphers|folders|sends)(?:/|\z)" \
    "id:9877100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS,\
    ctl:ruleRemoveTargetById=932125;ARGS,\
    ctl:ruleRemoveTargetById=932370;ARGS,\
    ctl:ruleRemoveTargetById=932380;ARGS,\
    ctl:ruleRemoveTargetById=941120;ARGS,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT)\z" \
        "t:none,\
        nolog"

# Encrypted attachment names trigger the multipart filename rule (phase 2).
SecRule REQUEST_FILENAME "@rx \A/api/ciphers/[0-9a-f-]{36}/attachment/[0-9a-f]+\z" \
    "id:9877101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920120;FILES:data,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"
