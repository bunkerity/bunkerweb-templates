# Vaultwarden exclusions for the OWASP Core Rule Set (made for Vaultwarden 1.37.4, BunkerWeb 1.6.17).
# Keep this file under the "modsec-crs" type: it does nothing under "modsec". Removing a rule turns
# its exception off, and saving or importing vault items can then fail with 403.
#
# The web vault and the apps encrypt every field before they send it. The server receives
# random-looking base64 text, which the CRS cannot read and which sometimes resembles a command, a
# path or an SQL fragment. A 300-item import carries about two thousand such strings, so some rule
# matches one of them in roughly a quarter of the imports.
#
# Writes (POST, PUT) to /api/ciphers, /api/folders and /api/sends skip eleven rules on the query
# string, form fields and JSON values: 930120, 932125, 932160, 932230, 932235, 932250, 932260,
# 932370, 932380, 941120 and 942100.
# Cost: on those writes these eleven rules no longer see an attack hidden in an argument. Every
# other rule still checks the arguments, and all rules still check headers, cookies and every other
# path. The JSON argument names carry array indices, so the arguments cannot be listed one by one.
SecRule REQUEST_FILENAME "@rx \A/api/(?:ciphers|folders|sends)(?:/|\z)" \
    "id:9877100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS,\
    ctl:ruleRemoveTargetById=932125;ARGS,\
    ctl:ruleRemoveTargetById=932160;ARGS,\
    ctl:ruleRemoveTargetById=932230;ARGS,\
    ctl:ruleRemoveTargetById=932235;ARGS,\
    ctl:ruleRemoveTargetById=932250;ARGS,\
    ctl:ruleRemoveTargetById=932260;ARGS,\
    ctl:ruleRemoveTargetById=932370;ARGS,\
    ctl:ruleRemoveTargetById=932380;ARGS,\
    ctl:ruleRemoveTargetById=941120;ARGS,\
    ctl:ruleRemoveTargetById=942100;ARGS,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT)\z" \
        "t:none,\
        nolog"

# Attachment upload (POST /api/ciphers/<id>/attachment/<id>): the attachment name is encrypted too,
# and it trips rule 920120 (multipart file name check). Only the "data" file part skips it. Cost:
# that one check is off for the file name of an attachment.
SecRule REQUEST_FILENAME "@rx \A/api/ciphers/[0-9a-f-]{36}/attachment/[0-9a-f]+\z" \
    "id:9877101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920120;FILES:data,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"
