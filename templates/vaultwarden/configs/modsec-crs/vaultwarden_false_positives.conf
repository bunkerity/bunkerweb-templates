# Vaultwarden exclusions. Tested with Vaultwarden 1.37.4, BunkerWeb 1.6.17, CRS 4.29. Keep this
# file as a modsec-crs config: it has no effect as a modsec config. Delete a rule to turn its
# exception off, and saving vault items then fails with 403.
#
# Vaultwarden stores encrypted strings: random base64 that resembles attack payloads to the CRS.
# Writes (POST, PUT) to /api/ciphers, /api/folders and /api/sends skip the rules 930120, 932125,
# 932370, 932380 and 941120.
# Cost: these five rules skip ALL query, form and JSON arguments on those writes. The JSON argument
# names carry array indices, so the arguments cannot be listed one by one.
SecRule REQUEST_FILENAME "@rx \A/api/(?:ciphers|folders|sends)(?:/|\z)" \
    "id:9877100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS,\
    ctl:ruleRemoveTargetById=932125;ARGS,\
    ctl:ruleRemoveTargetById=932370;ARGS,\
    ctl:ruleRemoveTargetById=932380;ARGS,\
    ctl:ruleRemoveTargetById=941120;ARGS,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT)\z" \
        "t:none,\
        nolog"

# Attachment upload (POST /api/ciphers/<id>/attachment/<id>): the attachment name is encrypted too,
# and it trips rule 920120 (multipart file name check). Only the "data" file part skips it. Cost:
# that one check is off for the file name of an attachment.
SecRule REQUEST_FILENAME "@rx \A/api/ciphers/[0-9a-f-]{36}/attachment/[0-9a-f]+\z" \
    "id:9877101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920120;FILES:data,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"
