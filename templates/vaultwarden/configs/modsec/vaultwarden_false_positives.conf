# Vaultwarden 1.37.4 / BunkerWeb 1.6.15 recipe, scripted tests on 2026-10-06.
# EncStrings use random base64 that resembles attack payloads.
# Cost: these five rules skip ALL query, form and JSON arguments on matching writes.
# Literal indexed JSON targets are impractical; regex targets did not work in 1.6.15.
SecRule REQUEST_FILENAME "@rx ^/api/(?:ciphers|folders|sends)(?:/|$)" \
    "id:77200,phase:1,pass,nolog,t:none,t:normalizePath,chain,\
    ctl:ruleRemoveTargetById=930120;ARGS,ctl:ruleRemoveTargetById=932125;ARGS,\
    ctl:ruleRemoveTargetById=932370;ARGS,ctl:ruleRemoveTargetById=932380;ARGS,\
    ctl:ruleRemoveTargetById=941120;ARGS"
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT)$" "t:none,nolog"

# Encrypted attachment names trigger the multipart filename rule (phase 2).
SecRule REQUEST_FILENAME "@rx ^/api/ciphers/[0-9a-f-]{36}/attachment/[0-9a-f]+$" \
    "id:77201,phase:1,pass,nolog,t:none,t:normalizePath,chain,\
    ctl:ruleRemoveTargetById=920120;FILES:data"
SecRule REQUEST_METHOD "@streq POST" "t:none,nolog"
