# Directus Flows, "Run Script" operation. Tested with Directus 11.17.4 and BunkerWeb 1.6.17.
#
# Why it is needed: a Run Script operation stores its JavaScript in the field options.code. To the
# CRS, ordinary JavaScript looks like an attack (function calls, string handling, shell-like
# characters), so saving a Flow that holds even the sample script Directus pre-fills is refused
# with a 403 and a generic error toast in the admin app.
#
# What it lets through: the XSS, SQL injection, command injection, PHP injection, Node.js
# injection and file access checks skip that one field, options.code, and only on the /operations
# routes with POST, PUT and PATCH. Every other field and every other route keeps all checks.
#
# What it costs: the JavaScript saved in a Run Script operation is no longer inspected by those
# checks. Directus runs the code in a sandbox and only users who can edit Flows can write it, so
# keep that permission for administrators.
#
# How to remove it: delete this file from the template's Custom configs and Run Script operations
# are refused again.
SecRule REQUEST_FILENAME "@rx \A/operations(?:/|\z)" \
    "id:9853100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-XSS;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SQLI;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RCE;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-PHP;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-GENERIC;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-LFI;ARGS:json.options.code"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT|PATCH)\z" \
        "t:none,\
        nolog"
