# Directus Flows, "Run Script" operation. For Directus 11.17.4 on BunkerWeb 1.6.17.
#
# Why it is needed: a Run Script operation stores its JavaScript in the field options.code. To the
# CRS, ordinary JavaScript looks like an attack (function calls, string handling, shell-like
# characters), so saving a Flow that holds even the sample script Directus pre-fills is refused
# with a 403 and a generic error toast in the admin app.
#
# What it lets through: the XSS, SQL injection, command injection, PHP injection, Node.js
# injection and file access checks skip the code of a Run Script operation, on the routes where
# Directus sends it, and only there:
#   - POST /operations ("Copy to Flow" in the admin app, and API clients) and
#     PATCH /operations/<operation id> (API clients). Only these two routes and methods, and only
#     the field options.code.
#   - PATCH /flows/<flow id> (Save in the Flow editor). The editor sends the operations of a Flow
#     inside the Flow itself, one level deeper for each step of the chain, so there is no fixed
#     list of fields to name. This rule applies when the JSON body of that one request holds a
#     Run Script code field: operation.options.code, operations.create.<n>.options.code or
#     operations.update.<n>.options.code, with any number of resolve or reject steps in between.
#     It then skips the six check families above for every field of that request body. The request
#     must have no query string. A save with no such field (a new Flow name or description, a log
#     step) gets all the checks. Headers, cookies, the path and the names of the fields stay fully
#     checked, and so do all other check families.
# On every other route the code keeps all checks.
#
# What it costs: the JavaScript saved in a Run Script operation is no longer inspected by those
# checks. On the Flow editor route the same goes for the rest of a save that holds a code field:
# a Flow's name or description, or the message of a log step, sent in that same request, is not
# inspected either. A field that is only named like a code field (a JSON key spelled
# "operation.options.code") gets the same treatment. Anyone who can reach Directus can send such a
# request: the WAF decides first, and Directus checks afterwards whether the user may save the
# Flow, so keep that permission for administrators. Directus runs the code in a sandbox. An API
# client that saves a Flow with a query string (PATCH /flows/<id>?fields=id) does not get this
# exception: its body gets the ordinary checks, so a save without script-like text still passes
# and one with code in it is refused. Drop the query string, or use
# PATCH /operations/<operation id>.
#
# How to remove it: delete this file from the template's Custom configs and Run Script operations
# are refused again.
SecRule REQUEST_FILENAME "@rx \A/operations\z" \
    "id:9853100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-XSS;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SQLI;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RCE;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-PHP;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-GENERIC;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-LFI;ARGS:json.options.code"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"
SecRule REQUEST_FILENAME "@rx \A/operations/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\z" \
    "id:9853101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-XSS;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SQLI;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RCE;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-PHP;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-GENERIC;ARGS:json.options.code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-LFI;ARGS:json.options.code"
    SecRule REQUEST_METHOD "@streq PATCH" \
        "t:none,\
        nolog"
SecRule REQUEST_FILENAME "@rx \A/flows/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\z" \
    "id:9853102,\
    phase:2,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-XSS;ARGS,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SQLI;ARGS,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RCE;ARGS,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-PHP;ARGS,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-GENERIC;ARGS,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-LFI;ARGS"
    SecRule REQUEST_METHOD "@streq PATCH" \
        "t:none,\
        nolog,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx \Aapplication/json\s*(?:;|\z)" \
            "t:none,\
            t:lowercase,\
            nolog,\
            chain"
            SecRule &ARGS_GET "@eq 0" \
                "t:none,\
                nolog,\
                chain"
                SecRule ARGS_NAMES "@rx \Ajson\.operation(?:s\.(?:create|update)\.array_[0-9]+)?(?:\.(?:resolve|reject))*\.options\.code\z" \
                    "t:none,\
                    nolog"
