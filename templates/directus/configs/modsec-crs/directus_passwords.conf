# Directus passwords with symbols. For Directus 11.17.4 on BunkerWeb 1.6.17.
#
# Why it is needed: a password generated with every symbol (quotes, semicolons, brackets, dashes)
# can look like an attack to the CRS. About 3 random 24 character passwords in 100 are refused with
# a 403 before Directus can answer, so the user can neither set that password nor sign in with it.
# Passwords made of letters, digits and the symbols !@#$%^&* are rarely affected.
#
# What it lets through: the SQL injection, command injection, PHP injection, Java injection and
# template injection checks skip the password field, and only where the admin app sends one:
#   - POST /auth/login and POST /auth/password/reset (sign in, reset a password)
#   - POST /users (create a user), POST /users/register and POST /users/invite/accept (register,
#     accept an invitation)
#   - PATCH /users/me and PATCH /users/<user id> (change a password)
#   - POST /users/me/tfa/generate (two-factor setup asks for the password)
# The cross-site scripting checks still read the field. Every other field, route and method keeps
# all checks. A password is hashed by Directus and is never run as a query, a command or a template.
#
# What it costs: the password field is no longer inspected by those checks.
#
# How to remove it: delete this file from the template's Custom configs. Passwords with some
# symbols are refused again.
SecRule REQUEST_FILENAME "@rx \A/(?:auth/(?:login|password/reset)|users(?:/register|/invite/accept|/me/tfa/generate)?)\z" \
    "id:9853110,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SQLI;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RCE;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-PHP;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-JAVA;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-GENERIC;ARGS:json.password"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"
SecRule REQUEST_FILENAME "@rx \A/users/(?:me|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})\z" \
    "id:9853111,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SQLI;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RCE;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-PHP;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-JAVA;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-GENERIC;ARGS:json.password"
    SecRule REQUEST_METHOD "@streq PATCH" \
        "t:none,\
        nolog"
