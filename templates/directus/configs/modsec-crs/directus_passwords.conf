# Directus passwords with symbols. Tested with Directus 11.17.4 and BunkerWeb 1.6.17.
#
# Why it is needed: a password generated with every symbol (quotes, semicolons, brackets, dashes)
# can look like an attack to the CRS. About 3 random 24 character passwords in 100 are refused with
# a 403 before Directus can answer, so the user can neither set that password nor sign in with it.
# Passwords made of letters, digits and the symbols !@#$%^&* are rarely affected.
#
# What it lets through: the SQL injection, command injection, PHP injection, Java injection and
# template injection checks skip the password field of the sign-in, password reset and user
# routes, for POST, PUT and PATCH only. The cross-site scripting checks still read it. Every other
# field and every other route keeps all checks. A password is hashed by Directus and is never run
# as a query, a command or a template.
#
# What it costs: the password field is no longer inspected by those checks.
#
# How to remove it: delete this file from the template's Custom configs. Passwords with some
# symbols are refused again.
SecRule REQUEST_FILENAME "@rx \A/(?:auth/(?:login|password/reset)|users(?:/|\z))" \
    "id:9853110,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SQLI;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RCE;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-PHP;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-JAVA;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-GENERIC;ARGS:json.password"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT|PATCH)\z" \
        "t:none,\
        nolog"
