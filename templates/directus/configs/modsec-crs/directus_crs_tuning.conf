# Directus CRS tuning. Validated against Directus 11 and OWASP CRS 4.29 on BunkerWeb 1.6.14.
#
# Type is "modsec-crs" (included before the CRS) because tx.restricted_headers_basic is a
# CRS policy variable: rule 901165 defaults it only while it is still unset, so setting it
# here wins. The same SecAction placed in "modsec" would load after CRS initialisation and
# do nothing.
#
# Why this is needed. CRS 4 lists /expect/ among the always-forbidden headers, so rule
# 920450 answers 403 to any request carrying "Expect: 100-continue". curl adds that header
# by itself once a request body passes 1 KB, and several HTTP client libraries do the same,
# so scripted imports and bulk writes against the Directus API fail with a 403 that looks
# like it came from Directus. Observed on POST /items/<collection> with a 2 MB JSON body.
#
# Tradeoff. This drops /expect/ only, and keeps every other restricted header, including
# /proxy/ and the method-override family. nginx answers 100-continue itself, before the
# request is proxied to Directus.
#
# The list below is CRS 4.29's own, copied verbatim minus /expect/. Re-check it when
# BunkerWeb ships a newer CRS: a stale list here silently narrows what 920450 inspects.
SecAction \
    "id:3000100,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    setvar:'tx.restricted_headers_basic=/content-encoding/ /proxy/ /lock-token/ /content-range/ /if/ /x-http-method-override/ /x-http-method/ /x-method-override/ /x-middleware-subrequest/'"
