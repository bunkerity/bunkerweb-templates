# Directus Expect header. For Directus 11.17.4 on BunkerWeb 1.6.17.
#
# Why it is needed: CRS 4 refuses with a 403 any request that carries "Expect: 100-continue".
# curl adds that header by itself once a request body passes 1 KB, and several HTTP client
# libraries do the same. Scripted imports and bulk writes to the Directus API then fail with a
# 403 that looks like it came from Directus.
#
# What it lets through: the Expect header, on every path of the service. Every other restricted
# header (Proxy, the method-override family and so on) stays blocked. nginx answers 100-continue
# itself, before the request reaches Directus.
#
# How to remove it: delete this file from the template's Custom configs and Expect is refused
# again. The list below is the CRS 4.29 list of restricted headers without Expect. Check it again
# when BunkerWeb ships a newer CRS: a stale list narrows what the CRS inspects.
SecAction \
    "id:9853010,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.restricted_headers_basic=/content-encoding/ /proxy/ /lock-token/ /content-range/ /if/ /x-http-method-override/ /x-http-method/ /x-method-override/ /x-middleware-subrequest/'"
