# Directus CRS tuning. Tested with Directus 11, BunkerWeb 1.6.17, CRS 4.29.
#
# Why it is needed: CRS 4 lists /expect/ among the always-forbidden headers, so rule 920450 answers
# 403 to any request that carries "Expect: 100-continue". curl adds that header by itself once a
# request body passes 1 KB, and several HTTP client libraries do the same. Scripted imports and
# bulk writes against the Directus API (for example POST /items/<collection> with a 2 MB JSON
# body) then fail with a 403 that looks like it came from Directus.
#
# What it costs: the Expect header is no longer refused, on every path of the service. Every other
# restricted header (Proxy, the method-override family and so on) stays blocked. nginx answers
# 100-continue itself, before the request reaches Directus.
#
# How to adjust: the list below replaces the CRS default list of restricted headers, copied from
# CRS 4.29 minus /expect/. Check it again when BunkerWeb ships a newer CRS: a stale list silently
# narrows what rule 920450 inspects. Delete the whole rule to block Expect again. Keep this file as
# a modsec-crs config: it has no effect as a modsec config.
SecAction \
    "id:9853010,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.restricted_headers_basic=/content-encoding/ /proxy/ /lock-token/ /content-range/ /if/ /x-http-method-override/ /x-http-method/ /x-method-override/ /x-middleware-subrequest/'"
