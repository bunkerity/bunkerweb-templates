# Forgejo 16.0.5 / BunkerWeb 1.6.15 recipe, scripted tests on 2026-10-06.
# Smart HTTP and LFS use .git paths; keep restricted-file checks elsewhere.
SecRule REQUEST_FILENAME "@rx ^/[^/]+/[^/]+\.git/(?:info/refs|git-upload-pack|git-receive-pack|info/lfs/.+)$" \
    "id:77300,phase:1,pass,nolog,t:none,t:normalizePath,chain,ctl:ruleRemoveTargetById=930130;REQUEST_FILENAME"
SecRule REQUEST_METHOD "@rx ^(?:GET|POST|PUT)$" "t:none,nolog"

# These POST/PUT routes use Git, LFS or binary package content types.
# Rule removal accepts any content type on the matched requests.
SecRule REQUEST_FILENAME "@rx ^/(?:[^/]+/[^/]+\.git/(?:git-upload-pack|git-receive-pack|info/lfs/.+)|api/packages/[^/]+/.+)$" \
    "id:77301,phase:1,pass,nolog,t:none,t:normalizePath,chain,ctl:ruleRemoveById=920420"
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT)$" "t:none,nolog"

# Source paths legitimately end in extensions forbidden by the CRS.
SecRule REQUEST_FILENAME "@rx ^/(?:api/v1/repos/[^/]+/[^/]+/contents/.+|[^/]+/[^/]+/(?:src|raw|blame|_new|_edit|_delete|_upload|commits)/.+)$" \
    "id:77302,phase:1,pass,nolog,t:none,t:normalizePath,chain,ctl:ruleRemoveById=920440"
SecRule REQUEST_METHOD "@rx ^(?:GET|HEAD|POST|PUT|PATCH|DELETE)$" "t:none,nolog"
