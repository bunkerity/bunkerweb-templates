# Forgejo Git, LFS, package and file-view exclusions: they let Git over HTTPS, LFS, package
# uploads and the viewing of repository files through the WAF. Tested with Forgejo 16.0.5,
# BunkerWeb 1.6.17, CRS 4.29. Each rule applies only to the paths and methods named in it. Delete
# a rule to turn its exception off. Keep this file as a modsec-crs config: it has no effect as a
# modsec config.
#
# Smart HTTP and LFS use .git paths (info/refs, git-upload-pack, git-receive-pack, info/lfs/...),
# which rule 930130 (restricted file) would refuse. Cost: that rule no longer checks the path of
# those requests. It still checks every other path.
SecRule REQUEST_FILENAME "@rx \A/[^/]+/[^/]+\.git/(?:info/refs|git-upload-pack|git-receive-pack|info/lfs/.+)\z" \
    "id:9856100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930130;REQUEST_FILENAME,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|POST|PUT)\z" \
        "t:none,\
        nolog"

# Git, LFS and package uploads: these POST and PUT routes carry Git, LFS or binary package content
# types, which CRS rule 920420 rejects. Cost: on the matched paths and methods any content type is
# accepted.
SecRule REQUEST_FILENAME "@rx \A/(?:[^/]+/[^/]+\.git/(?:git-upload-pack|git-receive-pack|info/lfs/.+)|api/packages/[^/]+/.+)\z" \
    "id:9856101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=920420,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT)\z" \
        "t:none,\
        nolog"

# Source browsing and editing: repository paths legitimately end in file extensions the CRS forbids
# (for example .sql, .env or .bak). This covers the web pages, the API contents route and the API
# raw route. Cost: rule 920440 (restricted file extension) is off on those paths, for every
# method. It still checks every other path.
SecRule REQUEST_FILENAME "@rx \A/(?:api/v1/repos/[^/]+/[^/]+/(?:contents|raw)/.+|[^/]+/[^/]+/(?:src|raw|blame|_new|_edit|_delete|_upload|commits)/.+)\z" \
    "id:9856102,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=920440,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|HEAD|POST|PUT|PATCH|DELETE)\z" \
        "t:none,\
        nolog"

# Viewing repository files: a file page (src, raw, blame) or the API raw and contents routes shows
# stored text as it is, and stored files often hold what the CRS reports as a leak when it sees it
# in a response: PHP source, SQL or Java error text, stack traces, a directory listing. Files named
# .env.example also look like restricted files. Cost: on GET and HEAD of these paths, the response
# data-leakage checks (every CRS rule tagged attack-disclosure) and the restricted-file name check
# (930130, path only) are off. Other pages, other methods and the request itself stay checked, so
# an issue or a wiki page that shows such text is still blocked. Plain-text commit and compare
# patches (.diff, .patch) are not file views and stay checked.
SecRule REQUEST_FILENAME "@rx \A/(?:[^/]+/[^/]+/(?:src|raw|blame)/.+|api/v1/repos/[^/]+/[^/]+/(?:raw|contents)/.+)\z" \
    "id:9856105,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveByTag=attack-disclosure,\
    ctl:ruleRemoveTargetById=930130;REQUEST_FILENAME,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|HEAD)\z" \
        "t:none,\
        nolog"
