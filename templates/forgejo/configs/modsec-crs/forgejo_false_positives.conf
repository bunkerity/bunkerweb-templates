# Forgejo exclusions for code and text fields. Tested with Forgejo 16.0.5, BunkerWeb 1.6.17, CRS 4.29.
#
# Code, issues, comments, releases and wiki pages can contain shell commands, paths, HTML and PHP.
# The rules below skip the remote code execution, file inclusion, XSS and PHP injection checks on
# the text fields they list, on the pages and API routes they list, and nowhere else. SQL injection
# checks stay on everywhere. Cost: those four kinds of text are no longer flagged in those fields,
# so Forgejo must store and render them safely. To add or remove a field, edit the field names in
# the rule (they are literal names). Delete a rule to turn it off. Keep this file as a modsec-crs
# config: it has no effect as a modsec config.

# JSON API: issue, pull request and file text sent to the repository endpoints
# (/api/v1/repos/<owner>/<repo>/issues, pulls, contents). Fields: body, title, content, message.
SecRule REQUEST_FILENAME "@rx \A/api/v1/repos/[^/]+/[^/]+/(?:issues|pulls|contents)(?:/.*)?\z" \
    "id:9856103,\
    phase:2,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.body,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.title,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.content,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.message,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.body,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.title,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.content,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.message,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.body,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.title,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.content,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.message,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.body,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.title,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.content,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.message,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT|PATCH)\z" \
        "t:none,\
        nolog"

# Web forms: new issues, comments on issues and pull requests, and file create or edit pages.
# Fields: content, title, commit_summary, commit_message.
SecRule REQUEST_FILENAME "@rx \A/[^/]+/[^/]+/(?:issues/new|(?:issues|pulls)/[0-9]+/comments|_(?:new|edit)/.+)\z" \
    "id:9856104,\
    phase:2,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:commit_summary,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:commit_message,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:commit_summary,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:commit_message,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:commit_summary,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:commit_message,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:commit_summary,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:commit_message,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# Web forms that edit or preview text: issue body and title, comment edits, new pull requests,
# releases (new and edit), wiki pages (new and edit), review comments and the Markdown preview of
# the editors. Fields: content, title, message, text. POST only.
SecRule REQUEST_FILENAME "@rx \A/[^/]+/[^/]+/(?:markup|issues/[0-9]+/(?:content|title)|comments/[0-9]+|compare/.+|releases/(?:new|edit/.+)|wiki(?:/.+)?|pulls/[0-9]+/files/reviews/(?:comments|submit))\z" \
    "id:9856106,\
    phase:2,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:message,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:text,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:message,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:text,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:message,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:text,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:message,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:text,\
    chain"
    SecRule REQUEST_METHOD "@rx \APOST\z" \
        "t:none,\
        nolog"

# JSON API: releases (create and edit). Fields: body, name.
SecRule REQUEST_FILENAME "@rx \A/api/v1/repos/[^/]+/[^/]+/releases(?:/[0-9]+)?\z" \
    "id:9856107,\
    phase:2,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.body,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.name,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.body,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.name,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.body,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.name,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.body,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.name,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PATCH)\z" \
        "t:none,\
        nolog"
