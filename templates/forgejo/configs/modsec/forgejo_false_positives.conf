# Forgejo 16.0.5 / BunkerWeb 1.6.15 recipe, scripted tests on 2026-10-06.
# Code and issue text may contain shell, paths, HTML and PHP. SQLi checks stay active.
# Literal targets are required; regex targets did not work in the source tests.
SecRule REQUEST_FILENAME "@rx ^/api/v1/repos/[^/]+/[^/]+/(?:issues|pulls|contents)(?:/.*)?$" \
    "id:77303,phase:1,pass,nolog,t:none,t:normalizePath,chain,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.body,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.title,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.content,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.message,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.body,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.title,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.content,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.message,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.body,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.title,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.content,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.message,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.body,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.title,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.content,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.message"
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" "t:none,nolog"

SecRule REQUEST_FILENAME "@rx ^/[^/]+/[^/]+/(?:issues/new|(?:issues|pulls)/[0-9]+/comments|_(?:new|edit)/.+)$" \
    "id:77304,phase:1,pass,nolog,t:none,t:normalizePath,chain,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:commit_summary,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:commit_message,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:commit_summary,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:commit_message,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:commit_summary,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:commit_message,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:commit_summary,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:commit_message"
SecRule REQUEST_METHOD "@streq POST" "t:none,nolog"
