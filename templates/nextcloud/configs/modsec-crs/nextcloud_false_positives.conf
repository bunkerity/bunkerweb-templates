# Nextcloud CRS tuning. Tested with BunkerWeb 1.6.17, CRS 4.29. Keep this file as a "modsec-crs"
# config: it has no effect as a "modsec" config.
#
# The first rule below only matters on CRS 3, where it switches on the Nextcloud exclusions that
# ship with the CRS. It does nothing on the default CRS 4, which has no Nextcloud exclusion file:
# there the exclusions come from the nextcloud-rule-exclusions plugin, enabled through
# MODSECURITY_CRS_PLUGINS. Delete it if you only run CRS 4.
SecAction \
    "id:900130,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:tx.crs_exclusions_nextcloud=1"

# There is no rule for the allowed HTTP methods here on purpose: BunkerWeb builds that list from
# its ALLOWED_METHODS setting and answers 405 itself. Change the setting, not this file.

# WebDAV UNLOCK sends a Lock-Token request header, which CRS rule 920450 lists in
# tx.restricted_headers_basic and answers with 403. The nextcloud-rule-exclusions plugin
# covers the If header but not Lock-Token. This rule lets the Lock-Token header through, and only
# for UNLOCK requests under /remote.php/dav/files/. Every other request, and every other
# restricted header on this one, stays inspected. Cost: the Lock-Token header is not refused on
# those requests.
#
# The list in the rule is a copy of the CRS default minus /lock-token/. It does not follow CRS
# upgrades: re-check it when BunkerWeb ships a newer CRS, or a stale list silently changes what
# 920450 inspects on these requests.
SecRule REQUEST_METHOD "@streq UNLOCK" \
    "id:9863100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@beginsWith /remote.php/dav/files/" \
        "t:none,\
        setvar:'tx.restricted_headers_basic=/content-encoding/ /proxy/ /content-range/ /if/ /x-http-method-override/ /x-http-method/ /x-method-override/ /x-middleware-subrequest/ /expect/'"
