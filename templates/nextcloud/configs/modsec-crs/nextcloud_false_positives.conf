# Nextcloud CRS tuning. Must be a "modsec-crs" config: those load before the CRS
# rules, so the setvar is in place when phase:1 rule 9003000 reads it. In a plain
# "modsec" config it would load after the CRS and never take effect.
#
# CRS v3 only: activates the built-in Nextcloud exclusion set. Inert on the default
# CRS v4, which ships no Nextcloud exclusion file — there the exclusions come from
# the nextcloud-rule-exclusions plugin, enabled via MODSECURITY_CRS_PLUGINS.
SecAction \
 "id:900130,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.crs_exclusions_nextcloud=1"

# No tx.allowed_methods rule here on purpose: BunkerWeb generates id 900200 from
# ALLOWED_METHODS ahead of the CRS, enforces the allow-list itself with a 405, and
# disables CRS rule 911100.

# WebDAV UNLOCK sends a Lock-Token request header, which CRS rule 920450 lists in
# tx.restricted_headers_basic and answers with 403. The nextcloud-rule-exclusions plugin
# covers the If header but not Lock-Token. The setvar below replaces CRS's own default
# list (rule 901165 only sets it while it is still unset) with that list minus /lock-token/,
# and only for UNLOCK under /remote.php/dav/files/. Every other request, and every other
# restricted header on this one, stays inspected.
#
# The list is copied from the CRS bundled with BunkerWeb. Re-check it when BunkerWeb ships a
# newer CRS: a stale list here silently changes what 920450 inspects on these requests.
SecRule REQUEST_METHOD "@streq UNLOCK" \
    "id:10300,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@beginsWith /remote.php/dav/files/" \
        "t:none,\
        setvar:'tx.restricted_headers_basic=/content-encoding/ /proxy/ /content-range/ /if/ /x-http-method-override/ /x-http-method/ /x-method-override/ /x-middleware-subrequest/ /expect/'"
