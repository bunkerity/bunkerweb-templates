# Nextcloud exclusions for ModSecurity. Tested with Nextcloud 35.0.3, BunkerWeb 1.6.17, CRS 4.29.
# Keep this file as a "modsec-crs" config: it has no effect as a "modsec" config.
#
# The first rule only matters if you switch the service to CRS 3: it turns on the Nextcloud
# exclusions that ship with CRS 3. On the default CRS 4 the exclusions come from the
# nextcloud-rule-exclusions plugin, enabled by MODSECURITY_CRS_PLUGINS, and this rule does nothing.
# Delete it if you only run CRS 4.
SecAction \
    "id:900130,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:tx.crs_exclusions_nextcloud=1"

# There is no rule for the allowed HTTP methods here on purpose: BunkerWeb builds that list from
# its ALLOWED_METHODS setting and answers 405 itself. Change the setting, not this file.

# Nextcloud file locking (WebDAV UNLOCK) sends a Lock-Token header. CRS rule 920450 refuses that
# header with a 403, and the nextcloud-rule-exclusions plugin only covers the If header. This rule
# lets Lock-Token through, and only for UNLOCK requests under /remote.php/dav/files/. Every other
# request, and every other restricted header on those requests, is still checked. Cost: the
# Lock-Token header is not refused on those requests.
#
# The header list in the rule is a copy of the CRS default without Lock-Token. It does not follow CRS
# upgrades: after a BunkerWeb upgrade that ships a newer CRS, compare it with the CRS list. A stale list
# only changes what CRS 920450 checks on UNLOCK requests under /remote.php/dav/files/.
SecRule REQUEST_METHOD "@streq UNLOCK" \
    "id:9863100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@beginsWith /remote.php/dav/files/" \
        "t:none,\
        setvar:'tx.restricted_headers_basic=/content-encoding/ /proxy/ /content-range/ /if/ /x-http-method-override/ /x-http-method/ /x-method-override/ /x-middleware-subrequest/ /expect/'"

# Nextcloud stores uploaded files, it does not run them. A client that uploads a file with PUT
# sends the file as the request body, and ModSecurity reads a JSON or XML file as if it were a
# request: a settings file that mentions a shell path, a snippet of HTML or a SQL query then gets a
# 403 from CRS rules such as 932160, 941160 or 930120. The two rules below keep the content of an
# uploaded file out of those checks for PUT requests under the file and upload paths of the WebDAV
# endpoints: the web UI, sync clients, WebDAV mounts and public share uploads. The CRS still checks
# the path, the headers, the cookies and the query string of those requests and still blocks them, so
# an attack sent there answers 403 as before. Cost: the content of uploaded files is not checked by
# the WAF. Add an anti-virus on the Nextcloud side if you need that. Request bodies are still read
# into memory, so a large upload still needs memory: see Upload sizing in the README. The OCS API,
# forms, other methods and every other path are still checked in full. The Content-Type and file name
# checks for these uploads come from the nextcloud-rule-exclusions plugin, so keep
# MODSECURITY_CRS_PLUGINS set. To remove the exceptions, delete both rules.
#
# First rule: the content of XML files. It does not depend on the query string.
SecRule REQUEST_METHOD "@streq PUT" \
    "id:9863110,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;XML:/*,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;XML://@*,\
    chain"
    SecRule REQUEST_FILENAME "@rx \A/(?:remote\.php/(?:dav/(?:files|uploads)|webdav)|public\.php/(?:dav/(?:files|uploads)|webdav))/" \
        "t:none,\
        t:normalizePath"

# Second rule: the content of JSON files, which ModSecurity turns into request arguments. The CRS
# reads those arguments together with the query string, so this rule only applies when the request
# has no query string. The web UI and the WebDAV clients tested send none on these requests. A PUT that
# carries a query string gets its JSON content checked again, and a JSON file that mentions a shell
# path or a snippet of HTML then answers 403. XML files stay unchecked with or without a query string,
# because the first rule does not look at it. The query string itself is checked on every request,
# so an attack there is still blocked.
SecRule REQUEST_METHOD "@streq PUT" \
    "id:9863111,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS_NAMES,\
    chain"
    SecRule REQUEST_FILENAME "@rx \A/(?:remote\.php/(?:dav/(?:files|uploads)|webdav)|public\.php/(?:dav/(?:files|uploads)|webdav))/" \
        "t:none,\
        t:normalizePath,\
        chain"
        SecRule &ARGS_GET "@eq 0" \
            "t:none"
