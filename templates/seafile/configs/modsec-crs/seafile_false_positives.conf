# Tested with Seafile Community Edition 11.0, BunkerWeb 1.6.17 and CRS 4.29. These rules load before the CRS.
# Seafile's browser uploader, desktop sync client, WebDAV clients and system admin console send requests
# that the Core Rule Set takes for attacks. Each rule below covers one path prefix and one method, and
# switches off only the CRS checks it names. The same checks stay on for every other path and method.
# The anomaly score rules 949110 and 959100 are never touched.
# To drop an exception you do not need, delete its rule from this file.

# Browser uploads: the web uploader cuts a file into chunks and sends a Content-Range header with each
# one, plus an Accept header that carries a charset. CRS rule 920450 blocks the Content-Range header and
# rule 920600 blocks that Accept header, so every browser upload ends in 403. This rule lets POST requests
# to the upload and update addresses under /seafhttp/ carry both headers. The cost: those two headers are
# not checked on these requests. Any other restricted header, such as Proxy, is still blocked.
SecRule REQUEST_FILENAME "@rx \A/seafhttp/(?:upload|update)-(?:aj|api)/" \
    "id:9882100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:content-range,\
    ctl:ruleRemoveTargetById=920600;REQUEST_HEADERS:Accept,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# WebDAV uploads: Finder, Windows Explorer, rclone and similar clients send a file with PUT and the raw
# file as the body, with the file's own type (image/jpeg, application/pdf) or with no type. CRS rules
# 920340 and 920640 block a body without Content-Type, and rule 920420 blocks a type that is not on its
# allowed list. This rule skips those three checks for PUT requests under /seafdav/. The cost: a file
# sent to SeafDAV is accepted whatever its Content-Type. The other WebDAV methods are checked as before.
# Delete this rule if you do not enable SeafDAV.
SecRule REQUEST_FILENAME "@beginsWith /seafdav/" \
    "id:9882110,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=920340,\
    ctl:ruleRemoveById=920420,\
    ctl:ruleRemoveById=920640,\
    chain"
    SecRule REQUEST_METHOD "@streq PUT" \
        "t:none,\
        nolog"

# System admin console: every page of Seafile's admin area lives under /sys/, and CRS rule 930130 treats
# that folder name as an attempt to read a restricted file, so the console answers 403. This rule skips
# that one check for GET and POST requests whose path starts with /sys/. The cost: a path that starts
# with /sys/ is no longer flagged by the WAF. Seafile only serves its admin console there, and it
# requires an administrator to sign in. A path that only contains /sys/ further down, such as
# /api2/sys/, is still blocked.
SecRule REQUEST_FILENAME "@beginsWith /sys/" \
    "id:9882120,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=930130,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|POST)\z" \
        "t:none,\
        nolog"

# Desktop and mobile sync clients, part 1: the client stores commits and data blocks with PUT requests
# to /seafhttp/repo/<library id>/commit/, block/ and fs/, with no Content-Type header. CRS rules 920340
# and 920640 block that, and the client then reports "Permission denied on server". This rule skips
# those two checks for these PUT requests only. The library id must be a 36 character id, and the client
# must hold a repository token that Seafile itself checks.
SecRule REQUEST_FILENAME "@rx \A/seafhttp/repo/[0-9a-f-]{36}/(?:commit|block|fs)/" \
    "id:9882130,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=920340,\
    ctl:ruleRemoveById=920640,\
    chain"
    SecRule REQUEST_METHOD "@streq PUT" \
        "t:none,\
        nolog"

# Desktop and mobile sync clients, part 2: the client sends file system objects to .../recv-fs/ as a
# binary body that it labels as a web form. The CRS reads that body as form fields, and CRS rule 920250
# flags the bytes as a broken UTF-8 field name, so a sync fails on some files and not on others. This
# rule stops the body from being read as a form for POST requests to /seafhttp/repo/<library id>/recv-fs/.
# The cost: no CRS rule inspects the body of these requests. The path is only usable with a valid
# repository token, and Seafile checks every object it receives.
SecRule REQUEST_FILENAME "@rx \A/seafhttp/repo/[0-9a-f-]{36}/recv-fs/" \
    "id:9882131,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:requestBodyAccess=Off,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"
