# Grafana exclusions. Tested with Grafana 13.2.3, BunkerWeb 1.6.17, CRS 4.29. Keep this file as a
# modsec-crs config: it has no effect as a modsec config. Delete a rule to turn its exception off.

# Queries to SQL data sources: Grafana sends the SQL text of each query in the "rawSql" field, and
# the SQL injection rules flag it. Only that field is skipped, for the first 10 queries of a
# request (index 0 to 9). Cost: SQL injection checks do not run on those fields, so only users who
# may query your data sources should reach Grafana. To allow more queries per request, copy the
# group of lines of the last index and change the number.
SecRule REQUEST_FILENAME "@streq /api/ds/query" \
    "id:9858101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.queries.array_0.rawSql,\
    ctl:ruleRemoveTargetById=942151;ARGS:json.queries.array_0.rawSql,\
    ctl:ruleRemoveTargetById=942160;ARGS:json.queries.array_0.rawSql,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.queries.array_0.rawSql,\
    ctl:ruleRemoveTargetById=942280;ARGS:json.queries.array_0.rawSql,\
    ctl:ruleRemoveTargetById=942320;ARGS:json.queries.array_0.rawSql,\
    ctl:ruleRemoveTargetById=942350;ARGS:json.queries.array_0.rawSql,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.queries.array_1.rawSql,\
    ctl:ruleRemoveTargetById=942151;ARGS:json.queries.array_1.rawSql,\
