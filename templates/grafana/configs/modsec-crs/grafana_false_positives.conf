# Grafana exclusions. Tested with Grafana 13.2.3, BunkerWeb 1.6.17, CRS 4.29. Keep this file as a
# modsec-crs config: it has no effect as a modsec config. Delete a rule to turn its exception off.
# The SQL text of queries is handled in the modsec config of this template, not here.

# Saving a dashboard through the API (POST /api/dashboards/db), as provisioning tools do: titles,
# descriptions and text panels hold SQL, HTML and shell text. The index of a panel field varies, so
# the field cannot be named: these seven rules are off for the whole request instead. Cost: SQL,
# script and shell text is accepted anywhere in an API dashboard save, titles included. The web UI
# saves through another path (/apis/dashboard.grafana.app), where only SQL text of queries is let
# through. See the README before importing. To keep these checks, delete the rule.
SecRule REQUEST_FILENAME "@streq /api/dashboards/db" \
    "id:9858102,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=932340,\
    ctl:ruleRemoveById=941100,\
    ctl:ruleRemoveById=941120,\
    ctl:ruleRemoveById=941160,\
    ctl:ruleRemoveById=941390,\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=942190,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# Explore keeps the query in the address of the page, in the parameter panes: reloading the page or
# opening a shared Explore link sends the SQL text of a query in the request line. The same
# rules as for the rawSql fields of the modsec config skip that one parameter, for a GET of
# /explore only. Cost: the SQL injection rules and the five rules listed there do not read panes.
# Every other parameter and path is still checked. Delete the rule if you do not use Explore with
# SQL data sources.
SecRule REQUEST_FILENAME "@streq /explore" \
    "id:9858103,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SQLI;ARGS:panes,\
    ctl:ruleRemoveTargetById=932130;ARGS:panes,\
    ctl:ruleRemoveTargetById=932280;ARGS:panes,\
    ctl:ruleRemoveTargetById=933135;ARGS:panes,\
    ctl:ruleRemoveTargetById=933160;ARGS:panes,\
    ctl:ruleRemoveTargetById=933180;ARGS:panes,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"

# Page responses: Grafana serves one HTML page for every front-end route, and its start-up data
# carries strings such as sqlConnectionLimits and the names of data sources and dashboards, which
# rule 953100 reads as a PHP error message, so the page would be cut off. Rule 953100 is skipped
# only for a GET whose response is text/html, whatever the Accept header says, so curl and uptime
# monitors get the whole page too. Cost: a PHP error message inside a Grafana HTML page is not
# detected. JSON and plain-text responses stay inspected.
SecRule REQUEST_METHOD "@streq GET" \
    "id:9858500,\
    phase:3,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetById=953100;RESPONSE_BODY,\
    chain"
    SecRule RESPONSE_HEADERS:Content-Type "@beginsWith text/html" \
        "t:none,\
        t:lowercase,\
        nolog"

# Plugin list: Administration > Plugins and the data source pages load GET /api/plugins. Rule 951220
# (SQL Server error message in a response) reads the plugin id "stackdriver" and the description of
# the SQL Server plugin as an error message and cuts the reply off, so those pages show no plugins.
# Rule 951220 is skipped for that exact path and for GET only; every other CRS check on it stays
# on. Cost: a SQL Server error message in the plugin list would not be detected. The same path with
# a trailing slash is not covered: Grafana's pages do not use it.
SecRule REQUEST_FILENAME "@streq /api/plugins" \
    "id:9858501,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=951220;RESPONSE_BODY,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"
