# Grafana 13.2.3 / BunkerWeb 1.6.15 recipe, scripted tests on 2026-10-06.
# HTML pages embed plugin names that trigger the PHP response-leak rule.
# This skips 953100 on any GET whose Accept contains text/html.
SecRule REQUEST_METHOD "@streq GET" \
    "id:77400,phase:1,pass,nolog,t:none,chain,ctl:ruleRemoveById=953100"
SecRule REQUEST_HEADERS:Accept "@contains text/html" "t:none,nolog"

# SQL data sources submit raw SQL. Only literal indices 0 through 9 are excluded.
SecRule REQUEST_FILENAME "@streq /api/ds/query" \
    "id:77401,phase:1,pass,nolog,t:none,t:normalizePath,chain,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.queries.array_0.rawSql,\
