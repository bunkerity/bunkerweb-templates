# Grafana SQL fields. Keep this file as a modsec config: the lines below change CRS rules after they
# load, so they have no effect as a modsec-crs config. Delete a line to turn its exception off.

# SQL text of panels and Explore: for a SQL data source (PostgreSQL, MySQL, Microsoft SQL Server)
# Grafana sends the query in a JSON field named rawSql, in query requests, dashboard saves, alert
# rules and library panels. That field holds SQL by design, and Grafana macros, template variables
# in braces and common SQL functions look like PHP or shell expressions to the CRS. Only fields
# named rawSql skip the rules below, at any position of a JSON body. Every other field, header and
# path is still checked by them. Cost: the SQL injection rules (tag attack-sqli) and the rules 932130,
# 932280, 933135, 933160 and 933180 do not read the SQL text of a query, so only users who may
# query your data sources should reach Grafana. To allow another rule on these fields, copy a line
# and change its id.
SecRuleUpdateTargetByTag "attack-sqli" "!ARGS:/^json\..*\.rawSql$/"
SecRuleUpdateTargetById 932130 "!ARGS:/^json\..*\.rawSql$/"
SecRuleUpdateTargetById 932280 "!ARGS:/^json\..*\.rawSql$/"
SecRuleUpdateTargetById 933135 "!ARGS:/^json\..*\.rawSql$/"
SecRuleUpdateTargetById 933160 "!ARGS:/^json\..*\.rawSql$/"
SecRuleUpdateTargetById 933180 "!ARGS:/^json\..*\.rawSql$/"
