# ProjectSend chunked upload: the part receiver is the only request that needs these exclusions.
# It is "PUT /uploads/{session}/parts/{part}" (and the API twin under /api/v1), a raw body sent
# to a signed URL. The Uppy uploader sets no Content-Type on it (a Blob slice has an empty type),
# so CRS sees a body without a Content-Type.
# Scope: PUT only, path anchored. "GET .../parts/{part}/sign" and every other route keep all rules.
# t:normalizePath is required: REQUEST_FILENAME is URL-decoded but not normalised.
#   920340 (phase 1): Content-Type missing on a request with non-zero Content-Length (browser part).
#   920640 (phase 2): Content-Type missing on a request with a body (browser part).
#   920420 (phase 1): Content-Type not in the allowed list (API clients that send
#                     application/octet-stream on the part).
SecRule REQUEST_FILENAME "@rx ^/(?:api/v1/)?uploads/[^/]+/parts/[0-9]+$" \
    "id:10001,phase:1,pass,nolog,t:none,t:normalizePath,chain,\
    ctl:ruleRemoveById=920340,\
    ctl:ruleRemoveById=920640,\
    ctl:ruleRemoveById=920420"
    SecRule REQUEST_METHOD "@streq PUT" \
        "t:none,nolog"
