# ProjectSend chunked upload exclusions. Keep this file as a modsec-crs config: it has no effect as a
# modsec config. Delete the rule to turn it off, and large uploads then fail with 403.
#
# The part receiver is the only request that needs these exclusions. It is
# "PUT /uploads/{session}/parts/{part}" (and the API twin under /api/v1), a raw body sent to a
# signed URL. The browser uploader sets no Content-Type on it, so the CRS sees a body without one.
# Scope: PUT only, on that exact path. "GET .../parts/{part}/sign" and every other route keep all
# rules. Cost: on that path these three checks are off:
#   920340: the request headers announce a body (Content-Length above 0) but carry no Content-Type
#           header (browser upload).
#   920640: a body arrived with no Content-Type header, even when no Content-Length announced it.
#           It runs after the body is read (browser upload).
#   920420: Content-Type not on the allowed list (API clients that send application/octet-stream).
SecRule REQUEST_FILENAME "@rx \A/(?:api/v1/)?uploads/[^/]+/parts/[0-9]+\z" \
    "id:9870101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=920340,\
    ctl:ruleRemoveById=920640,\
    ctl:ruleRemoveById=920420,\
    chain"
    SecRule REQUEST_METHOD "@streq PUT" \
        "t:none,\
        nolog"
