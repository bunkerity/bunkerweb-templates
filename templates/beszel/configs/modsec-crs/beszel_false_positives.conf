# Beszel false positives for the OWASP CRS (BunkerWeb custom config, type modsec-crs).
# Rule ids 9852000-9852999 are reserved for this template (the template range of BunkerWeb, see TEMPLATE_GUIDE.md).
# Every exclusion is a chained rule: anchored path (t:normalizePath; the two logs rules use the raw path) and method,
# then literal targets only (BunkerWeb 1.6.17 rejects or ignores regex targets in ctl:).
# 949110 and 959100 are never excluded.

# Dashboard charts: the UI filters the stats of one system with a PocketBase expression,
# system='<id>' && created > '<time>' && type='1m', which libinjection reads as SQL (942100).
# Only a filter with exactly that shape skips 942100 (ids, time and type are fully anchored);
# any other filter, and a second filter argument, is inspected as before.
SecRule REQUEST_FILENAME "@rx \A/api/collections/(?:system_stats|container_stats)/records/?\z" \
    "id:9852101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:filter,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog,\
        chain"
        SecRule &ARGS:filter "@eq 1" \
            "t:none,\
            nolog,\
            chain"
            SecRule ARGS:filter "@rx \Asystem='[a-z0-9]{15}' && created > '[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}' && type='(?:1|10|20|120|480)m'\z" \
                "t:none,\
                nolog"

# Network monitor charts: the UI filters one or more monitors,
# (monitor='<id>' || monitor='<id>') && created><milliseconds> && type='1m' (942100). Same anchoring as above.
SecRule REQUEST_FILENAME "@rx \A/api/collections/network_monitor_stats/records/?\z" \
    "id:9852107,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:filter,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog,\
        chain"
        SecRule &ARGS:filter "@eq 1" \
            "t:none,\
            nolog,\
            chain"
            SecRule ARGS:filter "@rx \A\(monitor='[a-z0-9]{6,10}'(?: \|\| monitor='[a-z0-9]{6,10}')*\) && created>[0-9]{13} && type='(?:1|10|20|120|480)m'\z" \
                "t:none,\
                nolog"

# Compare monitors (monitor dialog): system!='<id>' && protocol='http' (942100). The plain list of one system's
# monitors, system='<id>', does not trigger 942100 and needs nothing.
SecRule REQUEST_FILENAME "@rx \A/api/collections/network_monitors/records/?\z" \
    "id:9852108,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:filter,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog,\
        chain"
        SecRule &ARGS:filter "@eq 1" \
            "t:none,\
            nolog,\
            chain"
            SecRule ARGS:filter "@rx \Asystem!='[a-z0-9]{15}' && protocol='(?:http|icmp|tcp|dns)'\z" \
                "t:none,\
                nolog"

# Live updates: the browser subscribes with topics like systems/* and alerts/*, and libinjection
# reads '/*' as an SQL comment (942100). One list per browser tab holds every active subscription;
# the first 16 positions are skipped, a tab with more topics gets 403.
SecRule REQUEST_FILENAME "@rx \A/api/realtime/?\z" \
    "id:9852102,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_0,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_1,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_2,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_3,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_4,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_5,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_6,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_7,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_8,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_9,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_10,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_11,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_12,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_13,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_14,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscriptions.array_15,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# Superuser logs page (/_/#/logs), the list: its filter box takes a PocketBase expression such as
# data.status>=400 && data.method="GET" (942100), and a method name such as "POST", "PATCH" or "HEAD" reads as a
# Unix command (932235). The page wraps what was typed in (data.auth!='_superusers')&&(<typed>)&&(created <= "<time>"),
# so the typed part is free text: only the path, the method and one filter argument can be pinned.
# The answer holds the hub's own error text ("unexpected character" is read as a PHP error by 953100, and 959100
# then empties a small answer), so 953100 is skipped on the response body of this path only.
# The path link has no normalizePath: //api/logs, /api/logs/./ and the like are inspected as before.
SecRule REQUEST_FILENAME "@streq /api/logs" \
    "id:9852103,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:filter,\
    ctl:ruleRemoveTargetById=932235;ARGS:filter,\
    ctl:ruleRemoveTargetById=953100;RESPONSE_BODY,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog,\
        chain"
        SecRule &ARGS:filter "@eq 1" \
            "t:none,\
            nolog"

# Superuser logs page, the chart above the list: /api/logs/stats takes the same filter without the created clause.
# The answer is date and count only, so nothing on the response side is skipped. Raw path, as above.
SecRule REQUEST_FILENAME "@streq /api/logs/stats" \
    "id:9852109,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:filter,\
    ctl:ruleRemoveTargetById=932235;ARGS:filter,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog,\
        chain"
        SecRule &ARGS:filter "@eq 1" \
            "t:none,\
            nolog"

# Collection editor (/_/): saving the users collection to set up OAuth2 or OIDC (the documented step)
# sends its index definitions as SQL text (942190). Only users is covered, the first 6 indexes.
SecRule REQUEST_FILENAME "@rx \A/api/collections/users/?\z" \
    "id:9852104,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.indexes.array_0,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.indexes.array_1,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.indexes.array_2,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.indexes.array_3,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.indexes.array_4,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.indexes.array_5,\
    chain"
    SecRule REQUEST_METHOD "@streq PATCH" \
        "t:none,\
        nolog"

# Notification targets saved in the user settings: a webhook on a LAN address such as
# http://192.168.1.10:8080/notify is read as a remote file inclusion (931100), an IPv6 address as
# SSRF and shell syntax (934110, 932130). The first 10 targets of the list are skipped.
SecRule REQUEST_FILENAME "@rx \A/api/collections/user_settings/records/[a-z0-9]{15}/?\z" \
    "id:9852105,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.settings.webhooks.array_0,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.settings.webhooks.array_0,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.settings.webhooks.array_0,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.settings.webhooks.array_1,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.settings.webhooks.array_1,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.settings.webhooks.array_1,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.settings.webhooks.array_2,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.settings.webhooks.array_2,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.settings.webhooks.array_2,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.settings.webhooks.array_3,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.settings.webhooks.array_3,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.settings.webhooks.array_3,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.settings.webhooks.array_4,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.settings.webhooks.array_4,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.settings.webhooks.array_4,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.settings.webhooks.array_5,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.settings.webhooks.array_5,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.settings.webhooks.array_5,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.settings.webhooks.array_6,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.settings.webhooks.array_6,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.settings.webhooks.array_6,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.settings.webhooks.array_7,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.settings.webhooks.array_7,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.settings.webhooks.array_7,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.settings.webhooks.array_8,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.settings.webhooks.array_8,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.settings.webhooks.array_8,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.settings.webhooks.array_9,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.settings.webhooks.array_9,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.settings.webhooks.array_9,\
    chain"
    SecRule REQUEST_METHOD "@streq PATCH" \
        "t:none,\
        nolog"

# The Test button of the notification settings posts the same kind of URL: {"url": "http://192.168.1.10:8080/notify"}.
SecRule REQUEST_FILENAME "@rx \A/api/beszel/test-notification/?\z" \
    "id:9852106,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.url,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.url,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.url,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"
