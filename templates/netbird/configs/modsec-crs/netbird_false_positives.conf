# NetBird exclusions. Tested with BunkerWeb 1.6.17, CRS 4.29. Delete a rule to turn its exception
# off. Keep this file as a modsec-crs config: it has no effect as a modsec config.
#
# NetBird's embedded identity provider (Dex) lives under /oauth2/ and its sign-in requests carry
# redirect URIs that hold an IP address or a URL, which rules 931100 (remote file inclusion) and
# 934110 (server-side request forgery) flag. Both rules are off for the authorization endpoint and
# the connector paths below it (/oauth2/auth, /oauth2/auth/<connector>,
# /oauth2/auth/<connector>/login). The authorization request is a GET, the password login of a
# connector is a POST. Names that only start with the same letters (/oauth2/authx) are not matched.
# Cost: those two checks no longer run on these sign-in requests, and they are off for the whole
# request, so they do not look at the other arguments of those requests either. Every other rule,
# path and method stays under the CRS.
SecRule REQUEST_FILENAME "@rx \A/oauth2/auth(?:/|\z)" \
    "id:9862100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=931100,\
    ctl:ruleRemoveById=934110,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|POST)\z" \
        "t:none,\
        nolog"

# The same two rules are off for the token endpoint, which only accepts POST and has no path below
# it. Same cost: those two checks no longer run on token requests.
SecRule REQUEST_FILENAME "@streq /oauth2/token" \
    "id:9862101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=931100,\
    ctl:ruleRemoveById=934110,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# Names and descriptions typed in the NetBird dashboard. A group, policy, setup key, network, DNS zone
# or device called "SSH to prod servers" or "wget mirror" looks like a shell command to the CRS, which
# answers 403 (rules 932250 and 932260). The two rules below skip the name and description fields of
# those objects on POST and PUT requests, but only while every one of those fields is plain text:
# a value that holds a pipe, semicolon, backtick, dollar sign, angle bracket, backslash or line
# break keeps the full CRS. The first four rules of a policy are covered. Cost: a plain name that
# reads like a Unix command is no longer flagged in those fields. Delete both rules to turn it off.
SecRule ARGS:json.name|ARGS:json.description|ARGS:json.network_id|ARGS:json.rules.array_0.name|ARGS:json.rules.array_0.description|ARGS:json.rules.array_1.name|ARGS:json.rules.array_1.description|ARGS:json.rules.array_2.name|ARGS:json.rules.array_2.description|ARGS:json.rules.array_3.name|ARGS:json.rules.array_3.description \
    "@rx [|;`$<>\\\x0a\x0d]" \
    "id:9862200,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    setvar:tx.netbird_text_unsafe=1"

SecRule REQUEST_FILENAME "@rx \A/api/(?:groups|policies|setup-keys|networks|posture-checks|routes|dns|peers|users)(?:/|\z)" \
    "id:9862201,\
    phase:2,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.name,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.name,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.description,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.description,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.network_id,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.network_id,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.rules.array_0.name,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.rules.array_0.name,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.rules.array_0.description,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.rules.array_0.description,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.rules.array_1.name,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.rules.array_1.name,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.rules.array_1.description,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.rules.array_1.description,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.rules.array_2.name,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.rules.array_2.name,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.rules.array_2.description,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.rules.array_2.description,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.rules.array_3.name,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.rules.array_3.name,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.rules.array_3.description,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.rules.array_3.description,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT)\z" \
        "t:none,\
        nolog,\
        chain"
        SecRule &TX:netbird_text_unsafe "@eq 0" \
            "t:none,\
            nolog"

# Windows paths of a posture check. A process check names the program to look for, for example a
# file in the Windows or Program Files folder, and rule 930120 (operating system file access)
# answers 403 for it. The two rules below skip 930120 on the Windows path of the first ten
# processes, on POST and PUT requests to /api/posture-checks, but only while every one of those
# paths is made of letters, digits, spaces, dots, dashes, underscores, slashes, backslashes, colons
# and brackets. Linux and macOS paths are not affected. Cost: a Windows system file named in that
# field is no longer flagged. Delete both rules to turn it off.
SecRule ARGS:json.checks.process_check.processes.array_0.windows_path|ARGS:json.checks.process_check.processes.array_1.windows_path|ARGS:json.checks.process_check.processes.array_2.windows_path|ARGS:json.checks.process_check.processes.array_3.windows_path|ARGS:json.checks.process_check.processes.array_4.windows_path|ARGS:json.checks.process_check.processes.array_5.windows_path|ARGS:json.checks.process_check.processes.array_6.windows_path|ARGS:json.checks.process_check.processes.array_7.windows_path|ARGS:json.checks.process_check.processes.array_8.windows_path|ARGS:json.checks.process_check.processes.array_9.windows_path \
    "!@rx \A[\w .():\\/-]*\z" \
    "id:9862210,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    setvar:tx.netbird_path_unsafe=1"

SecRule REQUEST_FILENAME "@rx \A/api/posture-checks(?:/|\z)" \
    "id:9862211,\
    phase:2,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.checks.process_check.processes.array_0.windows_path,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.checks.process_check.processes.array_1.windows_path,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.checks.process_check.processes.array_2.windows_path,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.checks.process_check.processes.array_3.windows_path,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.checks.process_check.processes.array_4.windows_path,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.checks.process_check.processes.array_5.windows_path,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.checks.process_check.processes.array_6.windows_path,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.checks.process_check.processes.array_7.windows_path,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.checks.process_check.processes.array_8.windows_path,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.checks.process_check.processes.array_9.windows_path,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT)\z" \
        "t:none,\
        nolog,\
        chain"
        SecRule &TX:netbird_path_unsafe "@eq 0" \
            "t:none,\
            nolog"
