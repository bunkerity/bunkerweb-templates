# NetBird exclusions. Tested with BunkerWeb 1.6.17, CRS 4.29. Delete a rule to turn its exception
# off. Keep this file as a modsec-crs config: it has no effect as a modsec config.
#
# NetBird's embedded identity provider (Dex) lives under /oauth2/ and its sign-in requests carry
# redirect URIs that hold an IP address or a URL, which rules 931100 (remote file inclusion) and
# 934110 (server-side request forgery) flag. Both rules are off for the authorization endpoint and
# the connector paths below it (/oauth2/auth, /oauth2/auth/<connector>,
# /oauth2/auth/<connector>/login). The authorization request is a GET, the password login of a
# connector is a POST. Names that only start with the same letters (/oauth2/authx) are not matched.
# Cost: those two checks no longer run on these sign-in requests.
SecRule REQUEST_FILENAME "@rx \A/oauth2/auth(?:/|\z)" \
    "id:9862100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=931100,\
    ctl:ruleRemoveById=934110,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|POST)\z" \
        "t:none,\
        nolog"

# The same two rules are off for the token endpoint, which only accepts POST and has no path below
# it. Same cost: those two checks no longer run on token requests.
SecRule REQUEST_FILENAME "@streq /oauth2/token" \
    "id:9862101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=931100,\
    ctl:ruleRemoveById=934110,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"
