# NetBird's embedded identity provider (Dex) lives under /oauth2/ and its OAuth2 requests can trigger CRS
# false positives (redirect URIs that hold an IP address or a URL).
# 931100 and 934110 are removed for the authorization endpoint and the connector paths below it
# (/oauth2/auth, /oauth2/auth/<connector>, /oauth2/auth/<connector>/login). The authorization request
# is a GET, the password login of a connector is a POST. Names that only start with the same letters
# (/oauth2/authx) are not matched.
SecRule REQUEST_FILENAME "@rx \A/oauth2/auth(?:/|\z)" \
    "id:9862100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=931100,\
    ctl:ruleRemoveById=934110,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|POST)\z" \
        "t:none,\
        nolog"

# The same two rules for the token endpoint, which only accepts POST and has no path below it.
SecRule REQUEST_FILENAME "@streq /oauth2/token" \
    "id:9862101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=931100,\
    ctl:ruleRemoveById=934110,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"
