# Outline 1.12.0 behind BunkerWeb 1.6.17 (OWASP CRS 4.29.0). Every rule id below matched legitimate
# Outline content (SQL, shell and HTML text in documents, comments, search, the Slack /outline command,
# MCP calls, loopback OAuth redirect URIs) in a request matrix against the real app. Loaded before the CRS (modsec-crs).
# Each exclusion needs the method AND the exact path, and removes one argument from the listed
# rules; the same payload in any other argument, path or method is still blocked. 949110 and 959100
# are never touched.

# The sign-in page reads POST /api/auth.config. CRS 920440 rejects the ".config" file extension in the
# URL, so without this the login page shows "Failed to load configuration".
SecRule REQUEST_FILENAME "@streq /api/auth.config" \
    "id:9867100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920440;REQUEST_BASENAME,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# Document body sent as JSON markdown by API clients and integrations (documents.create/update).
# Wiki text holds SQL, shell, HTML and paths by nature. Only the "text" argument is skipped, only for
# these two endpoints.
SecRule REQUEST_FILENAME "@rx \A/api/documents\.(?:create|update)\z" \
    "id:9867101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930100;ARGS:json.text,\
    ctl:ruleRemoveTargetById=930110;ARGS:json.text,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.text,\
    ctl:ruleRemoveTargetById=932125;ARGS:json.text,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.text,\
    ctl:ruleRemoveTargetById=932160;ARGS:json.text,\
    ctl:ruleRemoveTargetById=932230;ARGS:json.text,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.text,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.text,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.text,\
    ctl:ruleRemoveTargetById=932370;ARGS:json.text,\
    ctl:ruleRemoveTargetById=932380;ARGS:json.text,\
    ctl:ruleRemoveTargetById=933160;ARGS:json.text,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.text,\
    ctl:ruleRemoveTargetById=941110;ARGS:json.text,\
    ctl:ruleRemoveTargetById=941120;ARGS:json.text,\
    ctl:ruleRemoveTargetById=941160;ARGS:json.text,\
    ctl:ruleRemoveTargetById=941170;ARGS:json.text,\
    ctl:ruleRemoveTargetById=941180;ARGS:json.text,\
    ctl:ruleRemoveTargetById=941210;ARGS:json.text,\
    ctl:ruleRemoveTargetById=941390;ARGS:json.text,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.text,\
    ctl:ruleRemoveTargetById=942350;ARGS:json.text,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# Document titles can carry SQL or markup ("DROP TABLE users", "<b>release</b>"). Only "title".
SecRule REQUEST_FILENAME "@rx \A/api/documents\.(?:create|update)\z" \
    "id:9867102,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.title,\
    ctl:ruleRemoveTargetById=932160;ARGS:json.title,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.title,\
    ctl:ruleRemoveTargetById=941110;ARGS:json.title,\
    ctl:ruleRemoveTargetById=941160;ARGS:json.title,\
    ctl:ruleRemoveTargetById=941390;ARGS:json.title,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.title,\
    ctl:ruleRemoveTargetById=942350;ARGS:json.title,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
