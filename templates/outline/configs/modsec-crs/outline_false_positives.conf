# Comments are sent as nested JSON, so the field that holds the text has no fixed name and cannot be
# targeted. These injection rules are therefore skipped for the whole request on the two
# comment-writing endpoints (body, headers, cookies and query string), not only for the comment
# text. Cost: a payload anywhere in a comment request, in a cookie or in the URL no longer trips
# these rules. Rules outside the list (for example 942270, 913100, 920170) still apply. The other
# body fields are UUIDs that Outline validates. Delete this rule to turn it off: comments that
# hold code then get 403.
SecRule REQUEST_FILENAME "@rx \A/api/comments\.(?:create|update)\z" \
    "id:9867105,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=930100,\
    ctl:ruleRemoveById=930110,\
    ctl:ruleRemoveById=930120,\
    ctl:ruleRemoveById=932125,\
    ctl:ruleRemoveById=932130,\
    ctl:ruleRemoveById=932160,\
    ctl:ruleRemoveById=932230,\
    ctl:ruleRemoveById=932235,\
    ctl:ruleRemoveById=932250,\
    ctl:ruleRemoveById=932260,\
    ctl:ruleRemoveById=932370,\
    ctl:ruleRemoveById=932380,\
    ctl:ruleRemoveById=933160,\
    ctl:ruleRemoveById=941100,\
    ctl:ruleRemoveById=941110,\
    ctl:ruleRemoveById=941160,\
    ctl:ruleRemoveById=941180,\
    ctl:ruleRemoveById=941390,\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=942190,\
    ctl:ruleRemoveById=942350,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

