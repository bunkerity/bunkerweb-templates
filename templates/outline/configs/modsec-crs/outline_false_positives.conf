# Dynamic client registration by MCP clients: native clients register loopback redirect URIs such as
# http://localhost:8765/callback or http://127.0.0.1:8765/callback, which CRS rule 934110
# (localhost) and 931100 (IP address in a URL parameter) flag. Only the first four redirect_uris
# entries are skipped. Cost: those two rules do not check those URIs. A client that registers more
# than four needs more lines like these, one per extra entry.
SecRule REQUEST_FILENAME "@streq /oauth/register" \
    "id:9867108,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_0,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_0,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_1,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_1,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_2,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_2,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_3,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_3,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# The authorization and token endpoints receive the same loopback redirect_uri (query string or
# form). Only "redirect_uri" is skipped.
SecRule REQUEST_FILENAME "@rx \A/oauth/(?:authorize|token)\z" \
    "id:9867109,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetById=934110;ARGS:redirect_uri,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|POST)\z" \
        "t:none,\
        nolog"

# The consent screen asks oauthClients.info with the loopback redirect URI of the client. Only
# "redirectUri" is skipped.
SecRule REQUEST_FILENAME "@streq /api/oauthClients.info" \
    "id:9867110,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirectUri,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirectUri,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

