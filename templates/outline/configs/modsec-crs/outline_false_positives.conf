# Comments are ProseMirror JSON, so the text sits at json.data.content.array_N.content.array_M.text with
# N and M unbounded, and libmodsecurity in BunkerWeb 1.6.17 rejects regex targets in ctl (config check
# fails: "Expecting an action"). No target can be named, so these injection rules are skipped for
# the comment body of the two comment-writing endpoints. The other fields are UUIDs Outline validates.
SecRule REQUEST_FILENAME "@rx \A/api/comments\.(?:create|update)\z" \
    "id:9867105,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=930100,\
    ctl:ruleRemoveById=930110,\
    ctl:ruleRemoveById=930120,\
    ctl:ruleRemoveById=932125,\
    ctl:ruleRemoveById=932130,\
    ctl:ruleRemoveById=932160,\
    ctl:ruleRemoveById=932230,\
    ctl:ruleRemoveById=932235,\
    ctl:ruleRemoveById=932250,\
    ctl:ruleRemoveById=932260,\
    ctl:ruleRemoveById=932370,\
    ctl:ruleRemoveById=932380,\
    ctl:ruleRemoveById=933160,\
    ctl:ruleRemoveById=941100,\
    ctl:ruleRemoveById=941110,\
    ctl:ruleRemoveById=941160,\
    ctl:ruleRemoveById=941180,\
    ctl:ruleRemoveById=941390,\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=942190,\
    ctl:ruleRemoveById=942350,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# MCP tool calls (create_document, update_document, create_comment...) carry arbitrary document text in
# params.arguments.text. Authenticated by API key or OAuth bearer. Only that argument.
SecRule REQUEST_FILENAME "@streq /mcp" \
    "id:9867106,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930100;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=930110;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=932125;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=932160;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=932230;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=932370;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=932380;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=933160;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=941110;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=941120;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=941160;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=941170;ARGS:json.params.arguments.text,\
