# Dynamic client registration by MCP clients: native clients register loopback redirect URIs such as
# http://localhost:8765/callback or http://127.0.0.1:8765/callback, which CRS 934110 (localhost) and
# 931100 (IP address in a URL parameter) flag. Only the first four redirect_uris entries are skipped.
SecRule REQUEST_FILENAME "@streq /oauth/register" \
    "id:9867108,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_0,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_0,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_1,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_1,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_2,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_2,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirect_uris.array_3,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirect_uris.array_3,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# The authorization and token endpoints receive the same loopback redirect_uri (query string or form).
# Only "redirect_uri".
SecRule REQUEST_FILENAME "@rx \A/oauth/(?:authorize|token)\z" \
    "id:9867109,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetById=934110;ARGS:redirect_uri,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|POST)\z" \
        "t:none,\
        nolog"

# The consent screen asks oauthClients.info with the client's loopback redirect URI. Only "redirectUri".
SecRule REQUEST_FILENAME "@streq /api/oauthClients.info" \
    "id:9867110,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirectUri,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirectUri,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# Admins registering their own OAuth app with a localhost redirect URI. Only the first four entries.
SecRule REQUEST_FILENAME "@rx \A/api/oauthClients\.(?:create|update)\z" \
    "id:9867111,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirectUris.array_0,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirectUris.array_0,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirectUris.array_1,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirectUris.array_1,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirectUris.array_2,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirectUris.array_2,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.redirectUris.array_3,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.redirectUris.array_3,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# Reloading or sharing a search page whose URL carries SQL-looking text (/search?query=...). The page
# is the static single-page app shell, the term is never reflected server-side. Only "query".
SecRule REQUEST_FILENAME "@streq /search" \
    "id:9867112,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:query,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"

# The Slack "/outline <words>" command searches the wiki: the form field "text" is what the person typed,
# so it can hold code ("SELECT * FROM users", "cat /etc/passwd | sh"). Only "text". Outline checks
# Slack's verification token before anything is searched. Only present when the Slack
# integration is configured; harmless otherwise (the path answers 404).
SecRule REQUEST_FILENAME "@streq /api/hooks.slack" \
    "id:9867113,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS:text,\
    ctl:ruleRemoveTargetById=932160;ARGS:text,\
    ctl:ruleRemoveTargetById=932230;ARGS:text,\
    ctl:ruleRemoveTargetById=932250;ARGS:text,\
    ctl:ruleRemoveTargetById=932370;ARGS:text,\
    ctl:ruleRemoveTargetById=941100;ARGS:text,\
    ctl:ruleRemoveTargetById=941110;ARGS:text,\
    ctl:ruleRemoveTargetById=941120;ARGS:text,\
    ctl:ruleRemoveTargetById=941160;ARGS:text,\
    ctl:ruleRemoveTargetById=941180;ARGS:text,\
    ctl:ruleRemoveTargetById=941390;ARGS:text,\
    ctl:ruleRemoveTargetById=942100;ARGS:text,\
    ctl:ruleRemoveTargetById=942190;ARGS:text,\
    ctl:ruleRemoveTargetById=942350;ARGS:text,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"
