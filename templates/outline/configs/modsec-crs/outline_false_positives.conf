# Reloading, bookmarking or sharing a search page whose URL carries code (/search?q=...): SQL, a
# Python line or a shell command. Outline keeps the search text in "q" and runs the search again
# from it. The page is the static single-page app shell, and the text is never reflected by the
# server. Only "q" is skipped, with the same rules as the search API (rule 9867103). A script tag
# in the URL still loads the page (200), but the calls the page then makes get 403, because the
# page URL is their Referer (see the README).
SecRule REQUEST_FILENAME "@streq /search" \
    "id:9867112,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS:q,\
    ctl:ruleRemoveTargetById=932160;ARGS:q,\
    ctl:ruleRemoveTargetById=932230;ARGS:q,\
    ctl:ruleRemoveTargetById=932250;ARGS:q,\
    ctl:ruleRemoveTargetById=941100;ARGS:q,\
    ctl:ruleRemoveTargetById=941110;ARGS:q,\
    ctl:ruleRemoveTargetById=941160;ARGS:q,\
    ctl:ruleRemoveTargetById=941390;ARGS:q,\
    ctl:ruleRemoveTargetById=942100;ARGS:q,\
    ctl:ruleRemoveTargetById=942350;ARGS:q,\
    ctl:ruleRemoveTargetById=942190;ARGS:q,\
    ctl:ruleRemoveTargetById=942270;ARGS:q,\
    ctl:ruleRemoveTargetById=933160;ARGS:q,\
    ctl:ruleRemoveTargetById=932125;ARGS:q,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"

# The Slack "/outline <words>" command searches the wiki. The form field "text" is what the person
# typed, so it can hold code (a SQL SELECT, "cat /etc/passwd | sh"). Only "text" is
# skipped, and Outline checks the Slack verification token before it searches anything. This rule
# matters only when the Slack integration is configured. Otherwise it is harmless (the path answers
# 404).
SecRule REQUEST_FILENAME "@streq /api/hooks.slack" \
    "id:9867113,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS:text,\
    ctl:ruleRemoveTargetById=932160;ARGS:text,\
    ctl:ruleRemoveTargetById=932230;ARGS:text,\
    ctl:ruleRemoveTargetById=932250;ARGS:text,\
    ctl:ruleRemoveTargetById=932370;ARGS:text,\
    ctl:ruleRemoveTargetById=941100;ARGS:text,\
    ctl:ruleRemoveTargetById=941110;ARGS:text,\
    ctl:ruleRemoveTargetById=941120;ARGS:text,\
    ctl:ruleRemoveTargetById=941160;ARGS:text,\
    ctl:ruleRemoveTargetById=941180;ARGS:text,\
    ctl:ruleRemoveTargetById=941390;ARGS:text,\
    ctl:ruleRemoveTargetById=942100;ARGS:text,\
    ctl:ruleRemoveTargetById=942190;ARGS:text,\
    ctl:ruleRemoveTargetById=942350;ARGS:text,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"
