# MCP search tools (list_documents, list_collections) take a free-text "query". Only that argument.
SecRule REQUEST_FILENAME "@streq /mcp" \
    "id:9867107,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.params.arguments.query,\
    ctl:ruleRemoveTargetById=942350;ARGS:json.params.arguments.query,\
