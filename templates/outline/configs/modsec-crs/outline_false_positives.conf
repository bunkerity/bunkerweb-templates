    ctl:ruleRemoveTargetById=932250;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=932370;ARGS:json.params.arguments.text,\
    ctl:ruleRemoveTargetById=932380;ARGS:json.params.arguments.text,\
