# Matrix client API tuning for Synapse. Type is "modsec-crs" (included before the CRS) so the
# phase:1 ctl actions below run ahead of the CRS rules they remove. A plain "modsec" config
# loads after the CRS and the removals would come too late. Every rule is limited to one
# method and one path shape; the rest of the API keeps the full CRS.

# 920440 (restricted file extension) fires on Matrix user ids and room aliases ending in
# ".com" when they are the last path segment (profile, typing, directory/room lookups).
# Identifiers ending in any other restricted extension (".bak", ".log", ...) stay blocked.
SecRule REQUEST_METHOD "@rx ^(?:GET|PUT|DELETE)$" \
    "id:10700,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/_matrix/client/(?:r0|v3)/(?:profile|rooms/[^/]+/typing|directory/room)/[^/]+\.(?i:com)$" \
        "t:none,\
        ctl:ruleRemoveById=920440"

# 920420 (content type) fires on media uploads, which Matrix clients send as the file's own
# content type (often application/octet-stream).
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT)$" \
    "id:10701,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/_matrix/media/(?:r0|v3)/upload$" \
        "t:none,\
        ctl:ruleRemoveById=920420"

# 942100 (libinjection SQLi) fires on chat text that mentions SQL, in the body and
# formatted_body of a sent message event. Only those two JSON fields on the send path are
# excluded; every other field and path, and every other SQLi rule, stays active.
SecRule REQUEST_METHOD "@streq PUT" \
    "id:10702,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/_matrix/client/(?:r0|v3)/rooms/[^/]+/send/[^/]+/[^/]+$" \
        "t:none,\
        ctl:ruleRemoveTargetById=942100;ARGS:json.body,\
        ctl:ruleRemoveTargetById=942100;ARGS:json.formatted_body"
