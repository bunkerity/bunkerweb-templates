# Synapse (Matrix) template - .well-known delegation
# Serves the Matrix client and server discovery documents so clients and
# federating servers can locate this homeserver. Replace the placeholder
# hostname in the two return 200 lines with the hostname where clients reach
# BunkerWeb. These lines name BunkerWeb's public HTTPS endpoint, never Synapse's
# own port 8008. The server line already ends in :443, BunkerWeb's public HTTPS
# port. Replace that port, and add it to the client line, only when BunkerWeb
# answers on another one.
location /.well-known/matrix/client {
    default_type application/json;
    # Wildcard CORS is required by the Matrix spec for client discovery.
    add_header Access-Control-Allow-Origin *;
    return 200 '{"m.homeserver":{"base_url":"https://example.com"}}';
}

location /.well-known/matrix/server {
    default_type application/json;
    # Wildcard CORS is required by the Matrix spec for server discovery.
    add_header Access-Control-Allow-Origin *;
    return 200 '{"m.server":"example.com:443"}';
}
