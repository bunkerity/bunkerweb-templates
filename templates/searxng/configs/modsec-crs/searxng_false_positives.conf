# SearXNG exclusions for the search text. Tested with SearXNG 2026.11.13, BunkerWeb 1.6.17,
# CRS 4.29.
# Keep this file as a modsec-crs config: it has no effect as a modsec config. Delete a rule to turn
# its exception off, and searches that look like an attack then get 403.
#
# What it lets through: the text typed in the search box (the q argument of /search and
# /autocompleter), whatever it is: shell commands, code in most languages, SQL questions, markup,
# template syntax, URLs, file paths and error messages. SearXNG never runs the text: it forwards it
# URL-encoded to the search engines it queries and prints it HTML-escaped. It also lets through the
# results page when that page repeats such text, for example a database or PHP error message that
# the CRS data leakage rules would deny.
#
# Cost: for q on those two paths the CRS no longer runs the 71 injection, code and protocol
# rules listed below, and the pages that come back are no longer checked for leaked error messages
# or source code. The same text in any other argument, on any other path or method, in a header or
# in a cookie is still inspected. Rule 949110 (the rule that blocks a request once its CRS score is
# too high) is never touched. On GET, the CRS rules 930100, 930110, 944150 and 920540 also skip the
# whole query string (see the rule for GET below), not only q.
#
# A search text that still gets 403 trips a CRS rule that is not listed here, and the log names its
# id. To allow it, copy any ARGS:q line in each of the two rules below, change the id, and keep the
# ids in numeric order.

# Search page: the query text in q, by GET (default) or POST (the "method" preference), as HTML,
# json, csv or rss. On POST the browser sends q in the body, so the raw URI and the request line
# stay inspected there: the rule below removes only ARGS:q and the response leakage rules. Rule
# 9871103 below removes the whole query string for GET, where the query string carries q. The
# attack-disclosure tag groups the CRS response rules that look for error messages and source code
# in the page: remove the line to keep them on the results page.
SecRule REQUEST_FILENAME "@streq /search" \
    "id:9871101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920270;ARGS:q,\
    ctl:ruleRemoveTargetById=920540;ARGS:q,\
    ctl:ruleRemoveTargetById=921110;ARGS:q,\
    ctl:ruleRemoveTargetById=921130;ARGS:q,\
    ctl:ruleRemoveTargetById=930100;ARGS:q,\
    ctl:ruleRemoveTargetById=930110;ARGS:q,\
    ctl:ruleRemoveTargetById=930120;ARGS:q,\
    ctl:ruleRemoveTargetById=931100;ARGS:q,\
    ctl:ruleRemoveTargetById=932120;ARGS:q,\
