    ctl:ruleRemoveTargetById=944130;ARGS:q,\
    ctl:ruleRemoveTargetById=944150;ARGS:q,\
    ctl:ruleRemoveByTag=attack-disclosure,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|POST)\z" \
        "t:none,\
        nolog"

# Search page on GET: the query string is part of the raw URI and of the request line, so a query
# that holds a path or shell string trips the path traversal rules (930100, 930110), 944150 and
# 920540 (an escaped Unicode character) on those targets as well as on ARGS:q. These targets cover
# the whole URI, not only q: for GET /search these four rules no longer read the rest of the query
# string either. To turn this off, delete the rule: path-like searches then get 403.
SecRule REQUEST_FILENAME "@streq /search" \
    "id:9871103,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920540;REQUEST_URI,\
    ctl:ruleRemoveTargetById=930100;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetById=930110;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetById=944150;REQUEST_LINE,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"

# Autocompleter: the browser sends what is typed so far in q on every keystroke, and the address
# bar does too. The page script puts the typed text in the URL without escaping an ampersand, so
