# SearXNG: CRS exclusions for the search text, loaded before the CRS (modsec-crs).
#
# The search box takes any text, so SQL, shell, markup, template and path strings are legitimate queries
# ("' OR 1=1 --", "../../etc/passwd", "<script>alert(1)</script>", "$(id)"). SearXNG never runs the text:
# it forwards it URL-encoded to the search engines it queries and prints it HTML-escaped.
#
# Every rule below names the rule ids that fired in the request matrix and removes only (rule id, target)
# pairs, for the search paths and methods that carry the query. The targets are ARGS:q and RESPONSE_BODY,
# plus, for GET only, REQUEST_URI_RAW and REQUEST_LINE for three rules: those two cover the whole URI, so
# on GET the three rules no longer read the rest of the query string either. The same payload in any other
# argument, on any other path or with any other method is still inspected.
# 949110 is never touched. ModSecurity logs a rule on its first matching target only, so the list was
# built by repeating the matrix until no seed was blocked.

# Search page: the query text in q, GET (default) or POST (the "method" preference), HTML and json/csv/rss.
# On POST the browser sends q in the body, so the raw URI and the request line stay inspected there: the
# rule below removes only ARGS:q and RESPONSE_BODY. Rule 9871103 below removes the raw URI and the request
# line for GET, where the query string carries q.
SecRule REQUEST_FILENAME "@streq /search" \
    "id:9871101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930100;ARGS:q,\
    ctl:ruleRemoveTargetById=930110;ARGS:q,\
    ctl:ruleRemoveTargetById=930120;ARGS:q,\
    ctl:ruleRemoveTargetById=931100;ARGS:q,\
    ctl:ruleRemoveTargetById=932130;ARGS:q,\
    ctl:ruleRemoveTargetById=932160;ARGS:q,\
    ctl:ruleRemoveTargetById=932230;ARGS:q,\
    ctl:ruleRemoveTargetById=932235;ARGS:q,\
    ctl:ruleRemoveTargetById=932250;ARGS:q,\
    ctl:ruleRemoveTargetById=932260;ARGS:q,\
    ctl:ruleRemoveTargetById=932370;ARGS:q,\
    ctl:ruleRemoveTargetById=932380;ARGS:q,\
    ctl:ruleRemoveTargetById=933100;ARGS:q,\
    ctl:ruleRemoveTargetById=933130;ARGS:q,\
    ctl:ruleRemoveTargetById=933135;ARGS:q,\
    ctl:ruleRemoveTargetById=933160;ARGS:q,\
    ctl:ruleRemoveTargetById=934110;ARGS:q,\
    ctl:ruleRemoveTargetById=934200;ARGS:q,\
    ctl:ruleRemoveTargetById=941100;ARGS:q,\
    ctl:ruleRemoveTargetById=941110;ARGS:q,\
    ctl:ruleRemoveTargetById=941120;ARGS:q,\
    ctl:ruleRemoveTargetById=941160;ARGS:q,\
    ctl:ruleRemoveTargetById=941390;ARGS:q,\
    ctl:ruleRemoveTargetById=942100;ARGS:q,\
    ctl:ruleRemoveTargetById=942151;ARGS:q,\
    ctl:ruleRemoveTargetById=942160;ARGS:q,\
    ctl:ruleRemoveTargetById=942190;ARGS:q,\
    ctl:ruleRemoveTargetById=942270;ARGS:q,\
    ctl:ruleRemoveTargetById=942280;ARGS:q,\
    ctl:ruleRemoveTargetById=942350;ARGS:q,\
    ctl:ruleRemoveTargetById=942360;ARGS:q,\
    ctl:ruleRemoveTargetById=944150;ARGS:q,\
    ctl:ruleRemoveTargetById=951220;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951230;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=952110;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=953100;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=953120;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=956100;RESPONSE_BODY,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|POST)\z" \
        "t:none,\
        nolog"

# Search page on GET: the query string is part of the raw URI and of the request line, so a query that holds
# a path or shell string trips the path traversal rules (930100, 930110) and 944150 on those two targets
# as well as on ARGS:q. These two targets cover the whole URI, not only q: for GET /search the three rules
# no longer read the rest of the query string either.
SecRule REQUEST_FILENAME "@streq /search" \
    "id:9871103,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930100;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetById=930110;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetById=944150;REQUEST_LINE,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"

# Autocompleter: the browser sends what is typed so far in q on every keystroke, and the address bar does too.
SecRule REQUEST_FILENAME "@streq /autocompleter" \
    "id:9871102,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930100;ARGS:q,\
    ctl:ruleRemoveTargetById=930100;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetById=930110;ARGS:q,\
    ctl:ruleRemoveTargetById=930110;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetById=930120;ARGS:q,\
    ctl:ruleRemoveTargetById=931100;ARGS:q,\
    ctl:ruleRemoveTargetById=932130;ARGS:q,\
    ctl:ruleRemoveTargetById=932160;ARGS:q,\
    ctl:ruleRemoveTargetById=932230;ARGS:q,\
    ctl:ruleRemoveTargetById=932235;ARGS:q,\
    ctl:ruleRemoveTargetById=932250;ARGS:q,\
    ctl:ruleRemoveTargetById=932260;ARGS:q,\
    ctl:ruleRemoveTargetById=932370;ARGS:q,\
    ctl:ruleRemoveTargetById=932380;ARGS:q,\
    ctl:ruleRemoveTargetById=933100;ARGS:q,\
    ctl:ruleRemoveTargetById=933130;ARGS:q,\
    ctl:ruleRemoveTargetById=933135;ARGS:q,\
    ctl:ruleRemoveTargetById=933160;ARGS:q,\
    ctl:ruleRemoveTargetById=934110;ARGS:q,\
    ctl:ruleRemoveTargetById=934200;ARGS:q,\
    ctl:ruleRemoveTargetById=941100;ARGS:q,\
    ctl:ruleRemoveTargetById=941110;ARGS:q,\
    ctl:ruleRemoveTargetById=941120;ARGS:q,\
    ctl:ruleRemoveTargetById=941160;ARGS:q,\
    ctl:ruleRemoveTargetById=941390;ARGS:q,\
    ctl:ruleRemoveTargetById=942100;ARGS:q,\
    ctl:ruleRemoveTargetById=942151;ARGS:q,\
    ctl:ruleRemoveTargetById=942160;ARGS:q,\
    ctl:ruleRemoveTargetById=942190;ARGS:q,\
    ctl:ruleRemoveTargetById=942270;ARGS:q,\
    ctl:ruleRemoveTargetById=942280;ARGS:q,\
    ctl:ruleRemoveTargetById=942350;ARGS:q,\
    ctl:ruleRemoveTargetById=942360;ARGS:q,\
    ctl:ruleRemoveTargetById=944150;ARGS:q,\
    ctl:ruleRemoveTargetById=944150;REQUEST_LINE,\
    ctl:ruleRemoveTargetById=951220;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951230;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=952110;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=953100;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=953120;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=956100;RESPONSE_BODY,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"
