# Jellyfin exclusion for the web client config. Tested with BunkerWeb 1.6.17, CRS 4.29.
# The web client loads /web/config.json at start, and CRS rule 930130 (restricted file) refuses that
# file name, so the client would not open. Cost: rule 930130 is off for that one exact path and no
# other, so a request for any other config.json is still refused. Delete the rule to turn the
# exception off. Keep this file as a modsec-crs config: it has no effect as a modsec config.
SecRule REQUEST_FILENAME "@streq /web/config.json" \
    "id:9859100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=930130"
