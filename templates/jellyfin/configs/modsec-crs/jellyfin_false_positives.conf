# Jellyfin ModSecurity adjustments for config API requests.
# The web client fetches /web/config.json, and 930130 (restricted file) flags the name.
# Exact path only: the rule matches that one path, not every path that contains the text.
SecRule REQUEST_FILENAME "@streq /web/config.json" \
    "id:9859100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=930130"
