# Jellyfin exclusions. Keep this file as a modsec-crs config: it has no effect as a modsec config.
# To turn one exception off, delete its rule here. Every exception is limited to one request shape,
# so a request that differs in path, method or field keeps the full CRS checks.

# Web client start-up. The client loads /web/config.json when it opens, and CRS rule 930130
# (restricted file) refuses that file name, so the client would not open. Cost: rule 930130 is off
# for that one exact path and no other, so a request for any other config.json is still refused.
SecRule REQUEST_FILENAME "@streq /web/config.json" \
    "id:9859100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=930130"

# Picture uploads: poster, backdrop and logo of a library item (Edit images) and the profile picture
# of a user. Jellyfin sends the picture encoded as text, a third larger than the file, but labels
# the request with an image content type, so CRS rule 920420 (request content type not allowed)
# refuses the upload. Cost: rule 920420 is off for POST requests to those picture routes whose
# content type starts with image/, and for nothing else. The encoding makes the largest picture
# you can upload about three quarters of MAX_CLIENT_SIZE. Delete the rule and uploads fail again.
SecRule REQUEST_METHOD "@streq POST" \
    "id:9859110,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=920420,\
    chain"
    SecRule REQUEST_FILENAME "@rx \A(?:/(?:Items|Users)/[0-9a-fA-F-]{32,36}/Images/[A-Za-z]+(?:/[0-9]+)?|/UserImage)\z" \
        "t:none,\
        t:normalizePath,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx \Aimage/[a-z0-9.+-]+\z" \
            "t:none,\
            t:lowercase"

# Dashboard, Branding, Custom CSS. Themes are added with one or more import lines for a font or a
# community theme, and CRS rules 941170 and 941130 (XSS attribute checks) read those lines as an
# attack, so the save fails. Cost: those two rules are off for the CustomCss field of the branding
# save request (POST to /System/Configuration/branding) and nowhere else. The other XSS rules still
# check that field, and the login disclaimer and every other URL keep all of them. Images written
# inline in the CSS text are still refused: host the file and link to it. Delete the rule and
# import lines are refused again.
SecRule REQUEST_METHOD "@streq POST" \
    "id:9859120,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetById=941130;ARGS:json.CustomCss,\
    ctl:ruleRemoveTargetById=941170;ARGS:json.CustomCss,\
    chain"
    SecRule REQUEST_FILENAME "@streq /System/Configuration/branding" \
        "t:none,\
        t:normalizePath"
