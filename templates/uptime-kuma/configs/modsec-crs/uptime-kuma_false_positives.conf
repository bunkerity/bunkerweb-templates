# Uptime Kuma 2.5.5 / BunkerWeb 1.6.15 recipe, scripted tests on 2026-10-06.
# Socket.IO polling sends text/plain packets. Load before CRS phase 1 rule 920420.
# Only POST /socket.io/ with this media type loses the content-type restriction.
# CRS has no text/plain body parser; these packets are not inspected as JSON or forms.
SecRule REQUEST_FILENAME "@streq /socket.io/" \
    "id:77800,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^text/plain(?:[ \t]*;|[ \t]*$)" \
            "t:none,ctl:ruleRemoveById=920420"
