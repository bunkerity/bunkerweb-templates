# Uptime Kuma dashboard fix: lets Socket.IO polling through the CRS. The Uptime Kuma web app talks
# to its server through Socket.IO polling, which sends text/plain packets, and CRS rule 920420
# rejects that content type, so the dashboard would not load data. Keep this file as a modsec-crs
# config: it has no effect as a modsec config.
#
# What it lets through: POST /socket.io/ with a text/plain body. Other paths, methods and content
# types keep that check.
# Cost: the CRS has no parser for text/plain, so those packets are not inspected as JSON or forms.
# After the WebSocket upgrade, frames are not inspected either.
# To turn it off, delete the rule below and save the service.
SecRule REQUEST_FILENAME "@streq /socket.io/" \
    "id:9876100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx (?i)\Atext/plain(?:[ \t]*;|[ \t]*\z)" \
            "t:none,\
            ctl:ruleRemoveById=920420"
