# Uptime Kuma Socket.IO exclusion. Tested with Uptime Kuma 2.5.5, BunkerWeb 1.6.17, CRS 4.29.
# The Uptime Kuma web app talks to its server through Socket.IO polling, which sends text/plain
# packets, and CRS rule 920420 rejects that content type, so the dashboard would not load data.
# Only POST /socket.io/ with the text/plain type skips that check. Cost: the CRS has no parser for
# text/plain, so those packets are not inspected as JSON or forms. Delete the rule to turn the
# exception off. Keep this file as a modsec-crs config: it has no effect as a modsec config.
SecRule REQUEST_FILENAME "@streq /socket.io/" \
    "id:9876100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx (?i)\Atext/plain(?:[ \t]*;|[ \t]*\z)" \
            "t:none,\
            ctl:ruleRemoveById=920420"
