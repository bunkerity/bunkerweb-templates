# Pocket ID exclusions for callback URLs and admin secrets. Tested with Pocket ID v2.19.3,
# BunkerWeb 1.6.17, CRS 4.29. Keep this file as a modsec-crs config: it has no effect as a modsec
# config. Delete a rule to turn its exception off.
#
# Pocket ID accepts callback URLs whose host is an IP address or a local development name, and the
# CRS flags those as remote file inclusion or SSRF. There is one rule per argument. Each rule
# needs, in this order: the exact path, the method, exactly one occurrence of the argument coming
# from the right place (query string or body), and (URL fields) a value that is a plain http(s)
# URL whose host is an IPv4 or IPv6 literal or a local development name. Only then does it turn off
# the named CRS rules for that one argument. Cost: those rules do not check that argument.
# Anything else stays fully inspected, and so does every other rule on the argument.
# The host never matches a spelling of the link-local range 169.254.0.0/16 (cloud metadata): not
# 169.254.x.x, not an IPv6 literal that ends in a9fe:x (IPv4-compatible, IPv4-mapped, any NAT64 /96
# prefix), not the NAT64 prefix 64:ff9b::/32, not 6to4 2002::/16, and not the AWS and Google Cloud
# IPv6 metadata prefixes fd00:ec2: and fd20:ce:.
# A client can have 10 callback URLs and 10 logout callback URLs (index 0 to 9). An eleventh URL
# is blocked by the CRS again (see the README).

# OIDC authorization request (browser redirect, GET): redirect_uri.
SecRule REQUEST_FILENAME "@streq /authorize" \
    "id:9869100,\
    phase:2,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetById=932130;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetById=934110;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetById=934190;ARGS:redirect_uri,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog,\
        chain"
        SecRule &ARGS:redirect_uri "@eq 1" \
            "t:none,\
            nolog,\
            chain"
            SecRule &ARGS_GET:redirect_uri "@eq 1" \
                "t:none,\
                nolog,\
                chain"
                SecRule ARGS:redirect_uri "@rx (?i)\Ahttps?://(?:(?!169\.254\.)(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])|\[(?!fd00:0?ec2:|fd20:0{0,2}ce:|(?:0{0,4}:){0,6}ffff:|0*64:ff9b:|0*2002:|(?:[0-9a-f:]*:)?a9fe:[0-9a-f]{1,4}(?:%|\])|(?:[0-9a-f]{1,4}:){6}a9fe::(?:%|\]))[0-9a-f:]{2,39}(?:%(?:25)?[0-9a-z._~-]{1,16})?\]|(?:[a-z0-9-]+\.)*(?:localhost|localhost\.localdomain|ip6-localhost|host\.docker\.internal|gateway\.docker\.internal|host\.containers\.internal|lvh\.me|localtest\.me))(?::[0-9]{1,5})?(?:/[0-9a-z._~:@!&=+%,*/-]*)?(?:\?[0-9a-z._~:@!&=+%,*/?-]*)?\z" \
                    "t:none,\
                    nolog"

