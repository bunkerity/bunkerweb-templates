# Matrix client API tuning for Tuwunel. Tested with BunkerWeb 1.6.17, CRS 4.29. Keep this file as a
# modsec-crs config: it has no effect as a modsec config. Every rule is limited to one method and
# one path shape; the rest of the API keeps the full CRS. Delete a rule to turn its exception off.

# 920440 (restricted file extension) fires on Matrix identifiers that end in ".com" when they are the
# last path segment: user ids, room aliases and room ids of a homeserver whose name ends in ".com".
# That covers profile and typing lookups, directory, join and knock, room state and push rules, and
# the federation and key requests other homeservers send. Browsers also send a preflight (OPTIONS)
# for these paths. This rule lets them through under the Matrix client, federation and key API
# prefixes. Cost: a last segment ending in ".com" under those prefixes skips that check. Any other
# restricted extension stays blocked, and so does ".com" on every other path (media downloads,
# /_synapse/, anything outside /_matrix/). Delete the rule to turn the exception off.
SecRule REQUEST_METHOD "@rx \A(?:GET|POST|PUT|DELETE|OPTIONS)\z" \
    "id:9874100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@rx \A/_matrix/(?:client/(?:r0|v[0-9]+|unstable)/(?!media/)|federation/v[0-9]+/|key/v[0-9]+/)(?:[^/]+/)*[^/]+\.(?i:com)\z" \
        "t:none,\
        t:normalizePath,\
        ctl:ruleRemoveById=920440"

# 920420 (content type) fires on media uploads, which Matrix clients send as the file's own
# content type (often application/octet-stream). Cost: an upload on that path may use any content
# type.
SecRule REQUEST_METHOD "@rx \A(?:POST|PUT)\z" \
    "id:9874101,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@rx \A/_matrix/media/(?:r0|v3)/upload\z" \
        "t:none,\
        ctl:ruleRemoveById=920420"

# 942100 (libinjection SQL injection) fires on chat text that mentions SQL, in the body and
# formatted_body of a sent message event. Only those two JSON fields on the send path are
# excluded; every other field and path, and every other SQL injection rule, stays active. Cost:
# rule 942100 does not check the text of sent messages.
SecRule REQUEST_METHOD "@streq PUT" \
    "id:9874102,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@rx \A/_matrix/client/(?:r0|v3)/rooms/[^/]+/send/[^/]+/[^/]+\z" \
        "t:none,\
        ctl:ruleRemoveTargetById=942100;ARGS:json.body,\
        ctl:ruleRemoveTargetById=942100;ARGS:json.formatted_body"
