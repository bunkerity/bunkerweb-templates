# authentik 2026.8.3 / BunkerWeb 1.6.15 recipe, scripted tests on 2026-10-06.
# Admin policies contain Python; keep other fields and endpoints inspected.
SecRule REQUEST_FILENAME "@rx ^/api/v3/policies/expression/(?:[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}/)?$" \
    "id:77100,phase:1,pass,nolog,t:none,t:normalizePath,chain,\
    ctl:ruleRemoveTargetById=932140;ARGS:json.expression,\
    ctl:ruleRemoveTargetById=933160;ARGS:json.expression,\
    ctl:ruleRemoveTargetById=934100;ARGS:json.expression,\
    ctl:ruleRemoveTargetById=941390;ARGS:json.expression,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.expression,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.expression"
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" "t:none,nolog"

# Branding CSS legitimately resembles XSS to these rules.
SecRule REQUEST_FILENAME "@rx ^/api/v3/core/brands/(?:[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}/)?$" \
    "id:77101,phase:1,pass,nolog,t:none,t:normalizePath,chain,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.branding_custom_css,\
    ctl:ruleRemoveTargetById=941130;ARGS:json.branding_custom_css,\
    ctl:ruleRemoveTargetById=941160;ARGS:json.branding_custom_css,\
    ctl:ruleRemoveTargetById=941170;ARGS:json.branding_custom_css"
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" "t:none,nolog"

# Prompt placeholders and help text may contain HTML.
SecRule REQUEST_FILENAME "@rx ^/api/v3/stages/prompt/prompts/(?:[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}/)?$" \
    "id:77102,phase:1,pass,nolog,t:none,t:normalizePath,chain,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.placeholder,\
    ctl:ruleRemoveTargetById=941120;ARGS:json.placeholder,\
    ctl:ruleRemoveTargetById=941160;ARGS:json.placeholder,\
    ctl:ruleRemoveTargetById=941390;ARGS:json.placeholder,\
    ctl:ruleRemoveTargetById=941160;ARGS:json.sub_text"
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" "t:none,nolog"
