# Lets authentik administrators save Python policies, brand CSS and prompt help text through the
# admin API. Tested with authentik 2026.8.3, BunkerWeb 1.6.17, CRS 4.29.
#
# Each block below covers one API path (the list and one object by id), the methods POST, PUT and
# PATCH, and the named JSON fields only. Every other field, path and method stays fully inspected,
# and a request that trips any other CRS rule is still blocked. A script tag or a javascript link in
# these fields is one of those: it stays blocked. To turn one exception off, delete its block (its
# comment and the two directives under it). Keep the file in the modsec-crs config type: it has no
# effect in another type.
#
# Expression policies (/api/v3/policies/expression/): admins write Python in the "expression" field,
# which looks like shell, PHP, Node, XSS and SQL injection to the CRS (rules 932140, 933160, 934100,
# 941390, 942100, 942190). Only that one field skips them. Cost: injection text in a policy
# expression is no longer flagged, so keep admin access to authentik restricted.
SecRule REQUEST_FILENAME "@rx \A/api/v3/policies/expression/(?:[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}/)?\z" \
    "id:9851100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=932140;ARGS:json.expression,\
    ctl:ruleRemoveTargetById=933160;ARGS:json.expression,\
    ctl:ruleRemoveTargetById=934100;ARGS:json.expression,\
    ctl:ruleRemoveTargetById=941390;ARGS:json.expression,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.expression,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.expression,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT|PATCH)\z" \
        "t:none,\
        nolog"

# Branding (/api/v3/core/brands/): the custom CSS in "branding_custom_css" resembles XSS to the
# 941100, 941130, 941160 and 941170 rules. Only that field skips them. Cost: script-like text in
# the brand CSS is no longer flagged.
SecRule REQUEST_FILENAME "@rx \A/api/v3/core/brands/(?:[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}/)?\z" \
    "id:9851101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.branding_custom_css,\
    ctl:ruleRemoveTargetById=941130;ARGS:json.branding_custom_css,\
    ctl:ruleRemoveTargetById=941160;ARGS:json.branding_custom_css,\
    ctl:ruleRemoveTargetById=941170;ARGS:json.branding_custom_css,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT|PATCH)\z" \
        "t:none,\
        nolog"

# Prompt stage fields (/api/v3/stages/prompt/prompts/): the "placeholder" and "sub_text" (help text)
# fields may contain HTML, which trips the XSS rules 941100, 941120, 941160 and 941390. Only those
# two fields skip them. Cost: HTML in those two fields is no longer flagged.
SecRule REQUEST_FILENAME "@rx \A/api/v3/stages/prompt/prompts/(?:[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}/)?\z" \
    "id:9851102,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.placeholder,\
    ctl:ruleRemoveTargetById=941120;ARGS:json.placeholder,\
    ctl:ruleRemoveTargetById=941160;ARGS:json.placeholder,\
    ctl:ruleRemoveTargetById=941390;ARGS:json.placeholder,\
    ctl:ruleRemoveTargetById=941160;ARGS:json.sub_text,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT|PATCH)\z" \
        "t:none,\
        nolog"
