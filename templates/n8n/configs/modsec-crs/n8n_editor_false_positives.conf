# n8n editor exclusions. Tested with n8n 2.48.4, BunkerWeb 1.6.17, CRS 4.29.
#
# The editor saves and runs workflows by sending the whole workflow document as JSON. A workflow IS
# code: Code nodes (JavaScript with require), SQL queries, shell commands, URLs, HTML, expressions
# and pinned test data all travel as argument values, so every injection rule can fire on content
# the user is meant to write. The editor also needs an authenticated n8n user, who can already run
# code on the n8n host through those same nodes.
#
# The exclusions cover these five exact method and path pairs only:
#   POST  /rest/workflows                         save a new workflow
#   PATCH /rest/workflows/<id>                    save (Ctrl+S)
#   POST  /rest/workflows/<id>/run                run from the editor
#   POST  /rest/dynamic-node-parameters/<kind>    node parameter lookups
#   GET   /types/credentials.json                 editor start-up file (file name target only)
#
# What goes, on the first four: the arguments of the request are no longer checked by the paranoia
# level 1 rules of the injection families (921120 and 921130, 930, 931, 932, 933, 934, 941 and 942:
# 89 rules). Any node can carry any of these kinds of text, so every argument is covered. Naming the
# arguments one by one is not possible: the argument name carries the node position (for example
# json.nodes.array_3.parameters.jsCode) and pinned data carries the node name.
# Cost: injection text in a workflow document is not flagged on these four requests, so keep n8n
# accounts restricted to people you trust to run code.
# What stays: every other rule on these requests (protocol, method, header, content type, session
# and scanner rules), headers, cookies, the query string rules for every other path, and every rule
# on every other path, including the webhooks. Rule 949110 (the rule that blocks a request once its
# CRS score is too high) is never touched.
#
# Raising the paranoia level does not widen the list: rules of level 2 and above are not in it, so
# they keep inspecting editor saves. Expect false positives there and add them the same way. Delete
# a rule to turn its exception off, and saving a workflow then fails with 403. Keep this file as a
# modsec-crs config: it has no effect as a modsec config.

