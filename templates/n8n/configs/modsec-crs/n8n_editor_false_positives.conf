# The editor loads its credential type list from GET /types/credentials.json when it starts. The
# file name is on the CRS restricted file list (rule 930130, credentials.json), so without this
# exclusion the editor opens with "Failed to initialize n8n types". Only the file name target of
# that one rule is removed, and only for this exact path and method.
SecRule REQUEST_FILENAME "@streq /types/credentials.json" \
    "id:9861104,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930130;REQUEST_FILENAME,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"
