# n8n form exclusions. Tested with n8n 2.48.4, BunkerWeb 1.6.17, CRS 4.29.
#
# Forms (Form Trigger, and Wait or Form nodes that show a form) cannot be submitted from a browser
# without this file.
#
# The form page builds its POST as a FormData object and appends every element of the form,
# including the submit button, which has no name. The body therefore always carries empty-name parts
# (Content-Disposition: form-data; name=""). libmodsecurity cannot parse such a part ("Multipart:
# Final boundary missing."), so BunkerWeb rules 200002 ("Failed to parse request body",
# REQBODY_ERROR) and 200003 (strict multipart validation) answer 400, and the browser reports a
# CORS error (the 400 page has no Access-Control-Allow-Origin, and the sandboxed form page sends
# Origin: null). curl never shows this, because it sends no such part. Rule 200004 (unmatched
# boundary) never fires on these posts and stays active.
#
# This file removes rules 200002 and 200003, only for POST with a multipart/form-data body on the
# form paths.
# THE COST: once the parser has failed on an empty-name part, ModSecurity builds no argument list
# from the body at all, so the CRS inspects NONE of the form fields of that request, wherever the
# empty-name part sits in the body (a SQL injection in the first field, before the empty-name part,
# passes). Only the few CRS rules that also read the raw body (Java 944xxx, RFI 931xxx, some
# 920/921/934 rules) keep firing. Anyone can add an empty-name part to a hand-made request. Without
# an empty-name part the body is parsed and inspected as usual. The query string, headers and
# cookies of form requests stay inspected.
# Treat form data like raw webhook bodies: untrusted, and validate it in the workflow. The same two
# rules keep rejecting malformed bodies on every other path, and on the form paths for any other
# content type or method. Delete this file if you do not use browser forms.
#
# Why it is not narrower: ModSecurity has no setting that accepts an empty-name part and still
# parses the rest of the body. Re-checking the raw body with custom rules caught only about half of
# what the CRS blocks and added false positives on file uploads, so this template does not ship
# that.

# Forms: POST /form/<webhookId>, /form-test/<webhookId>, /form-waiting/<executionId>
SecRule REQUEST_FILENAME "@rx \A/form(?:-test|-waiting)?/[A-Za-z0-9_-]+\z" \
    "id:9861122,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveById=200002,\
    ctl:ruleRemoveById=200003,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx \Amultipart/form-data\s*;" \
            "t:none,\
            t:lowercase,\
            nolog"
