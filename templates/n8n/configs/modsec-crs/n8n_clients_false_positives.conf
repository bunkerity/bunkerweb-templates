# n8n Chat Trigger and MCP client exclusions. Tested with n8n 2.48.4, BunkerWeb 1.6.17, CRS 4.29.
#
# Two kinds of n8n client get blocked on a request shape that is not an attack: the Chat Trigger API
# and MCP clients name an argument "sessionId" and send no Referer.
# CRS rule 943120 ("Possible Session Fixation Attack: SessionID Parameter Name with No Referer")
# blocks any argument named like a session id when the request has no Referer header, so these
# requests get 403 before n8n sees them. The hosted chat page and the embedded chat widget send a
# Referer and pass. curl, server-side integrations, mobile apps and MCP clients (Claude, Cursor,
# mcp-remote) do not.
# "sessionId" is a conversation key chosen by the client, not a login session, so the session
# fixation rule has nothing to protect here. Only the argument NAME is removed from 943120, only for
# these exact method and path shapes. Every other argument, rule and path is unchanged. Cost: rule
# 943120 no longer checks session id arguments on these requests. Delete a rule to turn its
# exception off, and those clients get 403 again. Keep this file as a modsec-crs config: it has no
# effect as a modsec config.

# Chat Trigger: POST /webhook/<webhookId>/chat, with "sessionId" in the JSON body (or a form field).
SecRule REQUEST_FILENAME "@rx \A/webhook/[0-9A-Fa-f-]{36}/chat\z" \
    "id:9861120,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=943120;ARGS_NAMES:json.sessionId,\
    ctl:ruleRemoveTargetById=943120;ARGS_NAMES:sessionId,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# MCP Server Trigger (SSE transport): each client message is POST /mcp/<path>?sessionId=<uuid>.
SecRule REQUEST_FILENAME "@rx \A/mcp/[A-Za-z0-9._~-]+\z" \
    "id:9861121,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=943120;ARGS_NAMES:sessionId,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"
