# n8n webhook exclusions. Tested with n8n 2.48.4, BunkerWeb 1.6.17, CRS 4.29.
#
# Keep this file as a modsec-crs config: it has no effect as a modsec config. Delete a rule to turn
# its exception off.
#
# Webhooks take whatever the caller sends: production (/webhook/<path>), test (/webhook-test/<path>,
# while the editor listens) and the resume URL of a Wait node (/webhook-waiting/<execution>). The
# CRS content type policy only knows form, multipart, JSON and XML, so a raw file body
# (application/octet-stream, application/pdf, an image, a zip) gets 403 from rule 920420 before
# n8n sees it.
#
# Rule 920420 reads the Content-Type header, so that header is the target that is removed, and only
# when the type mentions neither json nor xml and does not start with text/. n8n parses
# application/json and anything ending in /xml or +xml into the workflow, and BunkerWeb enables
# its JSON and XML parsers only for application/json, application/xml, text/xml and
# application/soap+xml. Without the condition, a JSON or XML body sent as a type such as
# application/atom+xml would reach the workflow with no body inspection. With it, those types
# keep getting 403 from 920420, and form, multipart, JSON and XML bodies keep being inspected as
# before. Cost: a raw body of any other type is accepted on webhook paths and is not inspected, so
# validate it in the workflow. Delete the rule to refuse such bodies again.
SecRule REQUEST_FILENAME "@rx \A/webhook(?:-test|-waiting)?/.+\z" \
    "id:9861110,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920420;REQUEST_HEADERS:Content-Type,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT|PATCH)\z" \
        "t:none,\
        nolog,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "!@rx (?i:json|xml|\Atext/)" \
            "t:none,\
            nolog"

# A body with no Content-Type at all: n8n accepts it as binary. Rule 920340 reads Content-Length and
# rule 920640 reads the body length, so those are the targets. ModSecurity never parses or inspects
# a body with no type, with or without these exclusions. Cost: a body with no Content-Type is
# accepted on webhook paths.
SecRule REQUEST_FILENAME "@rx \A/webhook(?:-test|-waiting)?/.+\z" \
    "id:9861111,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920340;REQUEST_HEADERS:Content-Length,\
    ctl:ruleRemoveTargetById=920640;REQUEST_BODY_LENGTH,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT|PATCH)\z" \
        "t:none,\
        nolog,\
        chain"
        SecRule &REQUEST_HEADERS:Content-Type "@eq 0" \
            "t:none,\
            nolog"

# curl and some other clients send "Expect: 100-continue" with any body over 1 MiB, and CRS rule
# 920450 lists that header as restricted. Only the Expect header name is removed from the target of
# that rule, so it keeps checking every other header name (Proxy, Lock-Token, Content-Range, If,
# Content-Encoding and the method override headers stay blocked, with or without Expect). The
# target name is case sensitive: Expect (HTTP/1) and expect (HTTP/2) are covered, and a header
# spelled eXpEcT is still blocked. The value must be 100-continue. Any other Expect value stays
# blocked. Cost: the Expect header is accepted on webhook paths.
SecRule REQUEST_FILENAME "@rx \A/webhook(?:-test|-waiting)?/.+\z" \
    "id:9861112,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:Expect,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:expect,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT|PATCH)\z" \
        "t:none,\
        nolog,\
        chain"
        SecRule REQUEST_HEADERS:Expect "@streq 100-continue" \
            "t:none,\
            t:lowercase,\
            nolog"
