# n8n 2.48.4 / BunkerWeb 1.6.17 recipe, request matrix on 2026-11-17.
#
# Webhooks take whatever the caller sends: production (`/webhook/<path>`), test (`/webhook-test/<path>`,
# while the editor listens) and the resume URL of a Wait node (`/webhook-waiting/<execution>`). The CRS content type
# policy only knows form, multipart, JSON and XML, so a raw file body (`application/octet-stream`,
# `application/pdf`, an image, a zip) gets 403 from 920420 before n8n sees it.
#
# 920420 reads the Content-Type header, so the header is the target that is removed, and only
# when the type mentions neither json nor xml. n8n parses `application/json` and anything ending
# in `/xml` or `+xml` into the workflow, and BunkerWeb arms its JSON and XML parsers only for
# `application/json`, `application/xml`, `text/xml` and `application/soap+xml`. Without the
# condition, a JSON or XML body sent as a type such as `application/atom+xml` would reach the
# workflow with no body inspection. With it, those types keep getting 403 from 920420, and form,
# multipart, JSON and XML bodies keep being inspected as before.
SecRule REQUEST_FILENAME "@rx \A/webhook(?:-test|-waiting)?/.+\z" \
    "id:9861110,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920420;REQUEST_HEADERS:Content-Type,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT|PATCH)\z" \
        "t:none,\
        nolog,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "!@rx (?i:json|xml|\Atext/)" \
            "t:none,\
            nolog"

# A body with no Content-Type at all: n8n accepts it as binary (checked directly against n8n 2.48.4).
# 920340 reads Content-Length and 920640 reads the body length, so those are the targets. A body
# with no type is never parsed or inspected by ModSecurity, with or without these rules.
SecRule REQUEST_FILENAME "@rx \A/webhook(?:-test|-waiting)?/.+\z" \
    "id:9861111,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920340;REQUEST_HEADERS:Content-Length,\
    ctl:ruleRemoveTargetById=920640;REQUEST_BODY_LENGTH,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT|PATCH)\z" \
        "t:none,\
        nolog,\
        chain"
        SecRule &REQUEST_HEADERS:Content-Type "@eq 0" \
            "t:none,\
            nolog"

# curl, and some other clients, send "Expect: 100-continue" with any body over 1 MiB. CRS 920450 lists
# that header as restricted. Only the Expect header name is removed from the rule's target, so the rule
# keeps checking every other header name (Proxy, Lock-Token, Content-Range, If, Content-Encoding and the
# method override headers stay blocked, with or without Expect). The target name is case sensitive:
# `Expect` (HTTP/1) and `expect` (HTTP/2) are covered, a header spelled `eXpEcT` is still blocked.
# The value must be 100-continue; any other Expect value stays blocked.
SecRule REQUEST_FILENAME "@rx \A/webhook(?:-test|-waiting)?/.+\z" \
    "id:9861112,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:Expect,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:expect,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT|PATCH)\z" \
        "t:none,\
        nolog,\
        chain"
        SecRule REQUEST_HEADERS:Expect "@streq 100-continue" \
            "t:none,\
            t:lowercase,\
            nolog"
