# n8n public API and MCP server exclusions. Tested with n8n 2.48.4, BunkerWeb 1.6.17, CRS 4.29.
#
# Tools that build workflows from code reach n8n without the editor: scripts and CI jobs call the
# public API (X-N8N-API-KEY), and AI clients call the instance-level MCP server (bearer API key or
# OAuth). Both send the same workflow document as the editor, or the code that makes one, as JSON
# argument values: Code nodes, SQL, shell, URLs, HTML. The CRS injection rules fire on it exactly as
# they do on an editor save (n8n_editor_false_positives.conf has the full reasoning). The caller
# must hold an n8n API key or an MCP token, which already allows running code on the n8n host.
# BunkerWeb cannot check that key, n8n does. Cost: injection text in the workflow code of these
# requests is not flagged. Delete a rule to turn its exception off. Keep this file as a modsec-crs
# config: it has no effect as a modsec config.
#
# The exclusions cover these three exact method and path pairs only:
#   POST /api/v1/workflows              create a workflow
#   PUT  /api/v1/workflows/<id>         replace a workflow
#   POST /mcp-server/http               instance-level MCP: create_workflow_from_code, ...
# Same list as the editor: the 89 paranoia level 1 injection rules lose the ARGS target. Nothing
# else changes. Other public API paths (reads, activate, credentials), headers, cookies, content
# type rules and every other path stay inspected. Rule 949110 is never touched.
# The public API path prefix is "api" by default (N8N_PUBLIC_API_ENDPOINT). Change the two API paths
# below if you changed it.

