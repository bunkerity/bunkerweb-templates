# Pi-hole exclusions. Tested with BunkerWeb 1.6.17, CRS 4.29. Keep this file as a modsec-crs
# config: it has no effect as a modsec config.
#
# The Pi-hole web admin UI (/admin/) and REST API (/api/) legitimately send payloads that look
# hostile to the OWASP CRS: filesystem-like paths, regex blocklists, dnsmasq option strings, and
# HTML or JavaScript-like values. The rules below turn off whole CRS categories, but only for those
# two path prefixes, so the rest of the site keeps full protection. They are broad on purpose.
# Cost: on /api/ and /admin/ the listed attack categories are not checked at all. To tighten a
# rule, replace its ruleRemoveByTag with the ruleRemoveById values you see in the BunkerWeb log
# (the log shows the id of each rule that fired). Delete a rule to turn it off.

# /api/ - the local file inclusion rules (930xxx) flag the file-path-like list and group names and
# config keys the Pi-hole API accepts as parameters. Safe to turn off here because the API never
# serves files from those values.
SecRule REQUEST_FILENAME "@beginsWith /api/" \
    "id:9868101,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveByTag=attack-lfi"

# /api/ - the remote code execution rules (932xxx) flag command- and shell-like text inside
# dnsmasq options and regex blocklists submitted through the API. Pi-hole stores them as
# configuration and does not run them as shell commands, so the category is turned off here.
SecRule REQUEST_FILENAME "@beginsWith /api/" \
    "id:9868102,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveByTag=attack-rce"

# /api/ - rule 920420 rejects content types not on the CRS allow list; the Pi-hole API exchanges
# bodies of types that would otherwise be blocked. Cost: any content type is accepted on /api/.
SecRule REQUEST_FILENAME "@beginsWith /api/" \
    "id:9868104,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=920420"

# /admin/ - the local file inclusion rules (930xxx) flag the log paths, adlist URLs and query
# database parameters the admin UI passes around. Turned off only for the admin prefix.
SecRule REQUEST_FILENAME "@beginsWith /admin/" \
    "id:9868105,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveByTag=attack-lfi"

# /admin/ - the XSS rules (941xxx) flag the regex filters, custom DNS entries and domain strings
# with special characters submitted from the admin settings pages. Turned off only for the admin
# prefix.
SecRule REQUEST_FILENAME "@beginsWith /admin/" \
    "id:9868106,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveByTag=attack-xss"
