# Pi-hole v6 exclusions. Keep this file as a modsec-crs config: it has no effect as a modsec config.
#
# The Pi-hole web interface sends everything it saves to the REST API under /api/. Several of those
# fields hold text that the OWASP CRS reads as an attack: file paths in dnsmasq lines and group
# names, command-like words in regex filters, and free-text comments. Each rule below turns off one
# CRS check on /api/ and nowhere else, so the web interface pages keep full protection.
# Cost: on /api/, the checks named in each rule are off. To tighten a rule, replace its
# ruleRemoveByTag with the ruleRemoveById values you see in the BunkerWeb log (the log shows the id
# of each rule that fired). Delete a rule to turn it off.

# /api/ - the file inclusion rules (930xxx) flag paths in the dnsmasq lines of Settings, All settings,
# Miscellaneous (for example a directory to read extra configuration from), in group names and in
# filter text. Pi-hole stores these values as configuration and never opens a file from them.
# Cost: path traversal and restricted file checks are off on /api/.
SecRule REQUEST_FILENAME "@beginsWith /api/" \
    "id:9868101,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveByTag=attack-lfi"

# /api/ - the remote command execution rules (932xxx) flag command-like words in regex filters, for
# example a filter that lists several common SQL words as alternatives. Pi-hole stores filters as
# configuration and does not run them as shell commands.
# Cost: command injection checks are off on /api/.
SecRule REQUEST_FILENAME "@beginsWith /api/" \
    "id:9868102,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveByTag=attack-rce"

# /api/ - rule 942350 flags a semicolon followed by an SQL word in free text, which admins write
# in notes about why a domain is blocked or when to review it. The comment of a domain, an adlist,
# a group or a client is stored as plain text. Rule 942350 is turned off for the comment field of
# create and edit requests (POST and PUT) on those four routes, and nowhere else.
# Cost: an argument named json.comment on those routes skips this one rule. Every other SQL rule
# still checks the comment, and rule 942350 still checks every other field and route.
SecRule REQUEST_FILENAME "@rx \A/api/(?:domains/(?:allow|deny)/(?:exact|regex)|lists|groups|clients)(?:/|\z)" \
    "id:9868107,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=942350;ARGS:json.comment,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT)\z" \
        "t:none"
