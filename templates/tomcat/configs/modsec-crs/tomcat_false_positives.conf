# Tomcat Manager WAR deploys. Lets PUT /manager/text/deploy carry an application/octet-stream body,
# which the CRS rejects with a 403 (rule 920420, content type not allowed). Keep this file as a
# modsec-crs config: it has no effect as a modsec config.
#
# What it lets through: PUT on that single path. Other methods, other Manager commands and every
# other path keep the content type check.
# Cost: that path accepts any content type, so the Manager must stay restricted to trusted
# addresses in Tomcat itself (see the template README). Without that restriction anyone could
# deploy a WAR.
# To turn it off, delete the rule below and save the service: WAR deploys through the Manager text
# interface then get a 403.
SecRule REQUEST_METHOD "@streq PUT" \
    "id:9873100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@streq /manager/text/deploy" \
        "t:none,\
        ctl:ruleRemoveById=920420"
