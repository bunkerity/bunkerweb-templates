# Tomcat Manager tuning. Tested with BunkerWeb 1.6.17, CRS 4.29. Keep this file as a modsec-crs
# config: it has no effect as a modsec config. Delete the rule to turn the exception off.
#
# The Manager text interface deploys a WAR with PUT /manager/text/deploy and an
# application/octet-stream body. CRS rule 920420 rejects that content type and answers 403.
# The exclusion is limited to PUT on that single path; other methods, other Manager commands and
# every other path keep the content type check. Cost: any content type is accepted on that path.
SecRule REQUEST_METHOD "@streq PUT" \
    "id:9873100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@streq /manager/text/deploy" \
        "t:none,\
        ctl:ruleRemoveById=920420"
