# Tomcat Manager tuning. Type is "modsec-crs" (included before the CRS) so the phase:1 ctl
# action below runs ahead of CRS rule 920420, which also fires in phase 1. A plain "modsec"
# config loads after the CRS and the removal would come too late.
#
# The Manager text interface deploys a WAR with PUT /manager/text/deploy and an
# application/octet-stream body. CRS rule 920420 rejects that content type and answers 403.
# The exclusion is limited to PUT on that single path; other methods, other Manager
# commands and every other path keep the content-type allow-list.
SecRule REQUEST_METHOD "@streq PUT" \
    "id:10600,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@streq /manager/text/deploy" \
        "t:none,\
        ctl:ruleRemoveById=920420"
