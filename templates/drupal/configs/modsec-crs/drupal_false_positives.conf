# Drupal JSON:API tuning. Type is "modsec-crs" (included before the CRS) so the phase:1
# directives below run ahead of the CRS rules that read them. A plain "modsec" config
# loads after the CRS and the setvar and ctl actions would come too late.

# JSON:API (core "jsonapi" module) sends and expects application/vnd.api+json. CRS rule
# 920420 rejects it with 403 because it is not on the allow-list. The setvar below
# replaces the CRS default list (rule 901162 only sets it while it is still unset) with
# that list plus application/vnd.api+json. Re-check the list when BunkerWeb ships a
# newer CRS.
SecAction \
    "id:10500,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/vnd.api+json|'"

# CRS only parses application/json bodies as JSON. Arm the JSON body processor for
# application/vnd.api+json too, so the fields of a JSON:API body stay inspected by the
# SQLi/XSS rules instead of being let through unparsed.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^application/vnd\.api\+json(?:\s*;|$)" \
    "id:10501,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:requestBodyProcessor=JSON"

# JSON:API file upload: POST /jsonapi/<entity>/<bundle>[/<uuid>]/<field> with an
# application/octet-stream body and a Content-Disposition header. CRS rule 920420 answers
# 403. The exclusion is limited to POST on that exact path shape (the field segment must
# start with field_), so every other path keeps the content-type allow-list.
SecRule REQUEST_METHOD "@streq POST" \
    "id:10502,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/jsonapi/[^/]+/[^/]+(?:/[0-9a-fA-F-]{36})?/field_[^/]+$" \
        "t:none,\
        ctl:ruleRemoveById=920420"
