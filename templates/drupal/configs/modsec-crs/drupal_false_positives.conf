# Drupal JSON:API tuning for the OWASP Core Rule Set (CRS). Tested with BunkerWeb 1.6.17, CRS 4.29.
# This file loads before the CRS on purpose: keep it as a "modsec-crs" config, the rules do nothing
# as a "modsec" config. Delete a rule below to turn its exception off.
# All three rules only concern Drupal's JSON:API module, so delete the whole file if you do not use it.

# JSON:API content type: Drupal's JSON:API module (core "jsonapi") sends and expects
# application/vnd.api+json. The CRS refuses that type and answers 403, because it is not on its list
# of accepted request content types. This rule adds it to the list, for paths that start with
# /jsonapi only. A request with that content type on any other path (a Drupal form, an admin page)
# still gets 403. If you changed the JSON:API path prefix (the JSON:API Extras module can), change
# /jsonapi in this rule and in the upload rule below. Cost: the list below is a copy of the CRS 4.29
# default plus the new type, so it does not follow CRS upgrades on those paths. After you upgrade
# BunkerWeb, compare it with the CRS default list (CRS rule 901162). The CRS default stays in force
# everywhere else.
SecRule REQUEST_FILENAME "@rx \A/jsonapi(?:/|\z)" \
    "id:9854010,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/vnd.api+json|'"

# JSON:API request bodies: the CRS reads only application/json bodies as JSON. This rule reads
# application/vnd.api+json bodies as JSON too, so the SQL injection and script checks still look at
# every field of a JSON:API request instead of skipping it. Keep it together with the rule above.
SecRule REQUEST_HEADERS:Content-Type "@beginsWith application/vnd.api+json" \
    "id:9854101,\
    phase:1,\
    pass,\
    t:none,\
    t:lowercase,\
    nolog,\
    ctl:requestBodyProcessor=JSON"

# JSON:API file upload: POST /jsonapi/<entity>/<bundle>[/<uuid>]/<field> sends the file as an
# application/octet-stream body, and the CRS answers 403 because that type is not on its list. This
# exception covers POST on that exact path shape only, and the field name must start with field_
# (Drupal's own prefix for custom fields). Every other path keeps the content type check. Cost: an
# upload on that path may use any content type. The file itself is still checked by Drupal.
SecRule REQUEST_METHOD "@streq POST" \
    "id:9854102,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@rx \A/jsonapi/[^/]+/[^/]+(?:/[0-9a-fA-F-]{36})?/field_[^/]+\z" \
        "t:none,\
        t:normalizePath,\
        ctl:ruleRemoveById=920420"
