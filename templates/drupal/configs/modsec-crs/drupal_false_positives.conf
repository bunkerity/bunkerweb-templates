# Drupal JSON:API tuning for the OWASP Core Rule Set (CRS). Tested with BunkerWeb 1.6.17, CRS 4.29.
# This file loads before the CRS on purpose: keep it as a "modsec-crs" config, the rules do nothing
# as a "modsec" config. Delete a rule below to turn its exception off.

# Content type: the JSON:API module (core "jsonapi") sends and expects application/vnd.api+json,
# and CRS rule 920420 answers 403 because that type is not on its allow-list. This rule adds the
# type to the list of accepted request content types. Cost: the type is accepted on every path of
# the service, not only under /jsonapi/. The list below is a copy of the CRS 4.29 default plus the
# new type, so it does not follow CRS upgrades: check it again when BunkerWeb ships a newer CRS.
SecAction \
    "id:9854010,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/vnd.api+json|'"

# Body parsing: the CRS parses only application/json bodies as JSON. This rule reads
# application/vnd.api+json bodies as JSON too, so the fields of a JSON:API body stay inspected by
# the SQL injection and XSS rules instead of passing unchecked. Keep it with the rule above.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)\Aapplication/vnd\.api\+json(?:\s*;|\z)" \
    "id:9854101,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:requestBodyProcessor=JSON"

# File upload: POST /jsonapi/<entity>/<bundle>[/<uuid>]/<field> sends an application/octet-stream
# body with a Content-Disposition header, and CRS rule 920420 answers 403. The exclusion covers
# POST on that exact path shape only (the field segment must start with field_). Every other path
# keeps the content type check. Cost: an upload on that path may use any content type.
SecRule REQUEST_METHOD "@streq POST" \
    "id:9854102,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@rx \A/jsonapi/[^/]+/[^/]+(?:/[0-9a-fA-F-]{36})?/field_[^/]+\z" \
        "t:none,\
        ctl:ruleRemoveById=920420"
