# Registration and sign-in carry the password in json.password. The server never interprets a password (it only hashes it),
# so the ten CRS injection families skip that one argument (username and email stay inspected). One ctl line per family
# tag: ctl:ruleRemoveTargetByTag takes a literal tag, and the tag covers every rule of the family at any paranoia level.
# OWASP_CRS/<family> tags are used because the short tags (attack-php, attack-java, attack-generic) are missing or wrong for 28 of
# the 114 paranoia-level-1 ids. An id range in ctl:ruleRemoveTargetById passes the config test and removes nothing.
# These are CRS 4 tags: on CRS 3.3.x the SQLi tag differs and 942100 would stay active, so the template needs CRS 4.
# Not covered by design: rules that read the whole body (921110, 931110, 944100-944130 match REQUEST_BODY) and 920270
# (a NUL or the text %00).
SecRule REQUEST_FILENAME "@rx \A/(?:register|login)\z" \
    "id:9850102,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/PROTOCOL-ATTACK;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-LFI;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RFI;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RCE;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-PHP;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-GENERIC;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-XSS;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SQLI;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SESSION-FIXATION;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-JAVA;ARGS:json.password,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

