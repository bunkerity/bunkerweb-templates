# Atuin sync server 18.24.8 behind BunkerWeb 1.6.17 (OWASP CRS 4.29.0). Loaded before the CRS (modsec-crs).
# Atuin's sync client sends end-to-end encrypted records, and people choose their own passwords. Both look
# like attacks to the CRS: random text matches word lists, and a password manager's output matches
# SQL, shell and PHP patterns. Measured against the real atuin 18.24.8 client and server:
#   - 8 of 442 uploaded record pages (about 44,000 records) got 403, always rule 930120 on a ciphertext field;
#   - 209 of 40,000 generated passwords (13 password-manager, openssl and passphrase shapes) got 403, from 22 different rule ids
#     of the CRS families 921, 932, 933, 934, 941 and 942; one more (the text %00) got 403 from 920270, which this file keeps.
# Every exclusion needs the method AND the exact path, and removes rules from named fields only. The same
# text in any other field, on any other path or with any other method is still blocked. 949110 and 959100
# are never touched. Nothing here relaxes a rule for a value the server ever interprets: ciphertext is stored
# and returned as opaque text, and a password is only hashed.

# Record upload. The body is a JSON array of up to 100 records, so the argument names carry an array index
# (json.array_0 ... json.array_99) and no regex target works in ctl on 1.6.17: the names are listed one
# by one. Only the two ciphertext fields are excluded: data.data (a v4.local PASETO) and
# data.content_encryption_key (a wrapped key). id, idx, host, parent, timestamp, version and tag stay inspected.
SecRule REQUEST_FILENAME "@streq /api/v0/record" \
    "id:9850101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_0.data.data,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_0.data.content_encryption_key,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_1.data.data,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_1.data.content_encryption_key,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_2.data.data,\
