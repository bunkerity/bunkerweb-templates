# Registration and sign-in (POST /register, POST /login) carry the password in json.password. Lets
# that one field skip ten CRS attack families (protocol, file inclusion, remote file inclusion,
# command execution, PHP, generic, XSS, SQL injection, session fixation and Java), one line per
# family, each covering every rule of that family at any paranoia level. Needed because about 1
# random password in 200 looks like an attack. Cost: attack text inside a password is not flagged,
# which is fine because the server only hashes it; username and email stay checked. Not covered by
# design: the rules that read the whole body (921110, 931110, 944100 to 944130) and 920270 (a NUL
# byte or the text %00 in a password still answers 403). These are CRS 4 tags: on CRS 3 the SQL
# injection tag differs and rule 942100 would stay active, so the template needs CRS 4.
SecRule REQUEST_FILENAME "@rx \A/(?:register|login)\z" \
    "id:9850102,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/PROTOCOL-ATTACK;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-LFI;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RFI;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-RCE;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-PHP;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-GENERIC;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-XSS;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SQLI;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-SESSION-FIXATION;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS/ATTACK-JAVA;ARGS:json.password,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

