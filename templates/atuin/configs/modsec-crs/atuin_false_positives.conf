# Atuin sync server exclusions. Tested with Atuin 18.24.8, BunkerWeb 1.6.17, CRS 4.29. Keep this
# file as a modsec-crs config: it has no effect as a modsec config. Delete a rule to turn its
# exception off.
#
# The sync client uploads end-to-end encrypted records, and users pick their own passwords. Both
# look like attacks to the CRS: random ciphertext matches word lists, and a password from a
# password manager matches SQL, shell and PHP patterns. Without these rules some record uploads
# (rule 930120 on a ciphertext field) and some registrations or logins (about 1 random password
# in 200) get 403.
#
# Every exclusion needs the method AND the exact path, and removes rules from named fields only. The
# same text in any other field, on any other path or with any other method is still blocked.
# Rules 949110 and 959100 (the ones that block a request once its CRS score is too high) are never
# touched. Nothing here relaxes a rule for a value the server interprets: ciphertext is stored and
# returned as opaque text, and a password is only hashed. Cost: the listed rules do not check those
# fields, and nothing else changes.

# Record upload (POST /api/v0/record). The body is a JSON array of up to 100 records, so argument
# names carry an array index (json.array_0 ... json.array_99). The names are listed one by one, so
# raise the index range in the rule if your client sends larger batches. Only the two ciphertext
# fields are excluded: data.data (an encrypted PASETO v4.local token) and
# data.content_encryption_key (a wrapped key). id, idx, host, parent, timestamp, version and tag
# stay inspected.
SecRule REQUEST_FILENAME "@streq /api/v0/record" \
    "id:9850101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_0.data.data,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_0.data.content_encryption_key,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_1.data.data,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_1.data.content_encryption_key,\
