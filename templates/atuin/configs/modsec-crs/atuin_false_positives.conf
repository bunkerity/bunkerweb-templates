# Atuin sync server exclusions. Tested with Atuin 18.24.8, BunkerWeb 1.6.17, CRS 4.29. Keep this
# file as a modsec-crs config: it has no effect as a modsec config. Delete a rule to turn its
# exception off.
#
# What it lets through: the sync client uploads end-to-end encrypted history records, and users pick
# their own passwords. Both look like attacks to the CRS: random ciphertext matches word lists, and a
# password from a password manager matches SQL, shell and PHP patterns. Without these rules some
# record uploads (about 1 page in 55) and some registrations and sign-ins (about 1 random password
# in 200) get 403, and the client retries the same upload page on every sync.
#
# Scope: every exception needs the method and the exact path, and applies to named fields only. The
# same text in any other field, on any other path or with any other method is still blocked, and
# the rules that add up the request score and block it stay active.
#
# Cost: the CRS checks named in each rule skip those fields. That is safe here because the server
# stores ciphertext as opaque text and only hashes a password, so nothing reads either value.
# To add a field, add a line for it to the matching rule; to remove an exception, delete its rule.

# Record upload (POST /api/v0/record), the history sync. The body is a JSON array of up to 100
# records. Lets the two ciphertext fields skip the operating-system file name check (rule 930120);
# without that, about 1 upload page in 55 answers 403 and never uploads. Cost: that check no longer
# reads data.data (an encrypted PASETO v4.local token) and data.content_encryption_key (a wrapped
# key); id, idx, host, parent, timestamp, version and tag are still checked. The argument names
# carry an array index (json.array_0 to json.array_99) and are listed one by one: add the
# missing indexes if your client sends more than 100 records per page.
SecRule REQUEST_FILENAME "@streq /api/v0/record" \
    "id:9850101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_0.data.data,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_0.data.content_encryption_key,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_1.data.data,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_1.data.content_encryption_key,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_2.data.data,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.array_2.data.content_encryption_key,\
