# Filestash exceptions for OWASP CRS 4 on BunkerWeb 1.6.17. Keep this file as a modsec-crs config:
# it has no effect as a modsec config. Delete a rule below to turn its exception off. Every rule
# names one method and one exact path (or a short list of Filestash paths), so the rest of the
# Filestash API keeps all CRS checks.
#
# What the rules allow, and what it costs:
# - 9855101 to 9855103, editor save and uploads: the CRS rejects the content types Filestash sends
#   on these three requests (rule 920420, and 920340 and 920640 for an upload sent with no
#   Content-Type). These requests skip the content type check, and the CRS does not read their
#   bodies because it has no parser for these types. The list of accepted content types for the
#   other paths is not changed.
# - 9855104, 9855105 and 9855107 to 9855111, folder paths: the CRS rule 930120 rejects a path
#   that names a system folder such as /tmp/ or /var/www/. A file manager takes such paths on
#   purpose, when a user signs in with a start folder, opens a folder or a file, edits, uploads,
#   renames, shares, searches, tags or opens a document in the Office editor. Each rule names the
#   routes and the one method that Filestash uses for them, and only the argument that carries the
#   path skips rule 930120: "path" on every route except the rename, "from" and "to" on the
#   rename only, and the JSON field "path" on sign-in and on the creation of a shared link. The
#   same text on another route, with another method or in another argument is still rejected.
#   Every other CRS rule still reads these arguments, including the rules for directory traversal
#   and for shell and SQL text. Cost: Filestash alone decides which folders a signed-in user may
#   open.
# - 9855106, admin presets: the CRS SQL injection rule 942550 rejects the authentication settings
#   that the "Local files" and "S3 - Use your AWS credentials" presets save from the admin console
#   (/admin/setup). Only that one setting skips the rule, on that one request.

# Web file editor save: POST /api/files/cat?path=... sends the file content as a string body, with
# the content type "text/plain;charset=UTF-8".
SecRule REQUEST_FILENAME "@streq /api/files/cat" \
    "id:9855101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveById=920420"

# Single request upload: POST /api/files/save?path=... sends the file as the body, with the file's
# own content type (for example "application/pdf" or "image/png"). Shared links use it too.
# A file with an unknown MIME type (for example a small ".bin") is sent with no Content-Type at all,
# which CRS rules 920340 and 920640 reject, so they are removed here too. Cost: an upload on this
# path may have no Content-Type at all. The other paths still require one.
SecRule REQUEST_FILENAME "@streq /api/files/save" \
    "id:9855102,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveById=920420,\
        ctl:ruleRemoveById=920340,\
        ctl:ruleRemoveById=920640"

# Chunked upload (tus): PATCH /api/files/save?path=... sends each chunk as
# "application/offset+octet-stream". Shared links use it too.
SecRule REQUEST_FILENAME "@streq /api/files/save" \
    "id:9855103,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq PATCH" \
        "t:none,\
        ctl:ruleRemoveById=920420"

# Sign-in: POST /api/session (the sign-in form) sends the start folder in the JSON field "path".
# Only that field skips rule 930120, so a start folder such as /var/www/ or /tmp/ works.
SecRule REQUEST_FILENAME "@streq /api/session" \
    "id:9855104,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=930120;ARGS:json.path"

# Folder and file actions that read the path in the query argument "path": GET lists a folder
# (files/ls), opens or downloads a file (files/cat), searches (files/search), downloads several
# files as a zip (files/zip), lists the shared links of a file (share), reads a file's tags
# (metadata), opens a document in the Office editor (wopi/iframe) and reads the live text of the
# editor (codemirror/pull). Only the argument "path" skips rule 930120, on these routes and this
# method.
SecRule REQUEST_FILENAME "@rx \A/api/(?:files/(?:ls|cat|search|zip)|share|metadata|wopi/iframe|codemirror/pull)\z" \
    "id:9855105,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        ctl:ruleRemoveTargetById=930120;ARGS:path"

# Opening a file: the browser also sends HEAD and OPTIONS requests to /api/files/cat?path=...
# before it reads the file. Only the argument "path" skips rule 930120.
SecRule REQUEST_FILENAME "@streq /api/files/cat" \
    "id:9855107,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:HEAD|OPTIONS)\z" \
        "t:none,\
        ctl:ruleRemoveTargetById=930120;ARGS:path"

# Folder and file actions that change something and take the path in the query argument "path":
# save a file in the editor (files/cat), create a file (files/touch), create a folder
# (files/mkdir), delete (files/rm), upload (files/save) and the live editing of a text file
# (codemirror/push and codemirror/reset). Only the argument "path" skips rule 930120.
SecRule REQUEST_FILENAME "@rx \A/api/(?:files/(?:cat|touch|mkdir|rm|save)|codemirror/(?:push|reset))\z" \
    "id:9855108,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=930120;ARGS:path"

# Chunked upload: PATCH /api/files/save?path=... Only the argument "path" skips rule 930120.
SecRule REQUEST_FILENAME "@streq /api/files/save" \
    "id:9855109,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq PATCH" \
        "t:none,\
        ctl:ruleRemoveTargetById=930120;ARGS:path"

# Rename and move: POST /api/files/mv?from=...&to=... Only the arguments "from" and "to" skip
# rule 930120, and only on this route and method.
SecRule REQUEST_FILENAME "@streq /api/files/mv" \
    "id:9855110,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=930120;ARGS:from,\
        ctl:ruleRemoveTargetById=930120;ARGS:to"

# Create a shared link: PUT /api/share/<id> sends the shared folder or file in the JSON field
# "path". Only that field skips rule 930120.
SecRule REQUEST_FILENAME "@rx \A/api/share/[A-Za-z0-9_-]+\z" \
    "id:9855111,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq PUT" \
        "t:none,\
        ctl:ruleRemoveTargetById=930120;ARGS:json.path"

# Admin console presets: POST /admin/api/config saves the authentication settings of the preset
# in the field "middleware.attribute_mapping.params", a small JSON text that the CRS reads as SQL.
# Only that field skips rule 942550, on that one request.
SecRule REQUEST_FILENAME "@streq /admin/api/config" \
    "id:9855106,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=942550;ARGS:json.middleware.attribute_mapping.params"
