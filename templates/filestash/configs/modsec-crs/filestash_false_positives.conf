# Filestash upload and editor exclusions. Type is "modsec-crs" (included before the CRS) so the
# phase:1 ctl actions below run ahead of CRS rule 920420. A plain "modsec" config loads after the
# CRS and the removals would come too late. Every rule is limited to one method and one anchored
# path; the rest of the API keeps the full CRS.
#
# 920420 (request content type is not allowed) is removed on all three requests. The Content-Type
# the browser sends on these requests is not in the CRS allowed list, so they were answered 403.
# The single request upload also loses 920340 and 920640 (see rule 75002). No body processor is
# armed for these types, so the CRS does not inspect these bodies either. The global allowed
# content type list is left untouched on purpose.

# Web file editor save: POST /api/files/cat?path=... with the file content as a string body,
# sent by the browser as "text/plain;charset=UTF-8".
SecRule REQUEST_FILENAME "@rx ^/api/files/cat$" \
    "id:75001,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    t:normalizePath,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveById=920420"

# Single request upload: POST /api/files/save?path=... with the file as body, sent with the
# file's own content type (for example "application/pdf" or "image/png"). Also used on shared links.
# A file with an unknown MIME type (for example a small ".bin") is sent with no Content-Type at
# all, which CRS rules 920340 and 920640 reject, so they are removed here too. Only this method and
# path: the other requests always send a Content-Type.
SecRule REQUEST_FILENAME "@rx ^/api/files/save$" \
    "id:75002,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    t:normalizePath,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveById=920420,\
        ctl:ruleRemoveById=920340,\
        ctl:ruleRemoveById=920640"

# Chunked upload (tus): PATCH /api/files/save?path=... with each chunk sent as
# "application/offset+octet-stream". Also used on shared links.
SecRule REQUEST_FILENAME "@rx ^/api/files/save$" \
    "id:75003,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    t:normalizePath,\
    chain"
    SecRule REQUEST_METHOD "@streq PATCH" \
        "t:none,\
        ctl:ruleRemoveById=920420"
