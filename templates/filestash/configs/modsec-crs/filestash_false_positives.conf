# Filestash exceptions for OWASP CRS 4 on BunkerWeb 1.6.17. Keep this file as a modsec-crs config:
# it has no effect as a modsec config. Delete a rule below to turn its exception off. Every rule
# names one method and one exact path (or a short list of Filestash paths), so the rest of the
# Filestash API keeps all CRS checks.
#
# What the rules allow, and what it costs:
# - 9855101 to 9855103, editor save and uploads: the CRS rejects the content types Filestash sends
#   on these three requests (rule 920420, and 920340 and 920640 for an upload sent with no
#   Content-Type). These requests skip the content type check, and the CRS does not read their
#   bodies because it has no parser for these types. The list of accepted content types for the
#   other paths is not changed.
# - 9855104 and 9855105, folder paths: the CRS rule 930120 rejects a path that names a system
#   folder such as /tmp/ or /var/www/. A file manager takes such paths on purpose, when a user
#   signs in with a start folder, opens a folder or a file, uploads, renames, shares, searches or
#   opens a document in the Office editor. On these requests only the path arguments (path, from
#   and to, and the sign-in field path) skip rule 930120. Every other CRS rule still reads them,
#   including the rules for directory traversal and for shell and SQL text. Cost: Filestash alone
#   decides which folders a signed-in user may open.
# - 9855106, admin presets: the CRS SQL injection rule 942550 rejects the authentication settings
#   that the "Local files" and "S3 - Use your AWS credentials" presets save from the admin console
#   (/admin/setup). Only that one setting skips the rule, on that one request.

# Web file editor save: POST /api/files/cat?path=... sends the file content as a string body, with
# the content type "text/plain;charset=UTF-8".
SecRule REQUEST_FILENAME "@streq /api/files/cat" \
    "id:9855101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveById=920420"

# Single request upload: POST /api/files/save?path=... sends the file as the body, with the file's
# own content type (for example "application/pdf" or "image/png"). Shared links use it too.
# A file with an unknown MIME type (for example a small ".bin") is sent with no Content-Type at all,
# which CRS rules 920340 and 920640 reject, so they are removed here too. Cost: an upload on this
# path may have no Content-Type at all. The other paths still require one.
SecRule REQUEST_FILENAME "@streq /api/files/save" \
    "id:9855102,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveById=920420,\
        ctl:ruleRemoveById=920340,\
        ctl:ruleRemoveById=920640"

# Chunked upload (tus): PATCH /api/files/save?path=... sends each chunk as
# "application/offset+octet-stream". Shared links use it too.
SecRule REQUEST_FILENAME "@streq /api/files/save" \
    "id:9855103,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq PATCH" \
        "t:none,\
        ctl:ruleRemoveById=920420"

# Sign-in and sharing: POST /api/session (sign-in form) and POST /api/share/<id> (create a shared
# link) send the folder in the JSON field "path". Only that field skips rule 930120, so a start
# folder such as /var/www/ or /tmp/ works.
SecRule REQUEST_FILENAME "@rx \A/api/(?:session|share/[A-Za-z0-9_-]+)\z" \
    "id:9855104,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=930120;ARGS:json.path"

# Browsing and file actions: list, open, create, delete, rename (from and to), save, zip,
# search, shared links and the Office editor take the folder or file in the query argument "path"
# (and "from" and "to" for a rename). Only these three arguments skip rule 930120, on the Filestash
# file, search, share and Office routes.
SecRule REQUEST_FILENAME "@rx \A/api/(?:files/[a-z]+|metadata/[a-z]+|wopi/iframe|share)\z" \
    "id:9855105,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS:path,\
    ctl:ruleRemoveTargetById=930120;ARGS:from,\
    ctl:ruleRemoveTargetById=930120;ARGS:to"

# Admin console presets: POST /admin/api/config saves the authentication settings of the preset
# in the field "middleware.attribute_mapping.params", a small JSON text that the CRS reads as SQL.
# Only that field skips rule 942550, on that one request.
SecRule REQUEST_FILENAME "@streq /admin/api/config" \
    "id:9855106,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=942550;ARGS:json.middleware.attribute_mapping.params"
