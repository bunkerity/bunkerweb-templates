# Kaneo 2.49.0 behind BunkerWeb 1.6.17 (OWASP CRS 4.29.0). Every rule id below matched legitimate Kaneo content
# (SQL, shell, HTML and code written into task descriptions, comments, titles, names and searches) in a request
# matrix against the real app. Loaded before the CRS (modsec-crs).
# Each exclusion needs the method AND the exact path (anchored with \A and \z, because @rx is multiline in this
# release). Where a literal argument name exists it removes the rules from that one JSON member or query argument
# only; the same payload in any other argument, path or method is still blocked. 949110 and 959100 are never touched.
# A few rules (921110, 944100, 944110, 944130) read the raw JSON body (REQUEST_BODY) next to the arguments, so on a
# literal-argument exclusion they are also removed for REQUEST_BODY on that path.
# JSON array members are named json.<list>.array_<n>: the ids come from the matrix evidence (red run, then every green
# run until no seed was blocked).
# Ids 9860101 to 9860127 sit in BunkerWeb's block 9860000-9860999 for this template.
# Four entries (9860107 task import, 9860122 to 9860124 the Git forge webhooks) use ctl:ruleRemoveById instead of
# ruleRemoveTargetById: the import list and the signed webhook body have unbounded member names and cannot be
# listed. They remove those rule ids for the whole request body on that one path and method.

