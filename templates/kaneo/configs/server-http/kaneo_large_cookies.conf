# Kaneo 2.49.0 behind BunkerWeb 1.6.17: single sign-on cookies can be large.
# After an OpenID Connect sign-in the browser sends every cookie back in one Cookie header, and nginx answers 400
# when one header line is longer than a buffer (8k by default; a 9 KB Cookie header was measured). Kaneo's own nginx
# allows 32k for the same reason (upstream issue 1745), so the proxy in front must not be stricter.
# Allows header lines up to 32k. Delete this file if you only use passwords.
large_client_header_buffers 4 32k;
