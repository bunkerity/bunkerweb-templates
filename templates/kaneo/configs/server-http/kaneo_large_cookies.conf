# Kaneo single sign-on cookies can be large. Tested with Kaneo 2.49.0, BunkerWeb 1.6.17.
# After an OpenID Connect sign-in, the browser sends every cookie back in one Cookie header, and
# nginx answers 400 when one header line is longer than its buffer (8k by default, so a 9 KB Cookie
# header fails). Kaneo's own nginx image allows 32k, so the proxy in front must not be stricter.
# This file allows header lines up to 32k. Cost: a client that sends a very large header makes nginx
# use up to four 32k buffers (128k) for that connection instead of four 8k buffers (32k), so many
# such connections use more memory. Delete this file if you only use passwords, or lower the 32k to
# your largest cookie header.
large_client_header_buffers 4 32k;
