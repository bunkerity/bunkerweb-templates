# Tested with Homepage 2.8.0, BunkerWeb 1.6.17 and CRS 4.29. These rules load before the CRS.
# Each rule lets one kind of Homepage request past the CRS checks that mistake it for an attack.
# It applies to one exact path and the method GET, and switches off only the checks it names, for
# the arguments or the answer it lists. The same text in another argument, path or method is still
# blocked, and the checks that add up the final score of a request stay on.
# To remove an exception, delete its block (the comment lines and the rule below them) and save
# this config in the Configs page. To allow another field, copy a block and change its id, path and
# argument name.

# Search box and quick launch: with search suggestions on (showSearchSuggestions: true on the search
# widget or on quick launch) Homepage sends every typed character to this route. It only URL-encodes
# the text and hands it to your search provider as one value, it never runs it. People search for
# shell commands, paths, SQL and error messages, which the CRS reads as attacks. This switches off
# the command, PHP, Java, SQL injection and path traversal checks listed below for the query
# argument of this route.
# Cost: the search text is not checked by those rules. Other checks still apply to it, so an
# attack payload such as a PHP stream wrapper or a serialized object still answers 403. The path
# traversal checks 930100 and 930110 also skip the whole query string of this route.
SecRule REQUEST_FILENAME "@streq /api/search/searchSuggestion" \
    "id:9881100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930100;ARGS:query,\
    ctl:ruleRemoveTargetById=930100;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetById=930110;ARGS:query,\
    ctl:ruleRemoveTargetById=930110;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetById=930120;ARGS:query,\
    ctl:ruleRemoveTargetById=932120;ARGS:query,\
    ctl:ruleRemoveTargetById=932125;ARGS:query,\
    ctl:ruleRemoveTargetById=932130;ARGS:query,\
    ctl:ruleRemoveTargetById=932160;ARGS:query,\
    ctl:ruleRemoveTargetById=932230;ARGS:query,\
    ctl:ruleRemoveTargetById=932235;ARGS:query,\
    ctl:ruleRemoveTargetById=932250;ARGS:query,\
    ctl:ruleRemoveTargetById=932260;ARGS:query,\
    ctl:ruleRemoveTargetById=932340;ARGS:query,\
    ctl:ruleRemoveTargetById=932370;ARGS:query,\
    ctl:ruleRemoveTargetById=932380;ARGS:query,\
    ctl:ruleRemoveTargetById=933120;ARGS:query,\
    ctl:ruleRemoveTargetById=933150;ARGS:query,\
    ctl:ruleRemoveTargetById=933160;ARGS:query,\
    ctl:ruleRemoveTargetById=941100;ARGS:query,\
    ctl:ruleRemoveTargetById=941110;ARGS:query,\
    ctl:ruleRemoveTargetById=941160;ARGS:query,\
    ctl:ruleRemoveTargetById=941390;ARGS:query,\
    ctl:ruleRemoveTargetById=942100;ARGS:query,\
    ctl:ruleRemoveTargetById=942190;ARGS:query,\
    ctl:ruleRemoveTargetById=942320;ARGS:query,\
    ctl:ruleRemoveTargetById=942550;ARGS:query,\
    ctl:ruleRemoveTargetById=944130;ARGS:query,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"

# Search suggestions answer with the typed text as their first entry. A search for an error message
# (PHP, SQL, Java, ASP.NET, IIS or Ruby) then makes the answer look like a leaked error page, and
# the CRS cuts the connection. This switches off those error page checks for the answer of this
# route only. The check for leaked PHP source code (953110) stays on.
# Cost: the suggestion answer is not scanned for leaked error text. It holds only the typed text
# and the suggestions of your search provider.
SecRule REQUEST_FILENAME "@streq /api/search/searchSuggestion" \
    "id:9881110,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=950150;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951110;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951120;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951130;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951140;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951150;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951160;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951170;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951180;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951190;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951200;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951210;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951220;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951230;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951240;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951250;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=951260;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=952110;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=953100;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=954120;RESPONSE_BODY,\
    ctl:ruleRemoveTargetById=954130;RESPONSE_STATUS,\
    ctl:ruleRemoveTargetById=956100;RESPONSE_BODY,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"

# Status dots: the group and service names come from your services file and only select an entry
# in it. A name that holds a command word, such as a service called docker-registry, looks like a
# command injection to the CRS. This removes those rules for the two name arguments of this route.
# Cost: the names are not inspected here, but an unknown name is refused by the app.
SecRule REQUEST_FILENAME "@streq /api/ping" \
    "id:9881120,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=932250;ARGS:groupName,\
    ctl:ruleRemoveTargetById=932250;ARGS:serviceName,\
    ctl:ruleRemoveTargetById=932260;ARGS:serviceName,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"

# Site monitor dots: same names as the status dots above, same rules removed, for this route.
SecRule REQUEST_FILENAME "@streq /api/siteMonitor" \
    "id:9881130,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=932250;ARGS:groupName,\
    ctl:ruleRemoveTargetById=932250;ARGS:serviceName,\
    ctl:ruleRemoveTargetById=932260;ARGS:serviceName,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"

# Service widgets: the group and service arguments are the names from your services file, same
# reason as above. This removes the command rules for those two arguments on this route.
SecRule REQUEST_FILENAME "@streq /api/services/proxy" \
    "id:9881140,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=932250;ARGS:group,\
    ctl:ruleRemoveTargetById=932250;ARGS:service,\
    ctl:ruleRemoveTargetById=932260;ARGS:service,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"
