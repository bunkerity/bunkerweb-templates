# Garage S3 API exclusions. Keep this file as a modsec-crs config: it has no effect as a modsec
# config. Delete a rule to turn its exception off, and the S3 call it covers then gets 403.
#
# S3 clients send arbitrary object content types and keys, so no path can be named. Every exclusion
# below applies only to a signed S3 request (an "Authorization: AWS4-HMAC-SHA256" header, or the
# X-Amz-Algorithm query argument of a presigned URL), to the S3 methods that need it, and to a
# non-root path. Garage verifies the signature itself and refuses an unsigned request, so a forged
# marker only skips the listed checks on a request that Garage then rejects. Requests without the
# marker keep every rule. Request bodies stay inspected: only the policy checks named here are
# skipped, never the injection rules, and rules 949110 and 959100 (the ones that block a request
# once its CRS score is too high) are never touched.

# Object uploads (PutObject, UploadPart, presigned PUT) carry the object's own Content-Type
# (text/plain, image/png, application/octet-stream, video/mp4 ...). CRS rule 920420 only lets form,
# JSON, XML and multipart types through. Only the content-type check is skipped. A JSON, XML,
# urlencoded or multipart object body is still parsed and inspected by the injection rules.
# Cost: any content type is accepted on these uploads. An object labelled JSON, XML or urlencoded
# that contains SQL or script text still gets 403.
SecRule REQUEST_FILENAME "@rx \A/[^/]" \
    "id:9857100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920420;REQUEST_HEADERS:Content-Type,\
    chain"
    SecRule REQUEST_METHOD "@streq PUT" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Authorization|ARGS_GET:X-Amz-Algorithm "@beginsWith AWS4-HMAC-SHA256" \
            "t:none"

# CreateMultipartUpload (POST /<key>?uploads) carries the object's Content-Type too (rclone and the
# AWS CLI both send it). Only that request is covered: the POST must carry the "uploads" query
# keyword. Cost: same as the upload rule above, any content type is accepted on that request.
SecRule REQUEST_FILENAME "@rx \A/[^/]" \
    "id:9857104,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920420;REQUEST_HEADERS:Content-Type,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        chain"
        SecRule &ARGS_GET:uploads "@gt 0" \
            "t:none,\
            chain"
            SecRule REQUEST_HEADERS:Authorization|ARGS_GET:X-Amz-Algorithm "@beginsWith AWS4-HMAC-SHA256" \
                "t:none"

# A body with no Content-Type header: DeleteObjects and CompleteMultipartUpload from the AWS CLI,
# and empty or unlabelled uploads from SDKs. CRS rules 920340 and 920640 flag a request that has
# content and no Content-Type. Only that header check is skipped. Cost: a signed S3 request may
# carry a body with no Content-Type.
SecRule REQUEST_FILENAME "@rx \A/[^/]" \
    "id:9857101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920340;REQUEST_HEADERS:Content-Length,\
    ctl:ruleRemoveTargetById=920640;REQUEST_BODY_LENGTH,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:PUT|POST)\z" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Authorization|ARGS_GET:X-Amz-Algorithm "@beginsWith AWS4-HMAC-SHA256" \
            "t:none"

# AWS SDKs add "Expect: 100-continue" to object uploads, and "Content-Encoding: aws-chunked" (or
# the object's own Content-Encoding, such as gzip) to checksummed or compressed ones. CRS rule
# 920450 restricts both header names. Only those two header names are skipped, and only for PUT.
# Cost: those two headers are not refused on signed S3 uploads. Every other restricted header is.
SecRule REQUEST_FILENAME "@rx \A/[^/]" \
    "id:9857102,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:Expect,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:expect,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:Content-Encoding,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:content-encoding,\
    chain"
    SecRule REQUEST_METHOD "@streq PUT" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Authorization|ARGS_GET:X-Amz-Algorithm "@beginsWith AWS4-HMAC-SHA256" \
            "t:none"

# The object key is the URL path. Keys such as backup.sql, id_rsa.pem, app.log, .DS_Store,
# package.json, Dockerfile or .env are ordinary object names, but they match CRS rule 920440
# (restricted file extension, checked on the basename) and 930130 (restricted file name, checked on
# the path). A key such as "file (1).txt" or "My File (final).pdf" matches 933160 (PHP function
# call, checked on the path). Only those three path checks are skipped. Path traversal (930100,
# 930110) and every other rule still read the path.
# Cost: a restricted file name or extension, or a PHP-like call, in an object key no longer
# raises the score.
SecRule REQUEST_FILENAME "@rx \A/[^/]" \
    "id:9857103,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920440;REQUEST_BASENAME,\
    ctl:ruleRemoveTargetById=930130;REQUEST_FILENAME,\
    ctl:ruleRemoveTargetById=933160;REQUEST_FILENAME,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|HEAD|PUT|POST|DELETE)\z" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Authorization|ARGS_GET:X-Amz-Algorithm "@beginsWith AWS4-HMAC-SHA256" \
            "t:none"
