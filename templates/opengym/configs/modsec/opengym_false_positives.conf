# openGym false-positive exclusions. Validated against openGym v1.2.11 and OWASP CRS 4.
#
# Type is "modsec" (included after the CRS) because every rule excluded below is
# phase 2, and these phase 1 rules therefore still run first at request time.
#
# Scope. Each exclusion is a chain: an anchored, normalised path test plus a method
# test, so it cannot be replayed as a bypass on another endpoint or verb.
# REQUEST_FILENAME excludes the query string, and t:normalizePath is required
# because REQUEST_FILENAME is URL-decoded but not normalised: without it,
# /api/login/verify/..%2f..%2fadmin would satisfy a path test while nginx routes
# the request somewhere else.
#
# Narrowness. Targets are removed individually with ctl:ruleRemoveTargetById, never
# whole rules, so each rule keeps working on every other parameter of the request.
# openGym sends Content-Type: application/json on every call, so BunkerWeb rule
# 200001 arms the JSON body processor and the body is addressable as ARGS:json.*.
#
# Inbound anomaly scoring (949110) is untouched.

# --------------------------------------------------------------------------------
# POST /api/login/verify - WebAuthn assertion
#
# The body is {cid, credential} where cid and every credential field below is a
# base64url string produced by bufToB64u(). The base64url alphabet includes "-"
# and "_", so "--" runs occur in ordinary credentials and read as a SQL comment
# sequence. openGym never interprets these values as SQL, HTML or a shell command:
# it looks up the challenge by cid and hands the credential to
# @simplewebauthn/server, which verifies a signature over raw bytes.
#
# 942100 libinjection SQLi (PL1), 941100 libinjection XSS (PL1),
# 942430 restricted SQL character anomaly (PL2), 942440 SQL comment sequence (PL2).
SecRule REQUEST_FILENAME "@rx ^/api/login/verify$" \
    "id:10200,phase:1,pass,nolog,t:none,t:normalizePath,chain,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.response.authenticatorData,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.response.signature,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.response.userHandle,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.response.authenticatorData,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.response.signature,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.response.userHandle,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.response.authenticatorData,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.response.signature,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.response.userHandle,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.response.authenticatorData,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.response.signature,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.response.userHandle"
    SecRule REQUEST_METHOD "@streq POST" "t:none,nolog"

# --------------------------------------------------------------------------------
# POST /api/register/verify - WebAuthn attestation
#
# Same body shape and same reasoning as /api/login/verify, but a creation response
# carries attestationObject instead of authenticatorData/signature/userHandle. It is
# the longest base64url value openGym ever posts, so it is the likeliest to contain
# a "--" run.
SecRule REQUEST_FILENAME "@rx ^/api/register/verify$" \
    "id:10201,phase:1,pass,nolog,t:none,t:normalizePath,chain,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.response.attestationObject,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.response.attestationObject,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.response.attestationObject,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.response.attestationObject"
    SecRule REQUEST_METHOD "@streq POST" "t:none,nolog"

# --------------------------------------------------------------------------------
# POST /api/push/subscribe - Web Push subscription
#
# The body is {subscription: {endpoint, expirationTime, keys: {p256dh, auth}}} taken
# straight from PushSubscription.toJSON(). endpoint is the browser vendor's push
# service URL, which 931100 reads as a possible remote file inclusion. p256dh and
# auth are base64url keys and carry the same "--" risk as the credential fields
# above. openGym stores all three verbatim and only ever replays them to the vendor.
#
# 931100 possible RFI, URL in argument (PL1).
SecRule REQUEST_FILENAME "@rx ^/api/push/subscribe$" \
    "id:10202,phase:1,pass,nolog,t:none,t:normalizePath,chain,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.subscription.endpoint,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscription.keys.p256dh,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscription.keys.auth,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.subscription.keys.p256dh,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.subscription.keys.auth,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.subscription.keys.p256dh,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.subscription.keys.auth,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.subscription.keys.p256dh,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.subscription.keys.auth"
    SecRule REQUEST_METHOD "@streq POST" "t:none,nolog"

# --------------------------------------------------------------------------------
# Deliberately not excluded.
#
# 920273 (invalid character in request) also matches base64url bodies, but it is
# paranoia level 4 and inert at BunkerWeb's default level 1. It targets REQUEST_BODY
# as well as ARGS, so silencing it would mean removing a whole-body target rather
# than a named parameter. If you run PL4, add that exclusion yourself, scoped the
# same way as the chains above.
#
# PUT /api/data keeps full CRS coverage. It is session-gated, but it carries
# user-authored routine names, exercise names and workout notes in any language, so
# it is the one endpoint where a CRS hit may be a genuine finding. If your own
# content trips a rule, add a target-scoped exclusion here rather than widening the
# chains above.
