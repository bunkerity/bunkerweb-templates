# openGym exclusions. Tested with openGym v1.4.1, BunkerWeb 1.6.17, CRS 4.29.
#
# Keep this file as a modsec-crs config: it has no effect as a modsec config. Delete a block below
# to turn its exception off. Each exclusion applies to one exact path and one method, so it cannot
# be reused against another endpoint. Each block says which CRS checks it turns off and why. Every
# other check, field and endpoint keeps its coverage, and rule 949110 (the rule that blocks a
# request once its CRS score is too high) is untouched.
#
# openGym sends Content-Type: application/json on every call, so the JSON fields of the body are
# inspected one by one (the field names below start with json.).

# --------------------------------------------------------------------------------
# POST /api/login/verify - WebAuthn assertion
#
# Signing in with a passkey. The body is {cid, credential} where cid and every credential field
# below is a base64url string. The base64url alphabet includes "-" and "_", so "--" runs occur in
# ordinary credentials and read as a SQL comment. openGym never interprets these values as SQL,
# HTML or a shell command: it looks up the challenge by cid and checks the credential signature.
# Cost: four rules are off for those fields only, 942100 (SQL injection), 941100 (XSS), 942430
# (restricted SQL characters) and 942440 (SQL comment sequence).
SecRule REQUEST_FILENAME "@streq /api/login/verify" \
    "id:9866100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.response.authenticatorData,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.response.signature,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.response.userHandle,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.response.authenticatorData,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.response.signature,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.response.userHandle,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.response.authenticatorData,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.response.signature,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.response.userHandle,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.response.authenticatorData,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.response.signature,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.response.userHandle,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# --------------------------------------------------------------------------------
# POST /api/register/verify - WebAuthn attestation
#
# Registering a passkey. Same body shape, same reasoning and same cost as /api/login/verify, but a
# creation response carries attestationObject instead of authenticatorData, signature and
# userHandle. It is the longest base64url value openGym ever posts, so it is the likeliest to
# contain a "--" run.
SecRule REQUEST_FILENAME "@streq /api/register/verify" \
    "id:9866101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.credential.response.attestationObject,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.credential.response.attestationObject,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.credential.response.attestationObject,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.cid,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.id,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.rawId,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.response.clientDataJSON,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.credential.response.attestationObject,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# --------------------------------------------------------------------------------
# POST /api/push/subscribe - Web Push subscription
#
# Turning on notifications. The body is {subscription: {endpoint, expirationTime, keys: {p256dh,
# auth}}}, as the browser produces it. endpoint is the browser vendor's push service URL, which
# 931100 reads as a possible remote file inclusion. p256dh and auth are base64url keys and carry
# the same "--" risk as the credential fields above. openGym stores all three verbatim and only
# ever replays them to the vendor. Cost: rule 931100 is off for endpoint, and the four rules above
# are off for the two keys.
SecRule REQUEST_FILENAME "@streq /api/push/subscribe" \
    "id:9866102,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:json.subscription.endpoint,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscription.keys.p256dh,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.subscription.keys.auth,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.subscription.keys.p256dh,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.subscription.keys.auth,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.subscription.keys.p256dh,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.subscription.keys.auth,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.subscription.keys.p256dh,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.subscription.keys.auth,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# --------------------------------------------------------------------------------
# PUT /api/data - user-authored workout state
#
# A sync resends all state, including free-text notes in any language. Ordinary words such as
# "history", "wall" or "load not reported" after a semicolon trigger the SQL injection and
# command execution rules, so one old note can block every later sync and feed a device ban.
# openGym writes this state as a per-user JSON file, never as SQL or a shell command.
#
# The position of each note in the body varies, so the note fields cannot be named one by one. The
# rule therefore turns off the SQL injection and command execution checks for the whole request
# (body, query arguments and headers alike), on this path and method only. Cost: those two
# families of attacks are not detected on PUT /api/data. The XSS, file inclusion, PHP and protocol
# checks stay on, because the app shows the notes back to the user. A few header and cookie checks
# of the same families (942101, 942152, 942321, 942420, 942421, 932131 and others) also stay on.
SecRule REQUEST_FILENAME "@streq /api/data" \
    "id:9866103,\
    phase:2,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveByTag=attack-sqli,\
    ctl:ruleRemoveByTag=attack-rce,\
    chain"
    SecRule REQUEST_METHOD "@streq PUT" \
        "t:none,\
        nolog"

# --------------------------------------------------------------------------------
# Deliberately not excluded.
#
# 920273 (invalid character in request) also matches base64url bodies, but it is
# paranoia level 4 and inert at BunkerWeb's default level 1. It targets REQUEST_BODY
# as well as ARGS, so silencing it would mean removing a whole-body target rather
# than a named parameter. If you run paranoia level 4, add that exclusion yourself, scoped the
# same way as the rules above.
#
# PUT /api/data keeps its XSS, file inclusion, PHP and protocol checks. Every other path and
# method keeps the SQL injection and command execution checks too.
