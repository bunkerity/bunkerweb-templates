# ntfy exclusions. Tested with ntfy v2.37.2, BunkerWeb 1.6.17, CRS 4.29. Keep this file as a
# modsec-crs config: it has no effect as a modsec config. Delete a numbered block to turn its
# exception off. Every rule is scoped by method and path, and where it matters by Content-Type.
# Rule 949110 (the rule that blocks a request once its CRS score is too high) is never touched.
# The cost of each block is listed with it.

# 1. Raw-body publish and attachment upload (id 9864100).
# The message or attachment is the raw request body, with whatever Content-Type the client sends
# (text/plain from the web app, application/octet-stream or image/* for attachments) or none at all
# (ntfy CLI, UnifiedPush). Rules 920420, 920340 and 920640 only judge that header and the empty
# Content-Type; ntfy parses nothing from these bodies, so no inspection is lost. Cost: any content
# type, or none, is accepted on these publishes and uploads, and the Expect header is accepted.
# Rule 920450 blocks the Expect header. curl sends "Expect: 100-continue" for any body over 1 MiB,
# so the documented upload command, curl -T file https://host/topic, gets a 403 without it.
# Scope: PUT or POST on /<topic> and /<topic>/<sequence-id>. The lookahead keeps /v1/... out.
SecRule REQUEST_FILENAME "@rx \A/(?:[-_A-Za-z0-9]{1,64}|(?!v1/)[-_A-Za-z0-9]{1,64}/[-_A-Za-z0-9]{1,64})\z" \
    "id:9864100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920420;REQUEST_HEADERS:Content-Type,\
    ctl:ruleRemoveTargetById=920340;REQUEST_HEADERS:Content-Length,\
    ctl:ruleRemoveTargetById=920640;REQUEST_BODY_LENGTH,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:Expect,\
    ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS_NAMES:expect,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:PUT|POST)\z" \
        "t:none,\
        nolog"

# Rules 930120, 932125, 932230, 932235, 932250, 932260 and 932370 fire on ordinary alert text:
# file paths, ssh, docker, systemctl, cat, tracebacks, "&&" and ";" in a sentence. Sections 2 to 5
# remove only those seven rules, only from the field that carries the message text. SQL
# injection, XSS and every other rule keep inspecting it. Cost: those seven rules do not check
# message text, so shell or path text in a notification is accepted.

# 2. curl -d "message" (id 9864110).
# curl -d sends application/x-www-form-urlencoded, so the CRS parses the message text as form
# arguments: the whole text becomes an argument NAME when it has no "=". Names are arbitrary, so
# the targets cannot be named: ARGS and ARGS_NAMES stay uninspected by the seven rules on this
# path. Rule 921150 (a newline in an argument name) fires on every multi-line message.
# Scope: PUT or POST on /<topic> with a urlencoded body.
SecRule REQUEST_FILENAME "@rx \A/[-_A-Za-z0-9]{1,64}\z" \
    "id:9864110,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=921150;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=930120;ARGS,\
    ctl:ruleRemoveTargetById=930120;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=932125;ARGS,\
    ctl:ruleRemoveTargetById=932125;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=932230;ARGS,\
    ctl:ruleRemoveTargetById=932230;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=932235;ARGS,\
    ctl:ruleRemoveTargetById=932235;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=932250;ARGS,\
    ctl:ruleRemoveTargetById=932250;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=932260;ARGS,\
    ctl:ruleRemoveTargetById=932260;ARGS_NAMES,\
    ctl:ruleRemoveTargetById=932370;ARGS,\
    ctl:ruleRemoveTargetById=932370;ARGS_NAMES,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:PUT|POST)\z" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "@beginsWith application/x-www-form-urlencoded" \
            "t:none,\
            t:lowercase,\
            nolog"

# 3. JSON publish (id 9864120).
# POST / with {"topic": ..., "message": ...}. Only the "message" field is excluded.
SecRule REQUEST_FILENAME "@streq /" \
    "id:9864120,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.message,\
    ctl:ruleRemoveTargetById=932125;ARGS:json.message,\
    ctl:ruleRemoveTargetById=932230;ARGS:json.message,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.message,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.message,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.message,\
    ctl:ruleRemoveTargetById=932370;ARGS:json.message,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# 4. Message in the query string, two flows (ids 9864130 and 9864131). Only "message" (and the alias
# "m" on GET) loses the seven rules. "title" and every other parameter keep all of them. Each flow
# carries only its own method and path.
# 9864130: GET /<topic>/publish?message=... (also /send and /trigger) from scripts and automation
# tools, the form in the ntfy "Publish via GET" documentation. ntfy routes no other GET path to a
# publish handler.
SecRule REQUEST_FILENAME "@rx \A/[-_A-Za-z0-9]{1,64}/(?:publish|send|trigger)\z" \
    "id:9864130,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS:message,\
    ctl:ruleRemoveTargetById=930120;ARGS:m,\
    ctl:ruleRemoveTargetById=932125;ARGS:message,\
    ctl:ruleRemoveTargetById=932125;ARGS:m,\
    ctl:ruleRemoveTargetById=932230;ARGS:message,\
    ctl:ruleRemoveTargetById=932230;ARGS:m,\
    ctl:ruleRemoveTargetById=932235;ARGS:message,\
    ctl:ruleRemoveTargetById=932235;ARGS:m,\
    ctl:ruleRemoveTargetById=932250;ARGS:message,\
    ctl:ruleRemoveTargetById=932250;ARGS:m,\
    ctl:ruleRemoveTargetById=932260;ARGS:message,\
    ctl:ruleRemoveTargetById=932260;ARGS:m,\
    ctl:ruleRemoveTargetById=932370;ARGS:message,\
    ctl:ruleRemoveTargetById=932370;ARGS:m,\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        nolog"

# 9864131: PUT /<topic>?message=... The publish dialog of the web app with an attachment: the body
# is the file, so the dialog puts the message in the query string (always PUT, and it never sends
# "m").
SecRule REQUEST_FILENAME "@rx \A/[-_A-Za-z0-9]{1,64}\z" \
    "id:9864131,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS:message,\
    ctl:ruleRemoveTargetById=932125;ARGS:message,\
    ctl:ruleRemoveTargetById=932230;ARGS:message,\
    ctl:ruleRemoveTargetById=932235;ARGS:message,\
    ctl:ruleRemoveTargetById=932250;ARGS:message,\
    ctl:ruleRemoveTargetById=932260;ARGS:message,\
    ctl:ruleRemoveTargetById=932370;ARGS:message,\
    chain"
    SecRule REQUEST_METHOD "@streq PUT" \
        "t:none,\
        nolog"

# 5. Matrix push gateway (id 9864140).
# POST /_matrix/push/v1/notify: a Matrix homeserver forwards chat messages; the text is in
# notification.content.body and is whatever people type.
SecRule REQUEST_FILENAME "@streq /_matrix/push/v1/notify" \
    "id:9864140,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS:json.notification.content.body,\
    ctl:ruleRemoveTargetById=932125;ARGS:json.notification.content.body,\
    ctl:ruleRemoveTargetById=932230;ARGS:json.notification.content.body,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.notification.content.body,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.notification.content.body,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.notification.content.body,\
    ctl:ruleRemoveTargetById=932370;ARGS:json.notification.content.body,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# 6. Passwords (id 9864150).
# Passwords are arbitrary secrets. About 2 in 100 random 20-character passwords from all printable
# ASCII get blocked (rules 942100, 932130, 942540), so a password manager hits this regularly. Only
# the JSON password fields lose the six rules that fired on passwords. The same payload in any
# other field, or on any other path, stays blocked.
# Paths: POST /v1/account (sign-up), POST /v1/account/password (change), DELETE /v1/account
# (confirm password), POST /v1/account/password/reset, POST and PUT /v1/users (admin).
SecRule REQUEST_FILENAME "@rx \A/v1/(?:account(?:/password(?:/reset)?)?|users)\z" \
    "id:9864150,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.password,\
    ctl:ruleRemoveTargetById=932130;ARGS:json.new_password,\
    ctl:ruleRemoveTargetById=932230;ARGS:json.password,\
    ctl:ruleRemoveTargetById=932230;ARGS:json.new_password,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.password,\
    ctl:ruleRemoveTargetById=932250;ARGS:json.new_password,\
    ctl:ruleRemoveTargetById=933180;ARGS:json.password,\
    ctl:ruleRemoveTargetById=933180;ARGS:json.new_password,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.password,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.new_password,\
    ctl:ruleRemoveTargetById=942540;ARGS:json.password,\
    ctl:ruleRemoveTargetById=942540;ARGS:json.new_password,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT|DELETE)\z" \
        "t:none,\
        nolog"

# 7. Webhook senders that post their own JSON to a topic (id 9864160).
# Grafana, Alertmanager, GitHub (ntfy's built-in ?template=github|grafana|alertmanager), Gitea,
# Uptime Kuma's webhook and inline templates (?template=yes) send JSON with Content-Type
# application/json to /<topic>. The CRS parses it into ARGS:json.<path>, including every array
# element (json.alerts.array_0..., json.commits.array_3...). The array length is unbounded, so the
# targets cannot be named: ARGS stays uninspected by the eight rules below, on this method, path and
# Content-Type only. The same text sent as text/plain is not inspected at all (raw body, section 1),
# so this opens nothing a text/plain post has not. Rule 932160 (Unix shell code) joins the seven
# rules of sections 2 to 5 here: it fires on cron lines.
# Scope: PUT or POST on /<topic> (never /v1/...) with a JSON body.
SecRule REQUEST_FILENAME "@rx \A/[-_A-Za-z0-9]{1,64}\z" \
    "id:9864160,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS,\
    ctl:ruleRemoveTargetById=932125;ARGS,\
    ctl:ruleRemoveTargetById=932230;ARGS,\
    ctl:ruleRemoveTargetById=932235;ARGS,\
    ctl:ruleRemoveTargetById=932250;ARGS,\
    ctl:ruleRemoveTargetById=932260;ARGS,\
    ctl:ruleRemoveTargetById=932370;ARGS,\
    ctl:ruleRemoveTargetById=932160;ARGS,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:PUT|POST)\z" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "@beginsWith application/json" \
            "t:none,\
            t:lowercase,\
            nolog"

# 8. The JSON calls of the web app (id 9864170).
# The ntfy web app sends every JSON body with fetch and no Content-Type header, so the browser
# labels it text/plain;charset=UTF-8. Rule 920420 refuses text/plain, so without this entry the
# signed-in web app gets 403 on: publish from the dialog (PUT /), change password, create or edit
# an access token, save settings, add or remove a synced subscription, reserve a topic, sign up,
# delete the account and enable web push. Text/plain is not parsed, so no argument is inspected
# here either way. Only rule 920420 on the Content-Type header is removed. Cost: the text/plain
# type is accepted on those paths.
# Scope: PUT, POST, PATCH or DELETE on the listed ntfy API paths with a text/plain body. /v1/users
# (the admin API, JSON from scripts) and every other path keep the rule.
SecRule REQUEST_FILENAME "@rx \A/(?:v1/(?:account(?:/(?:password(?:/reset(?:/request)?)?|token|settings|subscription|reservation(?:/[-_A-Za-z0-9]{1,64})?|phone(?:/verify)?|email(?:/(?:verify|primary|resend))?))?|webpush))?\z" \
    "id:9864170,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920420;REQUEST_HEADERS:Content-Type,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:PUT|POST|PATCH|DELETE)\z" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "@beginsWith text/plain" \
            "t:none,\
            t:lowercase,\
            nolog"

# 9. GitHub issue, pull request and comment bodies (id 9864180).
# ntfy's github template renders the title and body text of an issue or a pull request and the body
# of a comment. Developers paste SQL statements and "curl ... | sh" lines in them, which also trip
# SQL injection rules 942100 and 942190 and the SSRF rule 934110. Those three rules are removed from
# these five fields only (named targets, no ARGS), and only when the URL asks for the github
# template.
# Scope: POST /<topic>?template=github with a JSON body.
SecRule REQUEST_FILENAME "@rx \A/[-_A-Za-z0-9]{1,64}\z" \
    "id:9864180,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.issue.body,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.issue.title,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.pull_request.body,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.pull_request.title,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.comment.body,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.issue.body,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.issue.title,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.pull_request.body,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.pull_request.title,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.comment.body,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.issue.body,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.issue.title,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.pull_request.body,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.pull_request.title,\
    ctl:ruleRemoveTargetById=934110;ARGS:json.comment.body,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        chain"
        SecRule ARGS:template "@streq github" \
            "t:none,\
            t:lowercase,\
            chain"
            SecRule REQUEST_HEADERS:Content-Type "@beginsWith application/json" \
                "t:none,\
                t:lowercase,\
                nolog"
