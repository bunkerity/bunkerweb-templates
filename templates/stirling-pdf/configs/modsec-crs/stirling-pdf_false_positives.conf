# Tested with Stirling-PDF 3.4.0, BunkerWeb 1.6.17 and CRS 4.29. These rules load before the CRS.
# Each rule lets one kind of Stirling-PDF request past the CRS rules that mistake it for an attack.
# It applies to one exact path and one method, and removes the named CRS rules from one named
# argument only. The same content in another argument, path or method is still blocked.
# The anomaly score rules 949110 and 959100 are never touched.
# To allow another field, copy a rule and change its id, path, method and argument name.

# Automate through the API: the pipeline definition (the operations, their settings and
# placeholders such as {outputFolder}) is sent as JSON text in the form field json.
# CRS rule 942550 reads that text as an injection. This removes 942550 for that field only.
SecRule REQUEST_FILENAME "@streq /api/v1/pipeline/handleData" \
    "id:9880100,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=942550;ARGS:json,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# Saved signatures: the signature image is sent as a data: URI (base64 PNG) in the JSON
# field dataUrl. CRS rules 932235, 932260, 934170, 941130 and 941170 flag the data: prefix
# and the base64 text. This removes those rules for that field only.
SecRule REQUEST_FILENAME "@streq /api/v1/proprietary/signatures" \
    "id:9880110,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.dataUrl,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.dataUrl,\
    ctl:ruleRemoveTargetById=934170;ARGS:json.dataUrl,\
    ctl:ruleRemoveTargetById=941130;ARGS:json.dataUrl,\
    ctl:ruleRemoveTargetById=941170;ARGS:json.dataUrl,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

# File names: people upload files called O'Brien.pdf or report;v2.pdf. CRS rule 920120 blocks a quote,
# semicolon or equals sign in an uploaded file name. Stirling-PDF has over a hundred upload routes, so
# this rule covers every POST or PUT under /api/v1/ and removes 920120 only for the names of the file
# parts it uses (fileInput, file, files, attachments, imageFile and so on). The cost: a quote in a file
# name is no longer flagged by the WAF on those routes, so only the app checks it.
SecRule REQUEST_FILENAME "@beginsWith /api/v1/" \
    "id:9880120,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=920120;FILES:attachments,\
    ctl:ruleRemoveTargetById=920120;FILES:auditLog,\
    ctl:ruleRemoveTargetById=920120;FILES:certFile,\
    ctl:ruleRemoveTargetById=920120;FILES:data,\
    ctl:ruleRemoveTargetById=920120;FILES:file,\
    ctl:ruleRemoveTargetById=920120;FILES:fileInput,\
    ctl:ruleRemoveTargetById=920120;FILES:files,\
    ctl:ruleRemoveTargetById=920120;FILES:historyBundle,\
    ctl:ruleRemoveTargetById=920120;FILES:imageFile,\
    ctl:ruleRemoveTargetById=920120;FILES:jksFile,\
    ctl:ruleRemoveTargetById=920120;FILES:overlayFiles,\
    ctl:ruleRemoveTargetById=920120;FILES:p12File,\
    ctl:ruleRemoveTargetById=920120;FILES:privateKeyFile,\
    ctl:ruleRemoveTargetById=920120;FILES:stampImage,\
    ctl:ruleRemoveTargetById=920120;FILES:watermarkImage,\
    chain"
    SecRule REQUEST_METHOD "@rx \A(?:POST|PUT)\z" \
        "t:none,\
        nolog"
