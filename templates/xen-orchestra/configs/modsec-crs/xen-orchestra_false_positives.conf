# Xen Orchestra CRS tuning. Type is "modsec-crs" (included before the CRS) so the
# phase:1 ctl action below runs ahead of CRS rule 920420, which also fires in phase 1.
# A plain "modsec" config loads after the CRS and the removal would come too late.
#
# Config, VM and disk imports are sent as POST /api/<token> with an
# application/octet-stream body. CRS rule 920420 rejects that content type and
# answers 403. The exclusion is limited to POST on a single path segment under /api/.
# XO's JSON-RPC API runs over a WebSocket on /api/ and is not affected.
SecRule REQUEST_METHOD "@streq POST" \
    "id:10400,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/api/[^/]+$" \
        "t:none,\
        ctl:ruleRemoveById=920420"
