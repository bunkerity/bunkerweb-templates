# Xen Orchestra CRS tuning. Tested with BunkerWeb 1.6.17, CRS 4.29. Keep this file as a modsec-crs
# config: it has no effect as a modsec config. Delete the rule to turn the exception off.
#
# Config, VM and disk imports are sent as POST /api/<token> with an application/octet-stream body.
# CRS rule 920420 rejects that content type and answers 403. The exclusion is limited to POST on a
# single path segment under /api/. Cost: any content type is accepted there, and a raw upload body
# is not inspected. XO's JSON-RPC API runs over a WebSocket on /api/ and is not affected.
SecRule REQUEST_METHOD "@streq POST" \
    "id:9879100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@rx \A/api/[^/]+\z" \
        "t:none,\
        ctl:ruleRemoveById=920420"
