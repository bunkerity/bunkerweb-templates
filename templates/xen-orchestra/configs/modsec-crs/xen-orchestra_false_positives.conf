# Xen Orchestra rule exceptions for the OWASP Core Rule Set. Tested with Xen Orchestra from
# sources (XO 6 and XO 5 interfaces), BunkerWeb 1.6.17 and CRS 4.29. Keep this config type as
# ModSecurity CRS: the exceptions only work when they load before the CRS. Delete a rule below to
# turn its exception off.
#
# Config, VM and disk imports are sent as POST /api/<token> with an application/octet-stream body.
# CRS rule 920420 rejects that content type and answers 403. This exception is limited to POST on a
# single path segment under /api/. Cost: any content type is accepted there, and a raw upload body
# is not inspected. XO 5 runs its JSON-RPC API over a WebSocket on /api/, which this does not touch.
SecRule REQUEST_METHOD "@streq POST" \
    "id:9879100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@rx \A/api/[^/]+\z" \
        "t:none,\
        ctl:ruleRemoveById=920420"

# XO 6 loads its lists from GET /rest/v0/<type> and names the properties it wants in the "fields"
# parameter. The host list asks for startTime, version and bios_strings, and CRS rule 932235 reads
# that list as a Unix command and answers 403, so the dashboard, the tree view and the host pages
# stay empty. This exception skips rule 932235 for the "fields" parameter of GET requests under
# /rest/v0/. Cost: that one parameter is no longer checked for Unix commands on those paths. XO only
# uses it to pick which properties to return. Every other CRS rule still checks it, and rule 932235
# still checks every other parameter and every other path.
SecRule REQUEST_METHOD "@streq GET" \
    "id:9879101,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@beginsWith /rest/v0/" \
        "t:none,t:normalizePath,\
        ctl:ruleRemoveTargetById=932235;ARGS:fields"
