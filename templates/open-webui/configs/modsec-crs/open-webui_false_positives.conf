# Open WebUI exclusions. Tested with Open WebUI 0.13.3, BunkerWeb 1.6.17, CRS 4.29. Keep this file
# as a modsec-crs config: it has no effect as a modsec config. Delete a rule to turn its exception
# off, and the Open WebUI feature it covers then gets 403 on text that looks like an attack.
#
# Every rule id below matched legitimate Open WebUI content: SQL, shell, HTML and code pasted into
# chats, notes, prompts and model settings, and a data URI avatar. The rules skipped are the path
# traversal, shell, PHP, XSS, SQL injection and Java ones. Each exclusion needs the method AND the
# exact path. Where the field has a fixed name, the rules are turned off for that one argument
# only. Cost: those rules do not check that argument, so Open WebUI must store and render the text
# safely. The same payload in any other argument, path or method is still blocked. Rules 949110
# and 959100 (the ones that block a request once its CRS score is too high) are never touched.
# A few rules (921110, 944100, 944110, 944130) also read the whole JSON body next to the
# arguments, so these exclusions turn them off for the body of that request too.
# Where the argument name changes with every request (chat prompt, saved chat), the rules are
# turned off for that path and method as a whole, so every argument of that one request skips them.
# These rules cost more.

# Sign-up and profile update send the avatar as a data URI (base64 PNG).
SecRule REQUEST_FILENAME "@rx \A/api/v1/auths/(?:signup|update/profile)\z" \
    "id:9865101,\
    phase:1,\
    pass,\
    t:none,\
    t:normalizePath,\
    nolog,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.profile_image_url,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.profile_image_url,\
    ctl:ruleRemoveTargetById=934170;ARGS:json.profile_image_url,\
    ctl:ruleRemoveTargetById=941130;ARGS:json.profile_image_url,\
    ctl:ruleRemoveTargetById=941170;ARGS:json.profile_image_url,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog"

