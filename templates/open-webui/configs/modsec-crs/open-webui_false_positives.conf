# The prompt travels as json.messages.array_<N>.content, with N growing with the chat (an image adds
# ...content.array_<M>.image_url.url, and embeddings use json.input.array_<N>). No argument name
# can be written down, so the rules are turned off for the whole request. Cost: injection text
# anywhere in a prompt is not flagged. The same body shape is used on the OpenAI, Ollama and
# Anthropic-style API paths that clients call.
