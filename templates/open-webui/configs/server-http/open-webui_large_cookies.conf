# Open WebUI 0.13.3 behind BunkerWeb 1.6.17: single sign-on cookies can be large.
# After an OpenID Connect sign-in Open WebUI keeps the provider's tokens in cookies (oauth_id_token,
# oauth_session_id, token). The browser sends all of them back in one Cookie header, and nginx answers
# 400 when one header line is longer than a buffer (8k by default; a 9 KB Cookie header was measured).
# Allows header lines up to 32k. Delete this file if you only use passwords.
large_client_header_buffers 4 32k;
