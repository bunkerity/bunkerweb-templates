# Open WebUI single sign-on cookies can be large. Tested with Open WebUI 0.13.3, BunkerWeb 1.6.17.
# After an OpenID Connect sign-in, Open WebUI keeps the provider tokens in cookies (oauth_id_token,
# oauth_session_id, token). The browser sends all of them back in one Cookie header, and nginx
# answers 400 when one header line is longer than a buffer (8k by default, and a 9 KB Cookie header
# fails). This file allows header lines up to 32k, which costs a little more memory per busy
# connection. Delete it if you only use passwords, or lower the 32k to your largest cookie header.
large_client_header_buffers 4 32k;
