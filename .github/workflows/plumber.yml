name: Plumber CI/CD security scan

on:
  schedule:
    - cron: "30 9 * * 1"
  workflow_call:

jobs:
  plumber:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write # OIDC identity required by score-push
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Run Plumber
        uses: getplumber/plumber@ec8cb3a7edd6a324b33e85109b627b2df6023d94 # v0.7.23
        with:
          verify-attestation: true
          config-file: .github/plumber/plumber.yaml
          min-score: B
          soft-fail: false
          upload-sarif: true
          score-push: true
          # The action uploads with a fixed 30-day retention, above this repository's 15-day limit
          upload-artifacts: false
      - name: Upload Plumber report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plumber-report
          path: |
            plumber-report.json
            plumber-pbom.json
            plumber-cyclonedx-sbom.json
            plumber.sarif
          if-no-files-found: ignore
          retention-days: 15
